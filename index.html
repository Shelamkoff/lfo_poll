азделе дополнительных условий; обязательные правила о крупных сделках сохраняют силу независимо от выбранного внутреннего порога.","number":true,"min":0.01,"step":0.01},{"id":"controls","label":"Нужны ли дополнительные механизмы внутреннего или внешнего контроля?","type":"radio","required":false,"options":[{"value":"standard","label":"Только предусмотренный законом"},{"value":"auditor","label":"Ревизор или ревизионная комиссия"},{"value":"external","label":"Внешняя независимая проверка / аудит"},{"value":"both","label":"Внутренний контроль и внешний аудит"}],"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"notForm":["fund"]}]},"explain":"Обязательные по закону контрольно-надзорные органы конкретных видов НКО не отменяются выбором минимального варианта."},{"id":"documents","label":"Как предоставить участникам или учредителям доступ к документам организации?","type":"radio","required":true,"options":[{"value":"standard","label":"Предусмотреть порядок по закону без дополнительных способов"},{"value":"electronic","label":"Электронные копии по запросу и ознакомление по закону"},{"value":"portal","label":"Защищённая система доступа и ознакомление по закону"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"source":["oo12","oo50"],"explain":"Устав ООО должен определять порядок хранения документов и предоставления информации. Нельзя лишить участника установленного законом права на доступ к документам."}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"llc_capital","title":"ООО: капитал и доли","questions":[{"id":"llc_capital_amount","label":"Каков размер уставного капитала ООО (в рублях)?","type":"input","required":true,"when":{"form":["ooo"]},"placeholder":"Например: 10000","source":["oo14","gk662"],"explain":"Для обычного ООО минимальный размер уставного капитала 10 000 рублей (ст. 14 закона № 14-ФЗ). Минимальная сумма оплачивается деньгами (ст. 66.2 ГК РФ); для отдельных регулируемых видов деятельности закон может требовать большего капитала. Укажите сумму рублями (число без текста).","number":true,"min":10000,"step":1,"help":"Для обычного ООО минимальный капитал — 10 000 ₽, он оплачивается деньгами. Укажите размер самостоятельно; поле не заполняется автоматически. Специальный закон может устанавливать больший минимум."},{"id":"llc_capital_payment","label":"Как планируется оплатить уставный капитал ООО?","type":"radio","required":true,"options":[{"value":"money","label":"Полностью денежными средствами"},{"value":"money_property","label":"Минимум по закону — деньгами, оставшуюся часть — деньгами и/или имуществом"}],"when":{"form":["ooo"]},"source":["gk662","oo16"],"explain":"Общий минимум уставного капитала ООО (10 000 рублей) обязательно оплачивается денежными средствами. Неденежные вклады возможны лишь сверх этого минимума и требуют независимой оценки. При капитале ровно 10 000 рублей выберите полную денежную оплату."},{"id":"llc_shares","label":"Как будут распределены доли между учредителями ООО?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"placeholder":"Например: участник А — 60 %, участник Б — 40 % (итого 100 %). Имена для устава не требуются.","source":["oo14"],"explain":"Точные доли нужны для пакета документов о создании ООО и проектирования управления, но в индивидуальном уставе обычно не перечисляют Ф. И. О. участников."},{"id":"llc_moreowners","label":"Планируется ли в будущем принимать в ООО новых участников?","type":"radio","required":false,"options":[{"value":"yes","label":"Да, возможность входа новых участников важна"},{"value":"no","label":"Нет, состав планируется постоянным"},{"value":"maybe","label":"Возможно в будущем"}],"when":{"form":["ooo"]}},{"id":"llc_profit","label":"Как часто общество сможет принимать решение о распределении чистой прибыли?","type":"radio","required":false,"options":[{"value":"quarter","label":"Ежеквартально"},{"value":"half","label":"Раз в полгода"},{"value":"year","label":"Раз в год"},{"value":"asneeded","label":"Распределять только при необходимости, в сроки, разрешённые законом"}],"when":{"form":["ooo"]},"explain":"Статья 28 закона № 14-ФЗ предусматривает принятие решения о распределении чистой прибыли ежеквартально, раз в полгода либо раз в год. Возможность распределить прибыль также ограничена законом; это не автоматическая выплата денег с расчётного счёта.","source":["oo28"],"help":"Это не означает обязанности ежегодно распределять прибыль: решение принимают только при наличии оснований и желании участников, с соблюдением ограничений закона."},{"id":"llc_profit_order","label":"В каком порядке распределять чистую прибыль между участниками?","type":"radio","required":true,"options":[{"value":"proportional","label":"Пропорционально долям в уставном капитале"},{"value":"special","label":"Нужен иной порядок распределения — описать отдельно"}],"when":{"form":["ooo"]},"explain":"По общему правилу распределяемая прибыль делится пропорционально долям. Иной порядок допускается при соблюдении специальных требований ст. 28 закона № 14-ФЗ, в частности единогласного решения при утверждении соответствующего положения устава.","source":["oo28"]},{"id":"llc_profit_order_details","label":"Какой особый порядок распределения прибыли нужен?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_profit_order","in":["special"]}]},"placeholder":"Например, фиксированная пропорция или иная согласованная формула с соблюдением закона."},{"id":"llc_exit","label":"Предусмотреть ли право участника выйти из ООО по заявлению?","type":"radio","required":true,"options":[{"value":"no","label":"Не предусматривать"},{"value":"all","label":"Предусмотреть для участников"},{"value":"conditional","label":"Предусмотреть в отношении определённых лиц / при определённых условиях"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo26"],"explain":"Выход по заявлению существует только если он предусмотрен уставом. Он отличается от продажи доли; выход единственного участника, в результате которого не остаётся участников, не допускается."},{"id":"llc_exit_terms","label":"Каким участникам и при каких условиях предоставить право выхода?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_exit","in":["conditional"]}]},"placeholder":"Например: при достижении определённого срока участия или для участников с определённой долей.","source":["oo26"]},{"id":"llc_transfer","label":"Какие правила продажи или иного отчуждения долей третьим лицам необходимы?","type":"radio","required":true,"options":[{"value":"law","label":"По законным правилам без дополнительного запрета"},{"value":"consent","label":"С согласия участников / общества в допустимом порядке"},{"value":"ban","label":"Предусмотреть запрет отчуждения третьим лицам"}],"when":{"form":["ooo"]},"source":["oo21"],"explain":"Правила отчуждения долей важны и в ООО с одним участником: они определяют возможность вступления новых лиц и дальнейшего оборота долей. Закон позволяет дополнительно ограничить переход доли к третьим лицам, но требует соблюдения гарантий."},{"id":"llc_preempt","label":"Нужно ли изменить законный порядок преимущественной покупки долей?","type":"radio","required":true,"options":[{"value":"law","label":"Оставить законный порядок"},{"value":"modified","label":"Установить разрешённые законом особенности цены или распределения"},{"value":"nonapply","label":"Проработать допустимое законом неприменение преимущественного права"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo21"],"explain":"С 2025 года закон допускает отдельные специальные условия о преимущественном праве. Они не вводятся произвольно и требуют проверки предусмотренных законом условий."},{"id":"llc_preempt_details","label":"Какие особые условия преимущественной покупки долей предлагаются?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_preempt","in":["modified","nonapply"]}]},"placeholder":"Например: иная цена предложения доли, особенности распределения права между участниками либо его неприменения в предусмотренных законом случаях.","explain":"Ограничение или изменение преимущественного права требует точной формулировки и соблюдения статьи 21 закона № 14-ФЗ. Окончательный механизм согласовывается юристом.","source":["oo21"]},{"id":"llc_inheritance","label":"Требуется ли согласие других участников для перехода доли по наследству или правопреемству?","type":"radio","required":true,"options":[{"value":"law","label":"По законному порядку"},{"value":"consent","label":"С согласия остальных участников в случаях, допустимых законом"}],"when":{"form":["ooo"]},"source":["oo21"],"explain":"Устав может предусматривать необходимость согласия остальных участников на переход доли к наследникам или правопреемникам в случаях, предусмотренных законом. Для ООО с одним участником правило тоже имеет значение, если состав участников изменится."},{"id":"llc_vote","label":"Как определяется количество голосов каждого участника ООО?","type":"radio","required":true,"options":[{"value":"shares","label":"По долям участников (обычный порядок)"},{"value":"other","label":"Нужен иной порядок, который необходимо согласовать с законом"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo37"],"explain":"Обычное правило связано с размером доли. Изменение порядка требует соблюдения специальных правил закона и может не подходить для типового устава."},{"id":"llc_vote_details","label":"Как именно должны распределяться голоса?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_vote","in":["other"]}]},"placeholder":"Опишите специальный порядок распределения голосов; сумма и пределы должны соответствовать закону.","explain":"Доли и число голосов нельзя произвольно изменить без соблюдения требований статьи 32 закона № 14-ФЗ. Не путайте число голосов с повышенным большинством по отдельным решениям.","source":["oo32","oo37"]},{"id":"llc_council","label":"Нужен ли совет директоров / наблюдательный совет?","type":"radio","required":false,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, нужен"}],"when":{"form":["ooo"]},"source":["oo32"]},{"id":"llc_council_details","label":"Состав, срок и реальные полномочия совета директоров","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_council","in":["yes"]}]},"placeholder":"Например: 3 члена; 3 года; контролирует бюджет, согласует сделки.","source":["oo32"],"explain":"Совет не может получить вопросы исключительной компетенции общего собрания, которые закон не позволяет передавать."},{"id":"llc_eo_appoint","label":"Какой орган избирает / назначает руководителя ООО?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание участников"},{"value":"council","label":"Совет директоров в пределах предусмотренных законом полномочий"}],"when":{"all":[{"form":["ooo"]},{"id":"llc_council","in":["yes"]}]},"explain":"По общему правилу руководителя избирает общее собрание участников. Если предусмотрен совет директоров, устав может передать ему это полномочие. Факт принятия решения о назначении руководителя подлежит нотариальному удостоверению в предусмотренных законом случаях.","source":["oo40"]},{"id":"llc_certify","label":"Как удостоверять решения участников ООО?","type":"radio","required":true,"options":[{"value":"notary","label":"Нотариально, когда это требуется законом"},{"value":"alternative","label":"Предусмотреть допустимый законом альтернативный способ"}],"when":{"form":["ooo"]},"source":["gk671","oo40"],"explain":"По пп. 3 п. 3 ст. 67.1 ГК РФ общее правило — нотариальное удостоверение решений; устав или надлежащим образом принятое решение может установить допустимый альтернативный способ. Это относится и к решениям единственного участника с учётом особенностей их оформления. При этом ряд решений, включая назначение единоличного исполнительного органа, должен удостоверяться нотариально независимо от альтернативного способа (ст. 40 закона № 14-ФЗ и предусмотренные законом исключения).","help":"Некоторые решения ООО должны быть удостоверены нотариусом независимо от альтернативного способа, в том числе в установленных законом случаях назначение руководителя."},{"id":"llc_certify_method","label":"Какой альтернативный способ подтверждения решений предусмотреть?","type":"radio","required":true,"options":[{"value":"all_sign","label":"Подписание протокола всеми участниками или решения единственным участником"},{"value":"part_sign","label":"Подписание протокола определёнными участниками (если участников больше одного)"},{"value":"technical","label":"Технические средства, достоверно подтверждающие принятие решения"}],"when":{"all":[{"form":["ooo"]},{"id":"llc_certify","in":["alternative"]}]},"explain":"Альтернативный способ подтверждения следует конкретно закрепить в уставе или надлежащем единогласном решении участников. Для единственного участника оформляется решение, а не протокол общего собрания. Альтернативный способ не отменяет случаи обязательного нотариального удостоверения, включая предусмотренное ст. 40 закона № 14-ФЗ удостоверение факта назначения руководителя.","source":["gk671","oo40"]},{"id":"llc_meeting_conflict","label":"Нужен ли способ разрешения управленческих разногласий при равенстве голосов?","type":"radio","required":false,"options":[{"value":"no","label":"Нет, обычных правил достаточно"},{"value":"negotiation","label":"Обязательное повторное обсуждение или переговоры"},{"value":"agreement","label":"Отдельное корпоративное соглашение / механизм выкупа при тупике"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"explain":"Нельзя просто отменить законные пороги голосования. Часть договорённостей об опционе, выкупе доли или конфликте лучше оформлять корпоративным договором, а не уставом."},{"id":"llc_special_rights","label":"Нужны ли дополнительные права или обязанности определённых участников?","type":"radio","required":false,"options":[{"value":"no","label":"Нет, достаточно закона"},{"value":"yes","label":"Да, требуется отдельное описание"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo12"]},{"id":"llc_special_details","label":"Какие именно дополнительные права или обязанности нужны?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_special_rights","in":["yes"]}]},"placeholder":"Например: специальные права на информацию или обязанность участвовать в согласованных проектах."},{"id":"llc_obligations","label":"Нужны ли дополнительные обязанности участников ООО?","type":"radio","required":false,"options":[{"value":"statutory","label":"Нет, достаточно обязанностей по закону"},{"value":"additional","label":"Да, дополнительно предусмотреть обязанности в пределах закона"}],"when":{"form":["ooo"]},"explain":"Обязанности по закону будут включены в устав в любом случае. Дополнительные обязанности и права участников требуют точной формулировки и соблюдения порядка их введения.","source":["oo12"]},{"id":"llc_obligations_details","label":"Какие дополнительные обязанности предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_obligations","in":["additional"]}]},"placeholder":"Например: предоставление определённых сведений обществу, соблюдение внутренних процедур в пределах закона."},{"id":"llc_charter_mode","label":"Какой устав ООО планируется использовать?","type":"radio","required":true,"options":[{"value":"individual","label":"Индивидуальный устав по согласованным условиям"},{"value":"typical","label":"Проверить, подходит ли один из типовых уставов ФНС"}],"when":{"form":["ooo"]},"source":["oo12","fns"],"explain":"Типовой устав, утверждённый ФНС, применяется без редактирования. Нужно выбрать конкретный вариант и проверить его условия о выходе, продаже долей, управлении и подтверждении решений. Если индивидуальные правила не совпадают с выбранным типовым уставом, требуется индивидуальная редакция."},{"id":"llc_typical_number","label":"Какой номер типового устава ООО (от 1 до 36) выбран?","type":"input","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_charter_mode","in":["typical"]}]},"source":["fns","oo12"],"help":"Существуют 36 утверждённых типовых уставов ООО. Их текст нельзя произвольно менять. Для нестандартных условий потребуется индивидуальный устав.","explain":"На сайте ФНС необходимо выбрать конкретный утверждённый типовой устав и проверить его условия. Номер не заменяет проверку применимости к решениям участников. Изменять текст типового устава нельзя.","number":true,"min":1,"step":1,"max":36}],"when":{"form":["ooo"]}},{"id":"association_members","title":"Ассоциация: членство","questions":[{"id":"assoc_members","label":"Кого можно принимать в члены ассоциации?","type":"multi","required":true,"options":[{"value":"people","label":"Физических лиц"},{"value":"legal","label":"Юридических лиц"}],"when":{"form":["association"]},"source":["gk1238","gk1239"],"explain":"Ассоциация объединяет граждан и/или юридических лиц. Профессиональные или иные объективные критерии членства могут быть закреплены в уставе, но не должны нарушать императивные корпоративные права членов.","help":"Можно выбрать оба варианта. Наличие профессиональных требований к кандидатам определяется в следующем вопросе."},{"id":"assoc_criteria_mode","label":"Нужны ли специальные условия приёма в члены ассоциации?","type":"radio","required":true,"when":{"form":["association"]},"options":[{"value":"general","label":"Нет, достаточно общего соответствия целям и уставу"},{"value":"special","label":"Да, профессиональные или иные объективные критерии"}],"explain":"Требования к кандидатам должны быть определёнными и соответствовать целям объединения. Например, профиль деятельности, профессиональная квалификация либо осуществление деятельности в определённой сфере.","source":["gk1239","gk12311"]},{"id":"assoc_criteria","label":"Каковы объективные требования к новым членам?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_criteria_mode","in":["special"]}]},"placeholder":"Например: осуществление деятельности в определённой профессиональной сфере, соблюдение отраслевых требований.","help":"Например: осуществление деятельности в определённой отрасли, наличие профильной квалификации, принятие правил профессиональной этики."},{"id":"assoc_admission","label":"Какой орган принимает новых членов?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание членов"},{"value":"board","label":"Совет / правление"},{"value":"director","label":"Единоличный исполнительный орган"}],"when":{"form":["association"]},"explain":"Порядок приёма утверждает высший орган. Принятие конкретного кандидата может относиться к компетенции другого органа, если это допускается законом и однозначно закреплено в уставе.","source":["gk653","gk12311"]},{"id":"assoc_membership_start","label":"С какого момента возникает членство в ассоциации?","type":"radio","required":true,"options":[{"value":"resolution","label":"Со дня решения компетентного органа о приёме"},{"value":"date","label":"С иной определённой даты, указанной в решении"}],"when":{"form":["association"]},"source":["gk1239","gk12311"],"help":"Порядок приёма должен быть определённым; укажите момент возникновения корпоративных прав и обязанностей.","explain":"Статья 123.9 ГК РФ требует указывать в уставе порядок приёма и выхода членов."},{"id":"assoc_admission_procedure","label":"Какие действия входят в процедуру приёма?","type":"multi","required":false,"options":[{"value":"application","label":"Заявление кандидата"},{"value":"documents","label":"Подтверждение соответствия условиям членства"},{"value":"decision","label":"Решение компетентного органа"},{"value":"notification","label":"Уведомление кандидата о решении"},{"value":"register","label":"Внесение в реестр членов"}],"when":{"form":["association"]},"help":"Решение о приёме и момент возникновения членства должны быть определены уставом независимо от ответа. При необходимости отметьте дополнительные документируемые действия: запрос документов, уведомление и ведение реестра.","explain":"По ст. 123.9 ГК РФ устав должен установить порядок приёма, а по ст. 65.3 ГК РФ высший орган определяет правила приёма и исключения. Нельзя считать порядок завершённым без органа принятия решения, момента вступления в членство и способа фиксации решения.","source":["gk1239","gk653"]},{"id":"assoc_member_categories","label":"Предусматривать ли разные категории членов или партнёров без членства?","type":"radio","required":false,"options":[{"value":"single","label":"Нет, для всех одинаковый статус"},{"value":"different","label":"Разные категории действительных членов"},{"value":"partners","label":"Единое членство, а также партнёры без корпоративных прав"}],"when":{"form":["association"]},"source":["gk12311"],"explain":"Нельзя создать фиктивных «членов» с произвольным лишением обязательных корпоративных прав. Партнёры без членства могут участвовать в проектах по договору."},{"id":"assoc_category_details","label":"Чем должны отличаться категории членов или статус партнёров?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_member_categories","in":["different","partners"]}]},"placeholder":"Например: партнёры участвуют в мероприятиях, но не являются членами и не голосуют."},{"id":"assoc_vote","label":"Как распределять голоса членов ассоциации на общем собрании?","type":"radio","required":true,"options":[{"value":"equal","label":"Один член — один голос"},{"value":"special","label":"Хотим иной порядок — юридически проверить допустимость"}],"when":{"form":["association"]},"source":["gk12311","gk653"],"explain":"Нужно учитывать корпоративные права членов и характер выбранной ассоциации. Специальный порядок требует отдельной правовой проверки."},{"id":"assoc_member_rights","label":"Какие дополнительные возможности предоставлять членам?","type":"multi","required":false,"options":[{"value":"events","label":"Льготы на мероприятия или образовательные программы"},{"value":"experts","label":"Экспертная или информационная поддержка"},{"value":"projects","label":"Участие в рабочих группах и проектах"},{"value":"other","label":"Иные преимущества"}],"help":"Законные корпоративные права членов (участие в управлении и доступ к информации) сохраняются независимо от выбора.","when":{"form":["association"]},"source":["gk12311"]},{"id":"assoc_property_rights","label":"Какие имущественные права будут у членов ассоциации?","type":"radio","required":true,"when":{"form":["association"]},"options":[{"value":"standard","label":"Применять законную модель: имущество принадлежит ассоциации, прибыль между членами не распределяется, законные права членов сохраняются"},{"value":"additional","label":"Предусмотреть дополнительные допустимые имущественные права и компенсации — описать отдельно"}],"source":["gk1239","gk12311","nko20"],"explain":"Устав ассоциации обязательно определяет имущественные права и обязанности членов (п. 2 ст. 123.9 ГК РФ). Члены не приобретают долю в имуществе ассоциации, а полученная прибыль не распределяется между ними. На равных началах они могут безвозмездно пользоваться услугами ассоциации, если законом не предусмотрено иное (ст. 123.11 ГК РФ). Возмещение обоснованных расходов или дополнительные услуги можно предусматривать в пределах закона."},{"id":"assoc_property_rights_details","label":"Какие дополнительные имущественные права или компенсации нужны?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_property_rights","in":["additional"]}]},"placeholder":"Например: компенсация подтверждённых расходов при выполнении поручений ассоциации, возмещение расходов на участие в мероприятиях.","explain":"Опишите конкретные условия и получателей компенсаций. Нельзя превращать их в скрытое распределение прибыли или долей имущества при ликвидации.","source":["gk1239","gk12311","nko20"]},{"id":"assoc_extra_duties","label":"Нужны ли членам дополнительные обязанности помимо установленных законом?","type":"radio","required":false,"options":[{"value":"statutory","label":"Нет, достаточно обязательных правил и взносов"},{"value":"additional","label":"Да, предусмотреть специальные обязанности"}],"when":{"form":["association"]},"explain":"Члены обладают корпоративными правами по ГК РФ; дополнительные обязанности должны быть законными, определёнными и соразмерными целям объединения.","source":["gk12311"]},{"id":"assoc_extra_duties_details","label":"Какие дополнительные обязанности предусматриваются для членов?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_extra_duties","in":["additional"]}]}},{"id":"assoc_exit","label":"Как члены ассоциации смогут уведомить о выходе?","type":"radio","required":true,"options":[{"value":"written","label":"Письменным заявлением с подтверждением получения"},{"value":"electronic","label":"Письменным заявлением, включая предусмотренный уставом электронный способ"}],"when":{"form":["association"]},"source":["gk12311"],"explain":"Член ассоциации вправе выйти в любое время по своему усмотрению. Устав может определить процедуру, но не лишить права выхода."},{"id":"assoc_exclusion","label":"За какие нарушения можно исключить члена ассоциации?","type":"multi","required":true,"options":[{"value":"dues","label":"Систематическая неуплата обязательных взносов"},{"value":"breach","label":"Существенное или повторное нарушение устава"},{"value":"harm","label":"Действия, противоречащие целям ассоциации или причиняющие ей существенный вред"},{"value":"other","label":"Иные объективно определённые основания"}],"when":{"form":["association"]},"explain":"Формулировки должны быть определёнными, а процедура — предусматривать уведомление и возможность дать объяснения; решение может быть оспорено."},{"id":"assoc_exclusion_body","label":"Какой орган решает вопрос об исключении?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание"},{"value":"board","label":"Совет / правление"}],"when":{"form":["association"]}},{"id":"assoc_exit_consequences","label":"Возвращаются ли обычные членские взносы при выходе?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, уплаченные членские взносы не возвращаются"},{"value":"special","label":"Нужен специальный порядок имущественных последствий — проверить отдельно"}],"when":{"form":["association"]},"explain":"Членские взносы переходят в имущество ассоциации. Возврат обычных уплаченных взносов не следует приравнивать к распределению имущества между членами; специальные имущественные последствия прекращения членства требуют самостоятельной проверки."}],"when":{"form":["association"]}},{"id":"association_money","title":"Ассоциация: взносы и органы","questions":[{"id":"assoc_fees","label":"Какие виды взносов должны платить члены ассоциации?","type":"multi","required":true,"options":[{"value":"entry","label":"Вступительные"},{"value":"recurring","label":"Регулярные членские"},{"value":"special","label":"Дополнительные имущественные / целевые"},{"value":"none","label":"Взносы не планируются","exclusive":true}],"when":{"form":["association"]},"source":["gk12310"],"explain":"Если обязательных взносов нет, это необходимо согласовать с моделью финансирования. Членские и дополнительные имущественные взносы регулируются ст. 123.10–123.11 ГК РФ. Выбранный вариант «Без взносов» нельзя совмещать с другими видами обязательных взносов."},{"id":"assoc_fees_amount","label":"Как определить размер и периодичность обязательных взносов?","type":"radio","required":true,"options":[{"value":"resolution","label":"По решению высшего органа в установленном уставом порядке"},{"value":"formula","label":"По заранее согласованной формуле и решению высшего органа"},{"value":"details","label":"Предложить иной механизм на проверку"}],"when":{"all":[{"form":["association"]},{"id":"assoc_fees","has":["entry","recurring","special"]}]},"source":["gk12310"]},{"id":"assoc_fees_formula","label":"Укажите предполагаемую формулу или особый механизм","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_fees_amount","in":["formula","details"]}]},"placeholder":"Например: годовой взнос зависит от категории члена и утверждается общим собранием."},{"id":"assoc_debt","label":"Какие меры применять при просрочке обязательных взносов?","type":"radio","required":true,"options":[{"value":"reminder","label":"Напоминание, срок для погашения и затем возможное исключение"},{"value":"claim","label":"Взыскание долга и дополнительные меры в пределах закона"},{"value":"both","label":"Возможны оба способа"}],"when":{"all":[{"form":["association"]},{"id":"assoc_fees","has":["entry","recurring","special"]}]}},{"id":"assoc_future_count","label":"Сколько членов будет у ассоциации на момент утверждения устава?","type":"radio","required":false,"options":[{"value":"upto100","label":"Не более 100"},{"value":"over100","label":"Более 100"},{"value":"unknown","label":"Пока неизвестно"}],"when":{"form":["association"]},"source":["gk653"],"explain":"Для использования съезда или конференции в качестве высшего органа по общему правилу необходима фактическая численность членов свыше ста. Предполагаемый рост в будущем сам по себе не позволяет заменить общее собрание."},{"id":"assoc_top","label":"Какой орган будет высшим органом управления ассоциации?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание членов"},{"value":"delegates","label":"Представительный орган (съезд / конференция) — проверить условия применения"}],"when":{"form":["association"]},"source":["gk653"],"explain":"Общим высшим органом ассоциации является общее собрание членов. При численности более ста участников допускается представительный орган (съезд, конференция) с законным порядком избрания делегатов и нормой представительства (ст. 65.3 ГК РФ).","help":"При численности до 100 членов применяется общее собрание. Съезд или конференция возможны при численности более 100 членов и соблюдении условий статьи 65.3 ГК РФ."},{"id":"assoc_delegate_details","label":"Как будут избираться делегаты и сколько членов представляет каждый делегат?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_top","in":["delegates"]}]},"explain":"При представительном высшем органе устав должен определять порядок избрания делегатов и норму представительства; без этого процедурная модель неполна.","source":["gk653"],"placeholder":"Например: 1 делегат от 20 членов; выборы по группам членов на 2 года; порядок подтверждения полномочий."},{"id":"assoc_top_cadence","label":"Как часто проводить заседания высшего органа?","type":"radio","required":true,"options":[{"value":"year","label":"Ежегодно"},{"value":"half","label":"Раз в полгода"},{"value":"quarter","label":"Ежеквартально"}],"help":"Внеочередные заседания могут проводиться дополнительно.","when":{"form":["association"]}},{"id":"assoc_extraordinary","label":"Кто должен иметь возможность инициировать внеочередное собрание?","type":"multi","required":true,"options":[{"value":"head","label":"Руководитель"},{"value":"board","label":"Коллегиальный орган, если он создан"},{"value":"fraction","label":"Определённая группа членов"},{"value":"audit","label":"Контрольный орган в пределах компетенции"}],"when":{"form":["association"]}},{"id":"assoc_fraction","label":"Какая доля членов может требовать внеочередного собрания?","type":"radio","required":true,"options":[{"value":"ten","label":"Не менее 10%"},{"value":"twenty","label":"Не менее 20%"},{"value":"third","label":"Не менее одной трети"}],"when":{"all":[{"form":["association"]},{"id":"assoc_extraordinary","has":["fraction"]}]}},{"id":"assoc_election","label":"Кто и в каком порядке будет формировать исполнительные органы ассоциации?","type":"radio","required":true,"options":[{"value":"top","label":"Высший орган в пределах обязательной компетенции"},{"value":"possible_board","label":"Рассмотреть передачу допустимых отдельных полномочий коллегиальному органу"}],"when":{"form":["association"]},"source":["gk12310","gk653"],"explain":"Высший орган сохраняет исключительную компетенцию, которую нельзя произвольно передать директору или совету."},{"id":"assoc_subsidiary","label":"Предусматривать ли субсидиарную ответственность членов ассоциации?","type":"radio","required":false,"options":[{"value":"no","label":"Не вводить добровольно, если она не обязательна по специальному закону"},{"value":"yes","label":"Предусмотреть — отдельно согласовать основания, пределы и порядок"}],"when":{"form":["association"]},"source":["gk12310"],"explain":"Ответственность членов возможна, если предусмотрена законом или уставом. Это не то же самое, что обязанность платить членские взносы."},{"id":"assoc_subsidiary_details","label":"Укажите желаемые пределы субсидиарной ответственности","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_subsidiary","in":["yes"]}]},"placeholder":"Например: ограниченный размер и пропорциональное распределение — формулу проверит юрист."},{"id":"assoc_member_record","label":"Кто будет вести реестр членов ассоциации?","type":"radio","required":false,"options":[{"value":"director","label":"Исполнительный орган или назначенный им работник"},{"value":"board","label":"Секретарь / аппарат коллегиального органа"}],"when":{"form":["association"]},"explain":"Для практической работы нужен учёт членства: дата приёма и выхода, статус, задолженность по взносам. Устав фиксирует компетенцию ответственного органа и порядок доступа к реестру в допустимых пределах.","source":["gk12311","nko14"]}],"when":{"form":["association"]}},{"id":"ano","title":"АНО: учредители и управление","questions":[{"id":"ano_founders","label":"Как часто учредители АНО будут принимать решения по вопросам своей компетенции?","type":"radio","required":true,"options":[{"value":"year","label":"Ежегодно"},{"value":"half","label":"Раз в полгода"},{"value":"quarter","label":"Ежеквартально"}],"when":{"form":["ano"]},"source":["gk12325"],"explain":"Решения по вопросам, отнесённым законом к учредителям АНО, принимают учредители в порядке устава. Назначение руководителя относится к полномочиям учредителей."},{"id":"ano_founder_vote","label":"Как учредители АНО будут принимать решения в пределах уставной компетенции?","type":"radio","required":true,"options":[{"value":"statutory","label":"По обязательным требованиям закона; по иным вопросам — большинством голосов"},{"value":"additional","label":"Для отдельных допустимых вопросов предусмотреть повышенное большинство или единогласие"}],"when":{"all":[{"form":["ano"]},{"id":"founders_form","in":["2","3to50","over50"]}]},"explain":"Учредители принимают решения о назначении руководителя и других вопросах, отнесённых ГК РФ к их компетенции. Для приёма новых учредителей закон устанавливает единогласное решение. Нельзя передать предусмотренные законом полномочия учредителей стороннему органу.","source":["gk12324","gk12325"]},{"id":"ano_founder_vote_details","label":"Для каких вопросов учредителей нужно повышенное большинство?","type":"textarea","required":true,"when":{"all":[{"form":["ano"]},{"id":"ano_founder_vote","in":["additional"]}]}},{"id":"ano_founder_new","label":"Нужно ли в будущем принимать новых учредителей?","type":"radio","required":false,"options":[{"value":"no","label":"Не планируется"},{"value":"yes","label":"Да, такую возможность нужно учитывать"}],"when":{"form":["ano"]},"source":["gk12324"],"explain":"Приём новых учредителей АНО осуществляется по единогласному решению учредителей. Учредитель вправе выйти из состава учредителей по своему усмотрению."},{"id":"ano_top_body","label":"Нужен ли постоянно действующий коллегиальный орган управления АНО?","type":"radio","required":false,"options":[{"value":"no","label":"Нет, достаточна модель управления учредителями и исполнительным органом"},{"value":"yes","label":"Да, нужен постоянно действующий коллегиальный орган"}],"when":{"form":["ano"]},"source":["gk12325","nko29"],"explain":"Управление АНО осуществляют её учредители (ст. 123.25 ГК РФ). По их решению возможен постоянно действующий коллегиальный орган; его функции не должны подменять полномочия учредителей. Если он является коллегиальным высшим органом управления, работники АНО не могут составлять более одной трети его членов (ст. 29 закона № 7-ФЗ)."},{"id":"ano_board_details","label":"Каков состав, срок и круг вопросов этого органа?","type":"textarea","required":true,"when":{"all":[{"form":["ano"]},{"id":"ano_top_body","in":["yes"]}]},"placeholder":"Например: 3 человека, 3 года, согласование планов и крупных расходов."},{"id":"ano_service","label":"Каким группам получателей АНО будет оказывать услуги?","type":"radio","required":false,"options":[{"value":"public","label":"Неопределённому кругу лиц"},{"value":"target","label":"Определённым категориям получателей"},{"value":"businesses","label":"Организациям и профессиональным сообществам"}],"when":{"all":[{"form":["ano"]},{"twoForms":true}]},"source":["gk12324"],"explain":"Учредители АНО могут пользоваться её услугами только на равных условиях с другими лицами; статус учредителя сам по себе не создаёт особых льгот."}],"when":{"form":["ano"]}},{"id":"fund","title":"Фонд: органы и имущество","questions":[{"id":"fund_program","label":"Какие общественно полезные программы фонд будет реализовывать или финансировать?","type":"textarea","required":true,"when":{"form":["fund"]},"placeholder":"Например: стипендии, поддержка пациентов, проекты культуры и просвещения.","source":["gk12317"],"help":"Фонд может непосредственно реализовывать свои общественно полезные программы или финансировать их. Опишите цель, виды программ и предполагаемые направления поддержки."},{"id":"fund_beneficiaries","label":"Кто может стать получателем поддержки?","type":"multi","required":true,"options":[{"value":"individuals","label":"Физические лица в определённых жизненных обстоятельствах"},{"value":"npo","label":"НКО и общественно полезные проекты"},{"value":"institutions","label":"Учреждения культуры, образования, здравоохранения"},{"value":"other","label":"Другие получатели, соответствующие целям фонда"}],"when":{"form":["fund"]}},{"id":"fund_highest","label":"Как сформировать высший коллегиальный орган фонда?","type":"radio","required":true,"options":[{"value":"appoint","label":"Первоначально назначают учредители; далее порядок по уставу"},{"value":"mixed","label":"Смешанный порядок формирования — требуется описание"}],"when":{"form":["fund"]},"source":["gk12317","gk12319"],"explain":"Высший орган фонда должен быть коллегиальным; его состав и образование необходимо закрепить в уставе."},{"id":"fund_highest_details","label":"Предлагаемый состав и срок высшего коллегиального органа","type":"textarea","required":true,"when":{"form":["fund"]},"placeholder":"Например: 5 членов; первый состав формируют учредители; далее назначение решением органа; срок 3 года; укажите условия переизбрания."},{"id":"fund_meetings","label":"Как часто будет заседать высший коллегиальный орган фонда?","type":"radio","required":true,"options":[{"value":"year","label":"Ежегодно"},{"value":"half","label":"Раз в полгода"},{"value":"quarter","label":"Ежеквартально"}],"when":{"form":["fund"]},"source":["gk12319"]},{"id":"fund_executive_appointment","label":"Какой орган будет назначать и освобождать от должности руководителя фонда?","type":"radio","required":true,"options":[{"value":"highest","label":"Высший коллегиальный орган фонда (общее правило)"},{"value":"special","label":"Учредитель в случаях, прямо предусмотренных специальным законом"}],"when":{"form":["fund"]},"source":["gk12319","gk12317"],"help":"По пункту 2 статьи 123.19 ГК РФ единоличный исполнительный орган фонда избирает высший коллегиальный орган, если законом или другим правовым актом полномочие не отнесено к учредителю. Сам по себе устав не позволяет произвольно изменить это правило.","explain":"Специальный вариант требует указания и проверки правовой нормы, которая передаёт компетенцию учредителю."},{"id":"fund_executive_appointment_basis","label":"Какой специальный закон предусматривает назначение руководителя учредителем?","type":"textarea","required":true,"when":{"all":[{"form":["fund"]},{"id":"fund_executive_appointment","in":["special"]}]},"source":["gk12319"],"help":"Укажите конкретную норму специального закона и условия её применения. Без правового основания нужно выбрать высший коллегиальный орган.","explain":"Общее правило содержится в статье 123.19 ГК РФ. Указание исключения требует проверки применимого специального режима."},{"id":"fund_council","label":"Как формируется попечительский совет фонда?","type":"radio","required":true,"options":[{"value":"highest","label":"Формируется высшим коллегиальным органом"},{"value":"founders","label":"Первоначально учредителями с дальнейшим обновлением по уставу"}],"when":{"form":["fund"]},"source":["nko7","gk12319"],"explain":"Обычный общественно полезный фонд обязан иметь попечительский совет (ст. 7 закона № 7-ФЗ, ст. 123.19 ГК РФ). Совет осуществляет надзор за деятельностью и использованием средств фонда, работает на общественных началах. Устав должен определить порядок его формирования и деятельности."},{"id":"fund_council_details","label":"Состав и срок полномочий попечительского совета","type":"textarea","required":true,"when":{"form":["fund"]},"placeholder":"Например: 3 человека, срок 3 года, обновление состава по решению высшего коллегиального органа.","help":"Укажите число членов, порядок назначения и прекращения полномочий, срок, порядок созыва заседаний, кворум и принятие решений. Для обычного фонда совет работает на общественных началах."},{"id":"fund_oversight","label":"Какие надзорные действия возложить на попечительский совет?","type":"radio","required":false,"options":[{"value":"standard","label":"Контроль деятельности и использования средств в пределах закона"},{"value":"extended","label":"Дополнительные регулярные отчёты и проверка проектов — описать отдельно"}],"when":{"form":["fund"]},"source":["gk12317","gk12319"]},{"id":"fund_oversight_details","label":"Какие дополнительные проверки и отчёты нужны совету?","type":"textarea","required":true,"when":{"all":[{"form":["fund"]},{"id":"fund_oversight","in":["extended"]}]}},{"id":"fund_support","label":"Как фонд будет принимать решения о предоставлении помощи?","type":"radio","required":false,"options":[{"value":"program","label":"По программам и утверждённым критериям"},{"value":"application","label":"По заявкам получателей с проверкой условий"},{"value":"both","label":"Оба механизма"}],"when":{"form":["fund"]}},{"id":"fund_change_charter","label":"Кто будет вправе изменять устав фонда?","type":"radio","required":true,"options":[{"value":"highest","label":"Высший коллегиальный орган (общее правило)"},{"value":"founder","label":"Учредитель, если право прямо закреплено в уставе и допустимо по закону"}],"when":{"form":["fund"]},"explain":"По ст. 123.20 ГК РФ устав фонда изменяется высшим коллегиальным органом, если устав не предусматривает изменение решением учредителя. Для нескольких учредителей порядок принятия такого решения необходимо согласовать отдельно.","source":["gk12320"],"help":"Вариант изменения устава решением учредителя допускается статьёй 123.20 ГК РФ. При нескольких учредителях проверьте решение с учётом применимых правил; выбор этого пункта сам по себе не означает, что устав можно изменить единолично любым из учредителей."}],"when":{"form":["fund"]}},{"id":"public","title":"Общественное объединение","questions":[{"id":"public_territory","label":"Какой территориальный статус планируется для общественного объединения?","type":"radio","required":true,"options":[{"value":"local","label":"Местный уровень"},{"value":"regional","label":"Региональный уровень"},{"value":"interregional","label":"Межрегиональный уровень"},{"value":"allrussia","label":"Общероссийский уровень"}],"when":{"form":["public_org","public_mov"]},"source":["ob14","ob20"],"explain":"Общероссийское общественное объединение должно иметь структурные подразделения более чем в половине субъектов Российской Федерации. Межрегиональное действует на территории менее половины субъектов и имеет там свои структурные подразделения. Заявленный уровень должен соответствовать фактической структуре (ст. 14 закона № 82-ФЗ)."},{"id":"public_founder_eligibility","label":"Соответствуют ли учредители — физические лица требованиям закона о возрасте и правовом статусе?","type":"radio","required":true,"options":[{"value":"adult","label":"Да, каждый учредитель соответствует требованиям закона"},{"value":"special","label":"Есть особые обстоятельства создания объединения — требуется отдельная правовая проверка учредителей"},{"value":"no","label":"Нет или имеются ограничения, которые необходимо разрешить до регистрации"}],"when":{"form":["public_org","public_mov"]},"help":"Участники детского или молодёжного объединения могут быть младше 18 лет, но это не означает автоматического права несовершеннолетних стать его учредителями. Общий возраст учредителя — 18 лет (ст. 19 закона № 82-ФЗ); исключения допустимы только по специальному закону.","source":["ob19"],"explain":"Статья 19 закона № 82-ФЗ устанавливает общее правило о совершеннолетии учредителей и специальные правила для участников детских и молодёжных объединений. Наличие участников младше 18 лет само по себе не подтверждает допустимость несовершеннолетних в составе учредителей."},{"id":"public_territory_details","label":"Какие территории или регионы предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_territory","in":["local","regional","interregional","allrussia"]}]},"placeholder":"Например: Калининградская область; г. Калининград; перечень субъектов РФ.","help":"Укажите субъекты РФ или муниципальные образования, где объединение фактически будет осуществлять деятельность. Для общероссийского и межрегионального статуса нужны реально созданные подразделения."},{"id":"public_structure","label":"Будут ли у объединения территориальные структурные подразделения?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, подразделения не планируются"},{"value":"yes","label":"Да, подразделения создаются или уже существуют"}],"when":{"form":["public_org","public_mov"]},"source":["ob14","ob20"],"explain":"Для общероссийского и межрегионального объединения территориальные структурные подразделения обязательны. Укажите, какие отделения, организации, филиалы или представительства будут действовать и где.","help":"Общероссийскому и межрегиональному общественному объединению структурные подразделения необходимы для соответствия статье 14 закона № 82-ФЗ. Укажите фактическое территориальное присутствие."},{"id":"public_structure_details","label":"Какие отделения, кто ими управляет, кому принадлежит имущество?","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_structure","in":["yes"]}]},"placeholder":"Например: местные отделения; порядок создания, руководители, имущество и отчётность.","source":["ob20"]},{"id":"public_branch_assets","label":"Кто будет управлять имуществом общественного объединения и его подразделений?","type":"radio","required":true,"when":{"form":["public_org","public_mov"]},"options":[{"value":"central","label":"Имуществом распоряжаются органы объединения; подразделения действуют в пределах выданных полномочий"},{"value":"delegated","label":"Передать подразделениям определённые полномочия по управлению имуществом — описать в уставе"}],"source":["ob20"],"explain":"Статья 20 закона № 82-ФЗ требует отразить права общественного объединения и его подразделений по управлению имуществом. Статус подразделений влияет на то, кому принадлежит имущество и кто вправе им распоряжаться.","help":"По статье 20 закона № 82-ФЗ порядок управления имуществом обязателен для каждого объединения, даже без филиалов и отделений. Если подразделения будут созданы, укажите пределы их полномочий."},{"id":"public_org_admission","label":"Как будет оформляться приём в члены общественной организации?","type":"radio","required":true,"options":[{"value":"request","label":"Заявление и решение компетентного органа"},{"value":"request_meeting","label":"Заявление и решение общего собрания"}],"when":{"form":["public_org"]},"source":["ob20","gk1236"],"explain":"Приём в общественную организацию отличается от членства в ассоциации. Порядок вступления, права и обязанности участников необходимо закрепить в уставе. Добровольный выход не требует разрешения организации."},{"id":"public_membership_start","label":"В какой момент заявитель становится членом общественной организации?","type":"radio","required":true,"options":[{"value":"decision","label":"С даты решения уполномоченного органа о приёме"},{"value":"specified","label":"С даты, прямо указанной в решении о приёме"}],"when":{"form":["public_org"]},"source":["gk1235","ob20"],"help":"В уставе необходимо определить понятный момент приобретения членства, не зависящий от произвольной задержки учётной записи.","explain":"Статья 20 закона № 82-ФЗ требует определить порядок вступления и выхода для организаций с членством."},{"id":"public_org_exit","label":"Как фиксировать добровольный выход из общественной организации?","type":"radio","required":true,"when":{"form":["public_org"]},"options":[{"value":"received","label":"Членство прекращается при получении организацией заявления; запись в реестре носит учётный характер"},{"value":"specified","label":"С даты, указанной членом в заявлении, без обязательного согласования его выхода"}],"explain":"Член общественной организации вправе выйти из неё по своему усмотрению в любое время (п. 2 ст. 123.6 ГК РФ). Порядок подачи заявления и учёта выхода можно определить в уставе, но нельзя требовать разрешения руководителя или собрания на выход. Если участник указывает желаемую дату, правила её применения следует сформулировать так, чтобы не ограничивать право выхода.","source":["gk1236","ob20"]},{"id":"public_org_exclusion","label":"По каким дополнительным основаниям возможно исключение из общественной организации?","type":"multi","required":false,"options":[{"value":"violations","label":"Исключение за существенные нарушения устава"},{"value":"inactive","label":"Иные законные и определённые основания"}],"when":{"form":["public_org"]},"source":["gk1234","ob20"],"explain":"Право члена добровольно выйти не зависит от выбора этой опции. Здесь определяются ДОПОЛНИТЕЛЬНЫЕ основания исключения и прекращения членства. Основания должны быть определёнными; члену следует предоставить возможность дать объяснения и обжаловать решение.","help":"Добровольный выход — обязательное право участника; этот вопрос только об основаниях исключения."},{"id":"public_org_rights","label":"Какие дополнительные права или обязанности членов необходимо предусмотреть (если нужны)?","type":"textarea","required":false,"when":{"form":["public_org"]},"placeholder":"Например: участие в выборах органов, право получать информацию; обязанность соблюдать устав и решения органов, при наличии — уплачивать взносы.","explain":"Устав общественного объединения должен содержать права и обязанности членов, условия и порядок приобретения и утраты членства. Обязательные права и обязанности предусмотрены законом, а специальные уточняются в уставе.","source":["gk1236","ob20"],"help":"Укажите дополнительные неимущественные права и обязанности, если они действительно необходимы. Имущественные права и обязанности определяются в следующем обязательном вопросе; основные права участников по ГК РФ действуют независимо от выбора."},{"id":"public_member_property","label":"Как закрепить имущественные права и обязанности членов общественной организации?","type":"radio","required":true,"options":[{"value":"statutory","label":"Закрепить законные права и обязанности, включая пользование услугами, взносы (если предусмотрены) и отсутствие доли в имуществе"},{"value":"additional","label":"В дополнение к обязательным правилам предусмотреть специальные имущественные обязанности или законные компенсации"}],"when":{"form":["public_org"]},"source":["gk1235","gk1236","ob20"],"help":"Пункт 2 статьи 123.5 ГК РФ прямо требует определить имущественные права и обязанности членов в уставе. Члены не становятся собственниками имущества объединения; обязательные права по ст. 123.6 ГК РФ не могут быть отменены.","explain":"Право на равных началах безвозмездно пользоваться услугами, законные корпоративные права, уплата установленных уставом членских и иных имущественных взносов и отсутствие долей в имуществе следует учитывать даже при выборе основного варианта."},{"id":"public_member_property_details","label":"Какие дополнительные имущественные права, обязанности или компенсации хотите предусмотреть?","type":"textarea","required":true,"when":{"all":[{"form":["public_org"]},{"id":"public_member_property","in":["additional"]}]},"source":["gk1235","gk1236"],"help":"Опишите предмет, получателей и условия. Нельзя закреплять скрытое распределение прибыли или долей имущества между членами.","explain":"Специальные положения должны быть совместимы со статьями 123.5–123.6 ГК РФ.","placeholder":"Например: возмещение подтверждённых расходов при выполнении уставных поручений"},{"id":"public_mov_participants","label":"Как сторонники смогут участвовать в деятельности общественного движения?","type":"multi","required":true,"options":[{"value":"events","label":"Участие в мероприятиях"},{"value":"initiatives","label":"Рабочие группы и инициативы"},{"value":"representatives","label":"Участие в выборе делегатов или уполномоченных лиц"}],"when":{"form":["public_mov"]},"source":["ob20"],"explain":"Общественное движение не имеет членства. Участие в деятельности не должно описываться как членство с обязательными членскими взносами."},{"id":"public_congress","label":"Как часто должен собираться высший орган общественного объединения?","type":"radio","required":true,"options":[{"value":"year","label":"Ежегодно"},{"value":"two","label":"Раз в два года"},{"value":"three","label":"Раз в три года"}],"when":{"form":["public_org","public_mov"]}},{"id":"public_organs","label":"Какие выборные и контрольно-ревизионные органы необходимы?","type":"textarea","required":true,"when":{"form":["public_org","public_mov"]},"placeholder":"Например: общее собрание, совет, председатель, ревизор — порядок формирования и срок каждого.","help":"Для общественного движения обязателен выборный коллегиальный постоянно действующий руководящий орган. Перечислите органы и для каждого укажите порядок формирования, срок полномочий, компетенцию и правила принятия решений.","source":["ob9","ob18","ob20"],"explain":"У общественного движения по ст. 9 закона № 82-ФЗ обязателен выборный постоянно действующий коллегиальный руководящий орган. При создании общественного объединения решением учредительного собрания формируются руководящий и контрольно-ревизионный органы (ст. 18). Устав должен определять формирование, компетенцию, сроки полномочий и порядок принятия решений (ст. 20)."},{"id":"public_organs_terms","label":"Какие сроки полномочий установить для выборных и контрольных органов?","type":"textarea","required":true,"when":{"form":["public_org","public_mov"]},"explain":"В уставе общественного объединения должны быть определены состав, формирование, компетенция, сроки полномочий и принятие решений органами и отделениями.","source":["ob20"],"placeholder":"Например: правление — 3 года, ревизор — 2 года, председатель — 3 года. Для каждого органа укажите срок."},{"id":"public_member_fees","label":"Как определить обязательные членские взносы общественной организации?","type":"radio","required":true,"options":[{"value":"by_meeting","label":"Размер, периодичность и способ уплаты по решению высшего органа"},{"value":"formula","label":"По закреплённой в уставе формуле и решению компетентного органа"}],"when":{"all":[{"form":["public_org"]},{"id":"npo_income","has":["fees"]}]},"explain":"Обычные участники общественного движения без членства не платят именно членские взносы. Для общественной организации порядок формирования имущества и обязанности членов должны быть определены уставом.","source":["gk1237","gk1236","ob20"],"help":"Если устав общественной организации предусматривает членские или другие имущественные взносы, порядок определения их размера и уплаты относится к компетенции высшего органа (ст. 123.7 ГК РФ)."},{"id":"public_member_fees_details","label":"Опишите размер, периодичность или формулу членских взносов","type":"textarea","required":true,"when":{"all":[{"form":["public_org"]},{"id":"public_member_fees","in":["formula"]}]}},{"id":"public_symbol","label":"Будет ли собственная символика, описание которой нужно включить в устав?","type":"radio","required":false,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, символика уже определена"}],"when":{"form":["public_org","public_mov"]},"source":["ob20"],"explain":"При использовании символики общественного объединения её описание включается в устав."},{"id":"public_symbol_details","label":"Опишите символику словами","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_symbol","in":["yes"]}]},"placeholder":"Например: цвет, композиция, надписи и отличительные элементы."}],"when":{"form":["public_org","public_mov"]}},{"id":"coop","title":"Потребительский кооператив","questions":[{"id":"coop_type","label":"Какой именно потребительский кооператив предполагается?","type":"radio","required":true,"options":[{"value":"general","label":"Обычный потребительский кооператив — потребуется уточнить применимость специального закона"},{"value":"housing","label":"Жилищный / жилищно-строительный / гаражный"},{"value":"credit","label":"Кредитный, сельскохозяйственный или иной специально регулируемый"}],"when":{"form":["coop"]},"source":["gk1232","co24"],"explain":"Конкретный вид кооператива определяет применимые нормы о составе членов, органах, имуществе, паях и дополнительных взносах. Анкета не может автоматически подтвердить готовность устава кооператива до проверки специального закона (например, для жилищных, кредитных или сельскохозяйственных кооперативов).","help":"Укажите разновидность кооператива. Для жилищных, гаражных, кредитных, сельскохозяйственных, страховых и иных специальных видов действуют дополнительные требования к уставу; необходима проверка специального закона."},{"id":"coop_needs","label":"Какие материальные потребности будут удовлетворять члены кооператива?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: совместное приобретение оборудования и распределение расходов."},{"id":"coop_members","label":"Кто будет членами?","type":"radio","required":true,"options":[{"value":"people","label":"Граждане"},{"value":"mix","label":"Граждане и юридические лица"},{"value":"special","label":"Другой состав, требующий проверки специального закона"}],"when":{"form":["coop"]},"source":["gk1232"]},{"id":"coop_share","label":"Каков размер, состав и срок внесения паевого взноса?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: 20 000 рублей, оплата при вступлении или по графику.","source":["gk1232"],"explain":"Размер, состав, порядок внесения паевых взносов и ответственность за просрочку относятся к обязательным условиям устава."},{"id":"coop_share_violations","label":"Какие последствия установлены за просрочку внесения паевого взноса?","type":"textarea","required":true,"when":{"form":["coop"]},"explain":"Ответственность члена за нарушение обязанности по внесению паевых взносов — обязательное положение устава по ст. 123.2 ГК РФ. Формулировка должна учитывать специальный закон для конкретного вида кооператива.","source":["gk1232"],"placeholder":"Например: требование об уплате, предусмотренная законом неустойка и порядок рассмотрения вопроса о членстве."},{"id":"coop_losses","label":"Каков порядок покрытия членами кооператива возникших убытков?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: дополнительными взносами в установленном законом порядке.","source":["gk1233"],"explain":"В соответствии со ст. 123.3 ГК РФ члены потребительского кооператива обязаны покрыть убытки дополнительными взносами в установленные сроки и несут ограниченную размером невнесённого дополнительного взноса субсидиарную ответственность. Специальные нормы для выбранного вида могут дополнять эти правила.","help":"По общему правилу ст. 123.3 ГК РФ образовавшиеся убытки покрываются дополнительными взносами в течение трёх месяцев после утверждения годового баланса. Проверьте специальный закон для вашего вида кооператива."},{"id":"coop_losses_details","label":"Как рассчитывать и уплачивать дополнительные взносы на покрытие убытков?","type":"textarea","required":true,"when":{"form":["coop"]},"source":["gk1232","gk1233"],"placeholder":"Например: в предусмотренный законом срок после утверждения годового баланса, пропорционально паю либо по обязательной отраслевой методике.","explain":"Для потребительского кооператива ст. 123.3 ГК РФ устанавливает срок покрытия убытков и ответственность членов. Специальное отраслевое законодательство может предусматривать дополнительные требования к взносам."},{"id":"coop_admission","label":"Кто принимает новых членов?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание"},{"value":"board","label":"Правление с последующим контролем по уставу"}],"when":{"form":["coop"]}},{"id":"coop_exit","label":"Как оформлять выход из кооператива?","type":"radio","required":true,"options":[{"value":"application","label":"Заявление и расчёты по паям в порядке закона и устава"},{"value":"detail","label":"Нужен особый законный порядок — описать в уставе"}],"when":{"form":["coop"]}},{"id":"coop_govern","label":"Какие органы планируются и как он    const transitions={ooo:[],association:['public_org','ano','fund'],ano:['fund'],fund:[],public_org:['association','ano','fund'],public_mov:[],coop:['public_org','association','ano','fund']};

function synchronizeSelected(){
 const old=choices(),removed=old.filter(f=>!!ineligibleReason(f));
 if(!removed.length)return;
 COMMON.form_select=old.filter(f=>!removed.includes(f));
 eligibilityNotice=removed.map(f=>`${LABELS[f]}: ${ineligibleReason(f)}`).join(' ');
 if(!choices().includes(ACTIVE_FORM))ACTIVE_FORM=choices()[0]||null;
}
function setAnswer(id,value){
 if(id==='form_select'){
   COMMON.form_select=(Array.isArray(value)?value:[]).filter((v,i,a)=>LABELS[v]&&a.indexOf(v)===i&&!ineligibleReason(v));
   if(!choices().includes(ACTIVE_FORM))ACTIVE_FORM=choices()[0]||null;
   eligibilityNotice='';return;
 }
 const store=COMMON_IDS.has(id)?COMMON:(FORM_VALUES[ACTIVE_FORM]??=Object.create(null));
 if(value==null||value===''||(Array.isArray(value)&&!value.length))delete store[id];else store[id]=value;

function testRule(rule){
  if(!rule)return true;
  if(rule.all)return rule.all.every(testRule);
  if(rule.any)return rule.any.some(testRule);
  if(rule.form)return rule.form.includes(ACTIVE_FORM);
  if(rule.notForm)return !rule.notForm.includes(ACTIVE_FORM);
  if(rule.twoForms)return choices().length>1;
  if(rule.oneForm)return choices().length===1;
  if(rule.id){const v=get(rule.id);
    if(rule.in)return rule.in.includes(v);
    if(rule.has)return Array.isArray(v)&&rule.has.some(x=>v.includes(x));
  }
  if(rule.answerNot){const {id,contains}=rule.answerNot;const v=get(id);return Array.isArray(v)?!v.includes(contains):v!==contains}
  return false;
}
function liveSections(){return SECTIONS.filter(s=>(ACTIVE_FORM!=='ip'||['project','choice'].includes(s.id))&&testRule(s.when)).map(s=>({...s,visible:s.questions.filter(q=>testRule(q.when))})).filter(s=>s.visible.length)}
function isLive(id){return liveSections().some(s=>s.visible.some(q=>q.id===id))}
function answered(q){const v=get(q.id);return Array.isArray(v)?v.length>0:typeof v==='string'&&v.trim().length>0}
function unresolved(q){if(!q.required)return false;const v=get(q.id);return !answered(q)||(['unknown','undecided'].includes(v)&&!['paid','mission_paid'].includes(q.id))}
function stats(){const qs=liveSections().flatMap(s=>s.visible).filter(q=>q.required);const missing=qs.filter(q=>!isValidField(q));return {qs,missing,done:qs.length-missing.length,pct:qs.length?Math.round((qs.length-missing.length)/qs.length*100):0}}
function forForm(form,fn){const prev=ACTIVE_FORM;ACTIVE_FORM=form;try{return fn()}finally{ACTIVE_FORM=prev}}
function activeStage(){const cs=choices();if(!ACTIVE_FORM)return 0;return cs.indexOf(ACTIVE_FORM)+1}
function formDone(form){return forForm(form,()=>evaluate().complete)}
function formAnswered(form){return forForm(form,()=>stats().missing.length===0)}

   return `<button type="button" class="nav-sub ${selected?'current':''}" data-section="${esc(sec.id)}" data-form="${esc(form)}" ${selected?'aria-current="step"':''}>${i+1}. ${esc(sec.title)}<span class="count">${done} / ${sec.visible.length} ответов</span></button>`;
  }).join('');
 }
 html+=`<button type="button" data-section="report" data-form="" class="${current==='report'?'current':''}">Итоги и документы</button>`;
 nav.innerHTML=html;

 const project=forForm(null,()=>liveSections().find(s=>s.id==='project'));

function isValidField(q){
 const value=get(q.id);
 if(q.required&&(!answered(q)||(['unknown','undecided'].includes(value)&&!['paid','mission_paid'].includes(q.id))))return false;
 if(q.type==='input'&&q.number&&value!==undefined&&value!==null&&String(value).trim()!==''){
   const v=Number(value);if(!Number.isFinite(v)||v<0)return false;
   if(q.min!==undefined&&v<q.min)return false;
   if(q.max!==undefined&&v>q.max)return false;
   if(q.step===1&&!Number.isInteger(v))return false;
 }
 if(q.type==='input'&&q.number&&q.step===0.01&&value!==undefined&&value!==null&&String(value).trim()!==''&&!/^\d+(?:\.\d{1,2})?$/.test(String(value).trim()))return false;
 if(q.type==='multi'&&Array.isArray(value)&&q.options?.some(o=>o.exclusive&&value.includes(o.value)&&value.length>1))return false;
 if(q.id==='npo_income'&&['ano','fund','public_mov'].includes(ACTIVE_FORM)&&Array.isArray(value)&&value.includes('fees'))return false;
 if(q.id==='assoc_members'&&(!Array.isArray(value)||!value.some(v=>['people','legal'].includes(v))))return false;
 if(['founder_types','charter_founder_types'].includes(q.id)&&Array.isArray(value)&&!['individuals','companies','npo'].some(x=>value.includes(x)))return false;
 if(q.id==='assoc_top'&&value==='delegates'&&get('assoc_future_count')!=='over100')return false;
 if(q.id==='public_structure'&&value==='no'&&['allrussia','interregional'].includes(get('public_territory')))return false;
 if(q.id==='public_branch_assets'&&value==='delegated'&&get('public_structure')!=='yes')return false;
 if(q.id==='founder_types'&&COMMON.founders==='1'&&Array.isArray(value)&&['individuals','companies','npo'].filter(x=>value.includes(x)).length>1)return false;
 if(q.id==='charter_founder_types'&&get('founders_form')==='1'&&Array.isArray(value)&&['individuals','companies','npo'].filter(x=>value.includes(x)).length>1)return false;
 if(q.id==='full_name'&&value){
   const name=String(value).trim();
   const patterns={ooo:/общество\s+с\s+ограниченной\s+ответственностью/i,association:/(ассоциаци|союз)/i,ano:/автономн.{0,30}некоммерческ.{0,30}организаци/i,fund:/фонд/i,public_org:/общественн.{0,22}организаци/i,public_mov:/общественн.{0,22}движени/i,coop:/кооператив/i};
   if(patterns[ACTIVE_FORM]&&!patterns[ACTIVE_FORM].test(name))return false;
   const bare=/^(?:общество\s+с\s+ограниченной\s+ответственностью|автономная\s+некоммерческая\s+организация|общественно\s+полезный\s+фонд|фонд|ассоциация|союз|общественная\s+организация|общественное\s+движение|потребительский\s+кооператив)\s*$/i;
   if(bare.test(name))return false;
 }
 if(q.id==='form_select'&&(!choices().length||choices().some(f=>ineligibleReason(f))))return false;
 if(q.id==='charter_public_three'&&value!=='yes')return false;
 if(q.id==='charter_public_legal'&&value!=='yes')return false;
 if(q.id==='charter_founder_types'&&['public_org','public_mov'].includes(ACTIVE_FORM)&&Array.isArray(value)&&value.includes('companies'))return false;
 if(q.id==='charter_founders'){
   if(ACTIVE_FORM==='association'&&value==='1')return false;
   if(ACTIVE_FORM==='ooo'&&value==='over50')return false;

 if(form==='coop')add(cautions,'Проверьте требования специального закона о выбранном виде потребительского кооператива: анкета собирает исходные данные, но не подтверждает регистрационную готовность устава.');
 if(types.includes('foreign'))add(cautions,'Проверить документы иностранных учредителей и возможные ограничения.');
 if((get('legal_risks')||[]).some(x=>x!=='none')){
  add(cautions,'Для выбранной сферы проверить специальные законы, лицензирование и возможные дополнительные требования.');
  if((get('legal_risks')||[]).some(x=>['finance','sro','employers','sport','religion','housing'].includes(x)))add(cautions,'Для специального статуса нужен отраслевой юридический анализ; заполнение анкеты не подтверждает готовность устава к регистрации.');
 }
 if(get('stage')==='transform')add(cautions,'Для преобразования необходимы решение о реорганизации, проверка допустимости перехода и применимых специальных норм. Заполненный устав сам по себе не заменяет регистрацию преобразования.');
 if(get('current')==='ip'&&get('stage')==='transform')add(blocking,'ИП не является юридическим лицом, его нельзя преобразовать в ООО или НКО посредством реорганизации.');
 if(get('operating_address')==='missing')add(cautions,'Перед подачей документов необходимо определить достоверный адрес для ЕГРЮЛ.');
 if(get('head_candidate')==='no')add(cautions,'Для регистрации потребуется назначить исполнительный орган.');
 const s=stats();return {form,blocking,cautions,tips,missing:s.missing,complete:!s.missing.length&&!blocking.length};
}
function save(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000)}
function reportSections(form,includeShared){return forForm(form,()=>liveSections().filter(sec=>includeShared||!['project','choice'].includes(sec.id)).map(sec=>({title:sec.title,questions:sec.visible.filter(answered).map(q=>({label:q.label,value:pretty(q)}))})).filter(sec=>sec.questions.length))}

function reportData(){
 const selected=choices(),forms=selected.map(form=>forForm(form,()=>({form,assessment:evaluate(),sections:reportSections(form,false)})));
 return {forms,shared:reportSections(selected[0]||null,true).filter(s=>['Проект и цели','Выбор правовой формы'].includes(s.title))};
}
function markdownEscape(value){return String(value??'').replace(/[\\`*_{}\[\]<>|]/g,'\\$&');}
function exportMarkdown(){
 const data=reportData(),lines=['# Анкета для подготовки уставов','',`Дата: ${new Date().toLocaleDateString('ru-RU')}`,'',`Выбранные формы: ${choices().map(f=>LABELS[f]).join(', ')||'не выбраны'}`];
 const addSections=(sections,level=2)=>{for(const sec of sections){lines.push('',`${'#'.repeat(level)} ${markdownEscape(sec.title)}`,'');for(const question of sec.questions)lines.push(`**${markdownEscape(question.label)}**`,'',markdownEscape(question.value),'');}};
 addSections(data.shared);
 for(const item of data.forms){lines.push('',`## ${markdownEscape(LABELS[item.form])}`);addSections(item.sections,3);
  lines.push('','### Проверка','',item.assessment.complete?'Обязательные исходные данные собраны.':'Есть незаполненные или несовместимые решения.');
  if(item.assessment.missing.length){lines.push('','Не заполнено:');item.assessment.missing.forEach(q=>lines.push(`- ${markdownEscape(q.label)}`));}
  if(item.assessment.blocking.length){lines.push('','Требуют исправления:');item.assessment.blocking.forEach(x=>lines.push(`- ${markdownEscape(x)}`));}
  if(item.assessment.cautions.length){lines.push('','Для проверки юристом:');item.assessment.cautions.forEach(x=>lines.push(`- ${markdownEscape(x)}`));}
 }
 lines.push('','---','', 'Результат является заданием для подготовки проекта устава. Требуется юридическая проверка с учётом применимого специального закона и регистрационных документов.');
 return lines.join('\n');
}
function report(){
 const data=reportData(),selected=choices(),allDone=selected.length>0&&data.forms.every(f=>f.assessment.complete);
 const missing=data.forms.flatMap(({form,assessment})=>assessment.missing.map(q=>({form,q})));
 const blockers=data.forms.flatMap(({form,assessment})=>assessment.blocking.map(text=>({form,text})));
 const caution=data.forms.flatMap(({form,assessment})=>assessment.cautions.map(text=>({form,text})));
 const responseHtml=sections=>sections.map(s=>`<section class="response-section"><h3>${esc(s.title)}</h3>${s.questions.map(q=>`<div class="response"><span class="q-label">${esc(q.label)}</span><span class="q-value">${esc(q.value)}</span></div>`).join('')}</section>`).join('');
 $('content').innerHTML=`<h1>Итоги и документы</h1><p class="status">Выбрано форм: ${selected.length}. ${allDone?'Обязательные ответы заполнены.':'Есть незаполненные вопросы или юридические противоречия.'}</p>`+
 (missing.length?`<section class="summary"><h2>Недостающие ответы: ${missing.length}</h2><ul class="unanswered">${missing.map(x=>`<li><button type="button" data-jump="${esc(x.q.id)}" data-jumpform="${esc(x.form)}">${formMark(x.form)}: ${esc(x.q.label)}</button></li>`).join('')}</ul></section>`:'')+
 (blockers.length?`<section class="summary"><h2>Требуют исправления</h2><ul>${blockers.map(x=>`<li>${formMark(x.form)}: ${esc(x.text)}</li>`).join('')}</ul></section>`:'')+
 (caution.length?`<section class="summary"><h2>Для проверки юристом</h2><ul>${caution.map(x=>`<li>${formMark(x.form)}: ${esc(x.text)}</li>`).join('')}</ul></section>`:'')+
 `<div class="action-set no-print"><button class="btn primary" id="print">Печать</button><button class="btn" id="export-md">Скачать Markdown</button></div>`+
 `<p class="small no-print">Markdown и печатная версия включают общие ответы и сведения по каждой выбранной форме. При обновлении вкладки введённые ответы не сохраняются.</p>`+
 ``+
 `<div id="print-area"><div class="print-head"><h2>Ответы для подготовки уставов</h2><p>Дата: ${esc(new Date().toLocaleDateString('ru-RU'))} · Формы: ${selected.map(formMark).join('; ')}</p></div>`+
 responseHtml(data.shared)+data.forms.map(item=>`<section class="form-report"><h2>${formMark(item.form)}</h2>${responseHtml(item.sections)}<p class="status">${item.assessment.complete?'Исходные данные собраны; требуется юридическая проверка':'Требуются дополнительные ответы или исправления'}</p></section>`).join('')+
 `<p class="report-foot">Ответы используются для разработки уставов. Для регистрации потребуются юридическая проверка и комплект необходимых документов.</p></div>`+
 `<div class="step-actions no-print"><button class="btn" id="back-form">Вернуться к вопросам</button></div>`;
 $('print').onclick=()=>window.print();
 $('export-md').onclick=()=>save('Ответы_анкеты_ОПФ_и_устав.md',exportMarkdown(),'text/markdown;charset=utf-8');
 $('back-form').onclick=()=>{const form=ACTIVE_FORM!=='ip'?ACTIVE_FORM:choices().find(f=>f!=='ip');if(form)switchForm(form);else navigate('choice');};
 document.querySelectorAll('button[data-jump]').forEach(btn=>btn.onclick=()=>{
  const form=btn.dataset.jumpform;if(!choices().includes(form))return;ACTIVE_FORM=form;
  const sec=formSections(form).find(s=>s.visible.some(q=>q.id===btn.dataset.jump));if(sec)navigate(sec.id,btn.dataset.jump);
 });
}

$('nav-toggle').addEventListener('click',()=>{const on=$('sidebar').classList.toggle('expanded');$('nav-toggle').setAttribute('aria-expanded',String(on))});
render();

</script>

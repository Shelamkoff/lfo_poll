<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Анкета для выбора формы организации и подготовки устава</title>
<style>
:root{--ink:#202c32;--dim:#57646b;--hint:#6d7980;--rule:#e3e8eb;--field:#b6c3ca;--accent:#175269;--pale:#f3f6f7;--alert:#6e4534;--error:#a73a33}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:white;color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:none}
.input:focus-visible{border-color:var(--accent);outline:none;box-shadow:none}
.option:focus-within{background:var(--pale)}
.option input:focus-visible{outline:none}
.btn:focus-visible{border-color:var(--accent);background:#eaf2f4;color:var(--accent)}
.btn.primary:focus-visible{border-color:#092f40;background:#104255;color:white}
.nav button:focus-visible,.form-shortcut:focus-visible,.nav-toggle:focus-visible{background:var(--pale);color:var(--accent)}
.wrap{max-width:1250px;margin:auto;padding:22px 30px 65px}
.columns{display:grid;grid-template-columns:minmax(210px,260px) minmax(0,790px);gap:58px;align-items:start}
.sidebar{position:sticky;top:18px;padding-top:6px;min-width:0}
.sidebar-title{font-size:13px;font-weight:700;margin:0 0 12px}
.nav{display:grid;gap:1px}
.nav button{display:block;border:0;background:transparent;width:100%;text-align:left;color:var(--dim);padding:11px 12px;min-height:46px;border-radius:4px;font-size:13px;line-height:1.4}
.nav button:hover{color:var(--ink);background:var(--pale)}
.nav button.current{background:var(--pale);color:var(--accent);font-weight:700}
.nav button .count{display:block;color:var(--hint);font-size:11px;font-weight:400;margin-top:3px}
.nav-toggle{display:none}
.progress-wrap{padding:19px 10px 0}
.bar{height:4px;background:#e6ecef;border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .15s ease}
.progress-label{margin:8px 0 0;color:var(--dim);font-size:12px}
.privacy{padding:0 10px;color:var(--hint);font-size:12px;line-height:1.55;margin-top:25px}
.content{min-width:0}
h1{font-size:25px;line-height:1.3;letter-spacing:-.02em;margin:0 0 15px;font-weight:720}
.section-desc{font-size:14px;color:var(--dim);margin:0 0 21px;max-width:720px}
.question{min-width:0;border:0;padding:20px 0 25px;margin:0}
.question+.question{border-top:0}
.question legend{font-size:16px;font-weight:680;line-height:1.45;float:left;width:100%;padding:0;margin:0 0 7px}
.question legend:after{content:'';display:block;clear:both}
.req{color:var(--hint);font-weight:500;font-size:12px;margin-left:9px;white-space:nowrap}
.desc{clear:both;color:var(--dim);font-size:13px;margin:0 0 13px;line-height:1.55}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;row-gap:4px;clear:both;margin-top:4px}
.option{display:flex;min-height:48px;align-items:flex-start;gap:11px;padding:12px 12px;border-radius:4px;cursor:pointer;min-width:0;transition:background .14s ease}
.option:hover{background:#eef3f4}
.option input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto;margin:3px 0 0}
.option-title{display:block;font-size:14px;line-height:1.47;overflow-wrap:anywhere}
.option-sub{display:block;color:var(--dim);font-size:12px;line-height:1.48;margin-top:3px}
.option.chosen{background:var(--pale)}.option.chosen .option-title{font-weight:650}.option-disabled{opacity:.48;cursor:not-allowed}
.input{display:block;width:100%;padding:12px 13px;border:1px solid var(--field);border-radius:4px;background:white;font-size:14px;min-height:46px;clear:both}
textarea.input{resize:vertical;min-height:105px}
.input::placeholder{color:#78858d;opacity:1}
.note{clear:both;margin-top:12px}
.note summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);width:max-content;max-width:100%;padding:5px 0}
.note summary:hover{text-decoration:underline;text-underline-offset:3px}
.note-content{font-size:13px;line-height:1.65;color:#3d515a;max-width:700px;padding:5px 0 2px}
.note-content p{margin:0 0 6px}
.note-content a{display:inline-block;margin:4px 14px 0 0;font-size:12px}
.step-actions{display:flex;justify-content:space-between;gap:12px;margin:24px 0 0;padding-top:15px}
.btn{padding:10px 15px;border:1px solid #aebfc6;background:white;color:var(--accent);border-radius:4px;font-size:13px;font-weight:650;line-height:1.4;min-height:42px}
.btn:hover{background:#f5f8f9}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn.primary:hover{background:#103e50}
.btn:disabled{opacity:.35;cursor:default}
.btn.warn{color:#873e36}
.action-set{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 20px}
.action-set .btn{flex:0 0 auto}
.summary{padding:8px 0 15px;margin:8px 0}
.summary h2{font-size:18px;line-height:1.45;margin:0 0 8px}
.summary h3{font-size:15px;margin:20px 0 8px}
.summary p,.summary li{font-size:14px;line-height:1.6}
.summary ul{padding-left:22px;margin:6px 0 16px}
.summary li{margin:6px 0}
.small{font-size:13px;color:var(--dim);line-height:1.62}
.status{font-size:13px;color:var(--dim);margin:8px 0 18px}
.issue{margin:10px 0 20px;padding:12px 0;background:transparent;border-radius:0}
.issue h3{color:var(--alert);font-size:15px;margin:0 0 8px}
.issue ul{margin:0;padding-left:18px}
.issue li{font-size:13px;margin:8px 0}
.unanswered button{border:0;background:transparent;cursor:pointer;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.complete{color:#245b49;font-size:13px}
.response-section{margin-top:28px}
.response-section h3{font-size:16px;margin:0 0 9px}
.response{padding:10px 0;border-top:0}
.response:last-child{border-bottom:0}
.response .q-label{font-size:13px;font-weight:650;display:block}
.response .q-value{font-size:13px;color:#415059;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;display:block}
.report-source{font-size:12px;color:var(--dim);margin-top:26px}
.report-source summary{cursor:pointer;color:var(--accent);font-weight:650}
.report-source ul{padding-left:20px}
.report-source li{margin:6px 0}
.inline-info{font-size:13px;color:var(--dim);padding:11px 0;margin:10px 0 20px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:960px){.wrap{padding:20px 23px 55px}.columns{grid-template-columns:205px minmax(0,1fr);gap:29px}.answers{column-gap:16px}}
@media(max-width:720px){.wrap{padding:12px 20px 45px}.columns{display:block}.sidebar{position:static;padding:0;margin:0 0 23px}.sidebar-title{display:none}.nav-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;background:white;color:var(--accent);border:0;padding:9px 2px;min-height:43px;font-size:14px;font-weight:650}.nav{display:none;padding-bottom:9px}.sidebar.expanded .nav{display:grid}.nav button{padding:9px 8px}.nav .count{display:none}.progress-wrap{padding:7px 0 0}.privacy{display:none}h1{font-size:23px}.question{padding:19px 0 16px}}
@media(max-width:500px){.wrap{padding:10px 15px 34px}.answers{grid-template-columns:1fr}.option{padding:8px 0;min-height:44px}.question legend{font-size:15px}.action-set .btn{flex:1 1 140px}.step-actions .btn{flex:1}}
@media(prefers-reduced-motion:reduce){.bar>span{transition:none}}
@media print{.wrap{padding:0;max-width:none}.columns{display:block}.sidebar,.step-actions,.action-set,.no-print{display:none!important}.content{max-width:none}h1{font-size:20px}.response-section{break-inside:auto}.response{break-inside:avoid}.issue{background:transparent;padding:0}.note:not([open]){display:none}a{color:var(--ink)}}

/* Review: lean form UI, meaningful accent only, no decorative framing. */
.recommendation{max-width:760px;margin:11px 0 16px;padding:12px 0;color:#3d515a;font-size:13px;line-height:1.7}
.recommendation strong{display:block;color:var(--ink);margin-bottom:5px}
.recommendation div+div{margin-top:5px}
.select-count{font-size:12px;color:var(--dim);margin:10px 0 0}
.option-hint{display:inline-block;vertical-align:baseline;font-size:11px;line-height:1.4;color:var(--accent);font-weight:600;margin-left:6px}
.form-progress-title{font-size:12px;font-weight:600;color:var(--dim);margin:12px 10px 5px}
.form-shortcut{border:0;border-radius:4px;background:transparent;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px;padding:10px 12px;min-height:46px;color:var(--dim);font-size:13px;line-height:1.3}
.form-shortcut:hover:not(:disabled){background:#eef3f4;color:var(--ink)}
.form-shortcut.active{background:var(--pale);color:var(--accent);font-weight:700}
.form-shortcut:disabled{opacity:.55;cursor:not-allowed}
.form-shortcut small{font-size:11px;color:var(--hint);font-weight:400}
.form-context{font-size:12px;color:var(--dim);margin:0 0 10px}
.form-report{padding-top:25px;break-before:auto}
.form-report>h2{font-size:20px;line-height:1.35;margin:0 0 8px}
.print-head{display:none}
.print-head h2{font-size:22px;margin:0 0 4px}
.report-next{padding:12px 0 20px}
.report-next p{font-size:14px}
.report-foot{font-size:11px;color:var(--dim);margin-top:30px}
.response-section{margin-top:18px}
.response-section h3{font-size:14px;margin:0 0 6px;color:var(--dim)}
.summary{padding:8px 0 12px}
.unanswered button{min-height:26px}
.btn:disabled{opacity:.5}
@media(max-width:500px){.option{padding:11px 10px;min-height:48px}.recommendation{padding:8px 0}}
@media(prefers-reduced-motion:reduce){.option{transition:none}}
@media print{
 @page{size:A4;margin:16mm 17mm}
 body{font:11pt/1.45 Arial,sans-serif;color:#161c21}
 .wrap{padding:0}
 .sidebar,.step-actions,.action-set,.no-print,.summary,.status,.small,#notice{display:none!important}
 #print-area{display:block!important}
 .print-head{display:block;margin:0 0 17px}
 .print-head p{font-size:10pt;margin:0;color:#343b40}
 h1{display:none}
 .form-report{break-before:page;padding-top:0}
 .response-section,.response{break-inside:avoid}
 .response{padding:5px 0}
 .q-label{font-size:9.5pt!important}
 .q-value{font-size:10pt!important}
 .form-report>h2{font-size:18pt;margin:0 0 12px}
 .report-foot{font-size:9pt}
 }

.nav-form-label{font-size:12px;color:var(--dim);font-weight:700;padding:16px 12px 6px;line-height:1.4}
.nav .nav-sub{padding-left:20px}
.forms-list .option{align-items:center}
.forms-list .option.option-disabled{opacity:1;color:#657077;cursor:not-allowed}
.forms-list .option.option-disabled .option-sub{color:#785e52;font-size:12px}
.forms-list .option.recommended{background:#ebf3f4}
.recommend-label{font-size:11px;color:var(--accent);font-weight:750;margin-left:8px;white-space:nowrap}
.notice-line{font-size:13px;color:#785243;margin:12px 0}
.question.invalid .question legend{color:#913e36}
.field-error,.validation-summary{font-size:13px;color:#9a3d36;margin:9px 0}
.question.invalid .input{border-color:#a7443b}
@media(max-width:720px){.nav .nav-sub{padding-left:14px}}
@media print{.field-error,.validation-summary{display:none!important}}

.quick-save{padding:13px 10px 0}
.quick-save button{border:0;border-radius:3px;background:none;color:var(--accent);font-weight:620;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:6px 0;cursor:pointer;text-align:left}
.quick-save button:hover,.quick-save button:focus-visible{background:var(--pale);color:#0e3c4b;text-decoration-thickness:2px}
a:focus-visible,.note summary:focus-visible{text-decoration-thickness:3px;color:#0e3b4c;background:var(--pale)}
@media print{.quick-save{display:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="columns"><aside id="sidebar" class="sidebar" aria-label="Навигация по разделам">
<p class="sidebar-title">Разделы</p>
<button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav">Разделы анкеты <span aria-hidden="true">▾</span></button>
<div id="form-progress" aria-label="Выбранные формы"></div><nav id="nav" class="nav" aria-label="Разделы"></nav>
<div class="progress-wrap"><div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Заполнение обязательных вопросов"><span id="bar"></span></div><p id="progress-label" class="progress-label" aria-live="polite"></p></div>
<div class="quick-save"><button type="button" id="quick-json">Сохранить ответы JSON</button></div><p class="privacy">Анкета работает без сервера. Ответы не отправляются в интернет; для продолжения сохраните JSON.</p>
</aside><main id="content" class="content"></main></div></div>
<script>
'use strict';
const CONFIG={"sections":[{"id":"project","title":"Проект и цели","questions":[{"id":"stage","label":"Что необходимо сделать?","type":"radio","required":true,"options":[{"value":"new","label":"Создать новую организацию"},{"value":"amend","label":"Изменить устав действующей организации"},{"value":"transform","label":"Изменить организационно-правовую форму"}]},{"id":"current","label":"Какая форма у организации сейчас?","type":"radio","required":true,"options":[{"value":"ooo","label":"ООО"},{"value":"association","label":"Ассоциация"},{"value":"ano","label":"АНО"},{"value":"fund","label":"Фонд"},{"value":"public","label":"Общественная организация или движение"},{"value":"ip","label":"ИП"},{"value":"other","label":"Другая"}],"help":"При изменении устава нужен действующий текст и сведения ЕГРЮЛ. Преобразование возможно только в предусмотренных законом случаях.","when":{"id":"stage","in":["amend","transform"]}},{"id":"activity","label":"Какие товары, работы, услуги или проекты вы планируете?","type":"textarea","required":true,"placeholder":"Например: платные консультации для компаний; совместное отраслевое представительство; образовательные семинары."},{"id":"goal","label":"Главная цель проекта","type":"radio","required":true,"options":[{"value":"business","label":"Вести бизнес и получать прибыль для собственников"},{"value":"services","label":"Оказывать услуги для достижения некоммерческой цели"},{"value":"members","label":"Представлять и защищать общие интересы членов объединения"},{"value":"charity","label":"Привлекать средства и финансировать общественно полезные программы"},{"value":"civic","label":"Объединить людей вокруг общественной инициативы"},{"value":"mutual","label":"Совместно удовлетворять материальные потребности участников за счёт паёв"},{"value":"mixed","label":"Совмещать коммерческий бизнес и самостоятельные некоммерческие проекты"}],"source":["gk50","nko24"],"explain":"Приносящая доход деятельность допускается и в НКО. Отличие от ООО — в целях организации, отношении к имуществу и запрете распределять прибыль НКО между участниками."},{"id":"customers","label":"Кому будет предназначена деятельность?","type":"multi","required":true,"options":[{"value":"public","label":"Широкому кругу клиентов или получателей услуг"},{"value":"members","label":"Прежде всего участникам объединения"},{"value":"beneficiaries","label":"Получателям помощи или поддержки"},{"value":"companies","label":"Юридическим лицам и предпринимателям"},{"value":"authorities","label":"Органам власти и публичным учреждениям"}]},{"id":"paid","label":"Планируется ли платная деятельность?","type":"radio","required":true,"options":[{"value":"main","label":"Да, основной источник финансирования"},{"value":"additional","label":"Да, дополнительное направление"},{"value":"no","label":"Нет, услуги или товары не продаём"},{"value":"unknown","label":"Пока неизвестно"}],"source":["gk50","nko24"],"explain":"В НКО платные услуги разрешены, если служат её уставным целям, соответствуют им и предусмотрены уставом. Сам по себе объём выручки не делает организацию коммерческой. Для отдельных услуг требуется лицензия."},{"id":"mission_paid","label":"Соответствуют ли платные услуги заявленной некоммерческой цели?","type":"radio","required":true,"options":[{"value":"yes","label":"Да, непосредственно служат этой цели"},{"value":"part","label":"Часть услуг связана с целью, часть — самостоятельный бизнес"},{"value":"no","label":"Нет, это отдельное коммерческое направление"},{"value":"unknown","label":"Пока не определили"}],"when":{"all":[{"id":"paid","in":["main","additional"]},{"id":"goal","in":["services","members","charity","civic","mixed"]}]},"source":["gk50","nko24"],"explain":"Для НКО важна не величина выручки, а связь доходной деятельности с уставными целями. Несвязанное направление нельзя легализовать только тем, что прибыль не выплачивается учредителям."},{"id":"profits","label":"Что предполагается делать с прибылью?","type":"radio","required":true,"options":[{"value":"distribute","label":"Распределять между владельцами"},{"value":"keep","label":"Направлять на деятельность и развитие организации"},{"value":"noincome","label":"Прибыль не предполагается"},{"value":"mixed","label":"Часть распределять владельцам, часть направлять на развитие"}],"source":["gk50","gk1232","co24"],"explain":"В ООО прибыль может распределяться между участниками. Обычные НКО не распределяют прибыль как доход от участия. Кооперативные выплаты допустимы только в установленных специальным законом случаях: например, ст. 24 закона № 3085-1 касается потребительских обществ, а не всех видов потребительских кооперативов.","help":"НКО может получать доход от платных услуг и направлять его на уставные цели, но не распределять прибыль между учредителями и членами. Если предполагаются и ООО, и НКО, выберите смешанную модель проекта."},{"id":"founders","label":"Каков предполагаемый состав учредителей на начальном этапе?","type":"radio","required":true,"options":[{"value":"1","label":"Один"},{"value":"2","label":"Два"},{"value":"3to50","label":"От 3 до 50"},{"value":"over50","label":"Более 50"}],"source":["gk1239","ob18","gk12324"],"explain":"Для ООО возможен один участник, максимум 50. Для обычной ассоциации нужны не менее двух учредителей; для АНО возможен один. Для общественного объединения необходимы по меньшей мере три учредителя — физических лица. Отдельные виды организаций подчиняются специальным правилам.","help":"Укажите количество лиц, которые реально готовы участвовать в создании организаций. Если для разных форм состав будет различаться, это уточняется отдельно после выбора форм."},{"id":"founder_types","label":"Кто будет создавать организацию?","type":"multi","required":true,"options":[{"value":"individuals","label":"Физические лица"},{"value":"companies","label":"Коммерческие юридические лица"},{"value":"npo","label":"Некоммерческие юридические лица"},{"value":"foreign","label":"Есть иностранные граждане или юридические лица"}],"help":"Для предварительного выбора нужны категории, а не имена и паспортные данные. Для двух организаций состав будет уточнён отдельно."},{"id":"public_three","label":"Есть ли среди учредителей минимум три физических лица?","type":"radio","required":true,"options":[{"value":"yes","label":"Да"},{"value":"no","label":"Нет"}],"when":{"all":[{"any":[{"id":"goal","in":["civic"]},{"form":["public_org","public_mov"]}]},{"id":"founders","in":["3to50","over50"]}]},"source":["ob18"],"explain":"Статья 18 закона № 82-ФЗ предусматривает создание общественного объединения по инициативе не менее трёх физических лиц. Юридические лица — общественные объединения могут выступать учредителями вместе с ними в допустимых случаях."},{"id":"legal_risks","label":"Есть ли специальные направления деятельности?","type":"multi","required":true,"options":[{"value":"education","label":"Образование или образовательные программы"},{"value":"health","label":"Медицинские услуги"},{"value":"finance","label":"Финансовые услуги, кредитование, страхование"},{"value":"sro","label":"Саморегулируемая организация (СРО)"},{"value":"employers","label":"Объединение работодателей со специальным статусом"},{"value":"sport","label":"Спортивная федерация"},{"value":"religion","label":"Религиозная организация"},{"value":"housing","label":"Товарищество собственников / ЖК / ЖСК"},{"value":"professional","label":"Лицензируемая или регулируемая профессия"},{"value":"international","label":"Иностранное финансирование или зарубежные проекты"},{"value":"none","label":"Ничего из перечисленного","exclusive":true}],"explain":"Выбор ОПФ и состав устава могут зависеть от специального закона. Само указание образовательной или медицинской деятельности в уставе не заменяет лицензии."}]},{"id":"choice","title":"Выбор правовой формы","questions":[{"id":"form_select","label":"Какие организационно-правовые формы рассматриваете?","type":"multi","required":true,"options":[{"value":"ooo","label":"ООО","note":"Коммерческая компания с уставным капиталом и долями участников."},{"value":"association","label":"Ассоциация (союз)","note":"НКО с членством для общих интересов участников."},{"value":"ano","label":"Автономная некоммерческая организация (АНО)","note":"НКО без членства, создаваемая в том числе для оказания услуг."},{"value":"fund","label":"Общественно полезный фонд","note":"НКО без членства для социально полезных целей и использования имущества."},{"value":"public_org","label":"Общественная организация","note":"Общественное объединение с членством."},{"value":"public_mov","label":"Общественное движение","note":"Общественное объединение без членства, с участниками."},{"value":"coop","label":"Потребительский кооператив","note":"Паевое объединение; требования зависят от разновидности кооператива."},{"value":"ip","label":"ИП","note":"Предприниматель без образования юридического лица, устава нет."}],"source":["gk1239","ob18"],"explain":"Минимальное число учредителей зависит от правовой формы. Ассоциации требуется не менее двух, общественному объединению — не менее трёх физических лиц; ООО может иметь одного учредителя, но не более пятидесяти участников. НКО не распределяет прибыль между учредителями и членами. При специальном статусе отдельные требования проверяются дополнительно.","max":null,"help":"Можно выбрать несколько подходящих форм. Ответы об уставе каждой формы сохраняются отдельно. Недопустимые варианты недоступны и сопровождаются причиной."}],"desc":"Этот выбор определяет следующие разделы. Если форму ещё не выбрали, результат покажет ориентиры и нерешённые вопросы."},{"id":"charter_team","title":"Учредители этой организации","desc":"При подготовке двух уставов у организаций могут быть разные учредители. Уточните состав отдельно для каждой формы — без имён и персональных данных.","when":{"twoForms":true},"questions":[{"id":"charter_founders","label":"Сколько учредителей будет именно у этой организации?","type":"radio","required":true,"options":[{"value":"1","label":"Один"},{"value":"2","label":"Два"},{"value":"3to50","label":"От 3 до 50"},{"value":"over50","label":"Более 50"}],"source":["gk1239","gk12324","ob18","oo32"],"explain":"Для каждой из двух организаций проверьте собственный состав учредителей. Число учредителей одной организации не обязательно равно числу учредителей другой. Для ООО действует ограничение числа участников, для ассоциации — минимум два учредителя, для общественного объединения — не менее трёх физических лиц.","help":"При сравнении нескольких форм число учредителей может различаться (например, ООО — один, ассоциация — два)."},{"id":"charter_founder_types","label":"Кто будет учредителем именно этой организации?","type":"multi","required":true,"options":[{"value":"individuals","label":"Граждане"},{"value":"companies","label":"Коммерческие юридические лица"},{"value":"npo","label":"Некоммерческие юридические лица"},{"value":"foreign","label":"Иностранные граждане или юридические лица"}],"explain":"Укажите категории; персональные сведения для регистрации будут собираться отдельно. Допустимый состав учредителей проверяется по законодательству о выбранной форме."},{"id":"charter_public_three","label":"Есть ли среди учредителей этой организации минимум три физических лица?","type":"radio","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"founders_form","in":["3to50","over50"]}]},"options":[{"value":"yes","label":"Да"},{"value":"no","label":"Нет"}],"source":["ob18"],"explain":"Для общественного объединения нужны не менее трёх учредителей — физических лиц. Указание общего числа учредителей само по себе не подтверждает этот состав."}]},{"id":"identity","title":"Наименование и деятельность","questions":[{"id":"full_name","label":"Предлагаемое полное наименование","type":"input","required":true,"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: Общество с ограниченной ответственностью «Вектор»","source":["oo4","nko14"],"explain":"Наименование юридического лица проверяется по требованиям его ОПФ, специальным ограничениям и отсутствию противоречий с законом. Для ООО полное фирменное наименование обязательно, сокращённое по ст. 4 закона № 14-ФЗ — по желанию."},{"id":"short_name_llc","label":"Сокращённое фирменное наименование ООО (при необходимости)","type":"input","required":false,"when":{"form":["ooo"]},"placeholder":"Например: ООО «Вектор»","source":["oo4","oo12"],"explain":"Статья 4 закона № 14-ФЗ допускает, но не требует сокращённое фирменное наименование. Статья 12 об обязательном содержании индивидуального устава применяется с учётом того, что у общества может не быть сокращённого наименования.","help":"Можно оставить пустым: для ООО сокращённое наименование не обязательно."},{"id":"short_name_npo","label":"Нужно ли сокращённое наименование НКО?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да"}],"when":{"form":["association","ano","fund","public_org","public_mov","coop"]}},{"id":"short_name_npo_txt","label":"Какое сокращённое наименование использовать?","type":"input","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"id":"short_name_npo","in":["yes"]}]},"placeholder":"Например: АНО «Центр образования»"},{"id":"location","label":"Место нахождения юридического лица","type":"input","required":true,"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: Калининградская область, город Калининград","source":["oo12","nko14"],"explain":"В уставе обычно указывается населённый пункт (муниципальное образование) как место нахождения. Для ЕГРЮЛ отдельно потребуется полный адрес в пределах места нахождения. Не нужно вносить персональный адрес физического лица в анкету."},{"id":"name_special","label":"Требуются ли особые слова, статус или географическое указание в названии?","type":"textarea","required":false,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: региональная общественная организация; профессиональное отраслевое объединение.","explain":"Использование слов «Россия», «Российская Федерация», наименований органов власти, а также некоторых отраслевых обозначений может иметь специальный правовой режим."},{"id":"duration","label":"Срок деятельности","type":"radio","required":true,"options":[{"value":"indef","label":"Без ограничения срока"},{"value":"fixed","label":"На определённый срок"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"duration_text","label":"На какой срок?","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"duration","in":["fixed"]}]},"placeholder":"Например: до 31.12.2030"},{"id":"npo_goals","label":"Конкретные некоммерческие цели","type":"textarea","required":true,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: развитие и защита профессиональных интересов членов отрасли; предоставление доступного дополнительного образования.","source":["nko14","gk1239","gk12324"],"explain":"Для НКО цель должна быть некоммерческой и определимой. Общей фразы «иная не запрещённая деятельность» недостаточно для описания предмета и целей."},{"id":"npo_activities","label":"Какие конкретные виды деятельности необходимы для этих целей?","type":"textarea","required":true,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: семинары; консультации; отраслевые исследования; образовательные программы; издание материалов.","source":["nko24"],"explain":"Отделяйте цели от способов их достижения. Если предполагаются платные услуги, они должны соответствовать целям, а для отдельных видов деятельности может потребоваться лицензия."},{"id":"npo_income","label":"Как НКО будет финансироваться?","type":"multi","required":true,"options":[{"value":"fees","label":"Членские взносы"},{"value":"donations","label":"Пожертвования"},{"value":"grants","label":"Гранты или субсидии"},{"value":"service","label":"Платные услуги, работы, продажа результатов деятельности"},{"value":"founders","label":"Имущественные взносы учредителей"},{"value":"property","label":"Доходы от имущества и разрешённой деятельности"},{"value":"other","label":"Иные законные источники"}],"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"explain":"Членские взносы относятся к членским НКО. У АНО и фонда без членства поступления от заказчиков называются платой за услуги, а имущественные поступления учредителей — взносами или пожертвованиями по основанию платежа. Отдельный налоговый режим целевых поступлений требует правильного учёта.","source":["nko24","gk12311"]},{"id":"paid_services","label":"Какие платные услуги или товары предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"any":[{"id":"paid","in":["main","additional"]},{"id":"npo_income","has":["service"]}]}]},"placeholder":"Перечислите конкретные виды платной деятельности, связанные с уставными целями.","source":["nko24","gk12311"],"explain":"Платные услуги допустимы, если способствуют достижению некоммерческих уставных целей и прямо предусмотрены уставом. Для ассоциации дополнительно учитывайте ст. 123.11 ГК РФ: её члены по общему правилу вправе на равных началах безвозмездно пользоваться услугами ассоциации, если законом не предусмотрено иное. Поэтому плату за такие услуги членам нужно юридически оценивать отдельно."}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"governance","title":"Руководитель и управление","questions":[{"id":"head_title","label":"Название должности руководителя","type":"radio","required":true,"options":[{"value":"director","label":"Директор"},{"value":"general","label":"Генеральный директор"},{"value":"chair","label":"Председатель"},{"value":"president","label":"Президент"},{"value":"other","label":"Другое"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Название должности определяет наименование единоличного исполнительного органа в уставе и ЕГРЮЛ. Порядок назначения зависит от формы: в АНО руководителя назначают учредители, в фонде — высший коллегиальный орган, если специальным законом не предусмотрено иное. Название не меняет законную компетенцию.","source":["gk12325","gk12319","oo40"]},{"id":"head_other","label":"Какое название должности выбрать?","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"head_title","in":["other"]}]},"placeholder":"Например: Исполнительный директор"},{"id":"head_term","label":"Срок полномочий руководителя","type":"radio","required":true,"options":[{"value":"1","label":"1 год"},{"value":"3","label":"3 года"},{"value":"5","label":"5 лет"},{"value":"other","label":"Другой определённый срок"}],"help":"Срок используется для подготовки устава; для разных форм возможны отдельные требования закона.","when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"head_term_other","label":"Укажите срок полномочий","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"head_term","in":["other"]}]},"placeholder":"Например: 2 года"},{"id":"head_absence","label":"Кто временно замещает руководителя при его отсутствии?","type":"radio","required":true,"options":[{"value":"deputy","label":"Заместитель, если назначен"},{"value":"person","label":"Лицо, назначенное компетентным органом"},{"value":"byorder","label":"Лицо по доверенности или распоряжению в пределах закона"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Замещение нужно разграничивать с полномочиями единоличного исполнительного органа, сведения о котором содержатся в ЕГРЮЛ. Доверен ,"in":["2","3to50"]}]},"placeholder":"Например: участник А — 60 %, участник Б — 40 % (итого 100 %). Имена для устава не требуются.","source":["oo14"],"explain":"Точные доли нужны для пакета документов о создании ООО и проектирования управления, но в индивидуальном уставе обычно не перечисляют Ф. И. О. участников."},{"id":"llc_moreowners","label":"Планируются ли новые участники или инвесторы, получающие доли?","type":"radio","required":true,"options":[{"value":"yes","label":"Да, возможность входа новых участников важна"},{"value":"no","label":"Нет, состав планируется постоянным"},{"value":"maybe","label":"Возможно в будущем"}],"when":{"form":["ooo"]}},{"id":"llc_profit","label":"Как часто предполагается принимать решение о распределении прибыли?","type":"radio","required":true,"options":[{"value":"quarter","label":"Ежеквартально"},{"value":"half","label":"Раз в полгода"},{"value":"year","label":"Раз в год"},{"value":"asneeded","label":"При необходимости, но в пределах установленной законом периодичности"}],"when":{"form":["ooo"]},"explain":"Статья 28 закона № 14-ФЗ предусматривает принятие решения о распределении чистой прибыли ежеквартально, раз в полгода либо раз в год. Возможность распределить прибыль также ограничена законом; это не автоматическая выплата денег с расчётного счёта.","source":["oo28"]},{"id":"llc_profit_order","label":"По каким долям распределять чистую прибыль участникам ООО?","type":"radio","required":true,"options":[{"value":"proportional","label":"Пропорционально долям в уставном капитале"},{"value":"special","label":"Нужен иной порядок распределения — описать отдельно"}],"when":{"form":["ooo"]},"explain":"По общему правилу распределяемая прибыль делится пропорционально долям. Иной порядок допускается при соблюдении специальных требований ст. 28 закона № 14-ФЗ, в частности единогласного решения при утверждении соответствующего положения устава.","source":["oo28"]},{"id":"llc_profit_order_details","label":"Какой особый порядок распределения прибыли нужен?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_profit_order","in":["special"]}]},"placeholder":"Например, фиксированная пропорция или иная согласованная формула с соблюдением закона."},{"id":"llc_exit","label":"Нужно ли право добровольного выхода участника из ООО по заявлению?","type":"radio","required":true,"options":[{"value":"no","label":"Не предусматривать"},{"value":"all","label":"Предусмотреть для участников"},{"value":"conditional","label":"Предусмотреть в отношении определённых лиц / при определённых условиях"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo26"],"explain":"Выход по заявлению существует только если он предусмотрен уставом. Он отличается от продажи доли; выход единственного участника, в результате которого не остаётся участников, не допускается."},{"id":"llc_exit_terms","label":"Кому и при каких обстоятельствах разрешить выход?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_exit","in":["conditional"]}]},"placeholder":"Например: при достижении определённого срока участия или для участников с определённой долей.","source":["oo26"]},{"id":"llc_transfer","label":"Как регулировать отчуждение долей третьим лицам?","type":"radio","required":true,"options":[{"value":"law","label":"По законным правилам без дополнительного запрета"},{"value":"consent","label":"С согласия участников / общества в допустимом порядке"},{"value":"ban","label":"Предусмотреть запрет отчуждения третьим лицам"}],"when":{"form":["ooo"]},"source":["oo21"],"explain":"Правила отчуждения долей важны и в ООО с одним участником: они определяют возможность вступления новых лиц и дальнейшего оборота долей. Закон позволяет дополнительно ограничить переход доли к третьим лицам, но требует соблюдения гарантий."},{"id":"llc_preempt","label":"Нужен ли особый порядок преимущественной покупки доли?","type":"radio","required":true,"options":[{"value":"law","label":"Оставить законный порядок"},{"value":"modified","label":"Установить разрешённые законом особенности цены или распределения"},{"value":"nonapply","label":"Проработать допустимое законом неприменение преимущественного права"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo21"],"explain":"С 2025 года закон допускает отдельные специальные условия о преимущественном праве. Они не вводятся произвольно и требуют проверки предусмотренных законом условий."},{"id":"llc_preempt_details","label":"Опишите желаемый особый порядок покупки долей","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_preempt","in":["modified","nonapply"]}]},"placeholder":"Например: иная цена предложения доли, особенности распределения права между участниками либо его неприменения в предусмотренных законом случаях.","explain":"Ограничение или изменение преимущественного права требует точной формулировки и соблюдения статьи 21 закона № 14-ФЗ. Окончательный механизм согласовывается юристом.","source":["oo21"]},{"id":"llc_inheritance","label":"Как переходят доли наследникам и правопреемникам?","type":"radio","required":true,"options":[{"value":"law","label":"По законному порядку"},{"value":"consent","label":"С согласия остальных участников в случаях, допустимых законом"}],"when":{"form":["ooo"]},"source":["oo21"],"explain":"Устав может предусматривать необходимость согласия остальных участников на переход доли к наследникам или правопреемникам в случаях, предусмотренных законом. Для ООО с одним участником правило тоже имеет значение, если состав участников изменится."},{"id":"llc_vote","label":"Как распределяются голоса на общем собрании?","type":"radio","required":true,"options":[{"value":"shares","label":"По долям участников (обычный порядок)"},{"value":"other","label":"Нужен иной порядок, который необходимо согласовать с законом"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo37"],"explain":"Обычное правило связано с размером доли. Изменение порядка требует соблюдения специальных правил закона и может не подходить для типового устава."},{"id":"llc_vote_details","label":"Как именно должны распределяться голоса?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_vote","in":["other"]}]},"placeholder":"Опишите специальный порядок распределения голосов; сумма и пределы должны соответствовать закону.","explain":"Доли и число голосов нельзя произвольно изменить без соблюдения требований статьи 32 закона № 14-ФЗ. Не путайте число голосов с повышенным большинством по отдельным решениям.","source":["oo32","oo37"]},{"id":"llc_council","label":"Нужен ли совет директоров / наблюдательный совет?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, нужен"}],"when":{"form":["ooo"]},"source":["oo32"]},{"id":"llc_council_details","label":"Состав, срок и реальные полномочия совета директоров","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_council","in":["yes"]}]},"placeholder":"Например: 3 члена; 3 года; контролирует бюджет, согласует сделки.","source":["oo32"],"explain":"Совет не может получить вопросы исключительной компетенции общего собрания, которые закон не позволяет передавать."},{"id":"llc_eo_appoint","label":"Какой орган избирает / назначает руководителя ООО?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание участников"},{"value":"council","label":"Совет директоров в пределах предусмотренных законом полномочий"}],"when":{"all":[{"form":["ooo"]},{"id":"llc_council","in":["yes"]}]},"explain":"По общему правилу руководителя избирает общее собрание участников. Если предусмотрен совет директоров, устав может передать ему это полномочие. Факт принятия решения о назначении руководителя подлежит нотариальному удостоверению в предусмотренных законом случаях.","source":["oo40"]},{"id":"llc_certify","label":"Как подтверждать принятие решений участниками ООО?","type":"radio","required":true,"options":[{"value":"notary","label":"Нотариально, когда это требуется законом"},{"value":"alternative","label":"Предусмотреть допустимый законом альтернативный способ"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["gk671","oo40"],"explain":"Альтернативный способ подтверждения ряда корпоративных решений допустим по ст. 67.1 ГК РФ, но не заменяет нотариальную форму там, где она безусловно обязательна. В частности, факт принятия решения об избрании (назначении) единоличного исполнительного органа ООО подлежит нотариальному удостоверению по ст. 40 закона № 14-ФЗ (с предусмотренными законом исключениями)."},{"id":"llc_certify_method","label":"Какой способ подтверждения решений предпочитаете?","type":"radio","required":true,"options":[{"value":"all_sign","label":"Подписание протокола всеми участниками"},{"value":"part_sign","label":"Подписание протокола указанными участниками"},{"value":"technical","label":"Технические средства, достоверно подтверждающие принятие решения"}],"when":{"all":[{"form":["ooo"]},{"id":"llc_certify","in":["alternative"]}]},"explain":"Выбранный способ не применяется к решениям, для которых федеральный закон требует именно нотариальное удостоверение. В уставе должно быть достаточно точно описано, как подтверждается принятие решения и состав участников.","source":["gk671","oo40"]},{"id":"llc_meeting_conflict","label":"Нужен ли механизм разрешения тупика при равных голосах?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, обычных правил достаточно"},{"value":"negotiation","label":"Обязательное повторное обсуждение или переговоры"},{"value":"agreement","label":"Отдельное корпоративное соглашение / механизм выкупа при тупике"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"explain":"Нельзя просто отменить законные пороги голосования. Часть договорённостей об опционе, выкупе доли или конфликте лучше оформлять корпоративным договором, а не уставом."},{"id":"llc_special_rights","label":"Нужны ли дополнительные права или обязанности определённых участников?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, достаточно закона"},{"value":"yes","label":"Да, требуется отдельное описание"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo12"]},{"id":"llc_special_details","label":"Какие именно дополнительные права или обязанности нужны?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_special_rights","in":["yes"]}]},"placeholder":"Например: специальные права на информацию или обязанность участвовать в согласованных проектах."},{"id":"llc_obligations","label":"Нужны ли дополнительные обязанности участников сверх предусмотренных законом?","type":"radio","required":true,"options":[{"value":"statutory","label":"Нет, достаточно обязанностей по закону"},{"value":"additional","label":"Да, дополнительно предусмотреть обязанности в пределах закона"}],"when":{"form":["ooo"]},"explain":"Обязанности по закону будут включены в устав в любом случае. Дополнительные обязанности и права участников требуют точной формулировки и соблюдения порядка их введения.","source":["oo12"]},{"id":"llc_obligations_details","label":"Какие дополнительные обязанности предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_obligations","in":["additional"]}]},"placeholder":"Например: предоставление определённых сведений обществу, соблюдение внутренних процедур в пределах закона."},{"id":"llc_charter_mode","label":"Какой устав предполагается использовать?","type":"radio","required":true,"options":[{"value":"individual","label":"Индивидуальный устав по согласованным условиям"},{"value":"typical","label":"Проверить, подходит ли один из типовых уставов ФНС"}],"when":{"form":["ooo"]},"source":["oo12","fns"],"explain":"Типовой устав, утверждённый ФНС, применяется без редактирования. Нужно выбрать конкретный вариант и проверить его условия о выходе, продаже долей, управлении и подтверждении решений. Если индивидуальные правила не совпадают с выбранным типовым уставом, требуется индивидуальная редакция."},{"id":"llc_typical_number","label":"Какой номер типового устава ООО ФНС выбран?","type":"input","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_charter_mode","in":["typical"]}]},"source":["fns","oo12"],"help":"Существуют 36 утверждённых типовых уставов ООО. Их текст нельзя произвольно менять. Для нестандартных условий потребуется индивидуальный устав.","explain":"На сайте ФНС необходимо выбрать конкретный утверждённый типовой устав и проверить его условия. Номер не заменяет проверку применимости к решениям участников. Изменять текст типового устава нельзя.","number":true,"min":1,"step":1,"max":36}],"when":{"form":["ooo"]}},{"id":"association_members","title":"Ассоциация: членство","questions":[{"id":"assoc_members","label":"Кого можно принимать в члены ассоциации?","type":"multi","required":true,"options":[{"value":"people","label":"Физических лиц"},{"value":"legal","label":"Юридических лиц"},{"value":"requirements","label":"Только соответствующих специальным профессиональным критериям"}],"when":{"form":["association"]},"source":["gk1239","gk12311"],"explain":"Ассоциация объединяет граждан и/или юридических лиц. Профессиональные или иные объективные критерии членства могут быть закреплены в уставе, но не должны нарушать императивные корпоративные права членов."},{"id":"assoc_criteria","label":"Каковы объективные требования к новым членам?","type":"textarea","required":true,"when":{"form":["association"]},"placeholder":"Например: осуществление деятельности в определённой профессиональной сфере, соблюдение отраслевых требований."},{"id":"assoc_admission","label":"Какой орган принимает новых членов?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание членов"},{"value":"board","label":"Совет / правление"},{"value":"director","l "Нужно учитывать корпоративные права членов и характер выбранной ассоциации. Специальный порядок требует отдельной правовой проверки."},{"id":"assoc_member_rights","label":"Какие дополнительные возможности предоставлять членам?","type":"multi","required":false,"options":[{"value":"events","label":"Льготы на мероприятия или образовательные программы"},{"value":"experts","label":"Экспертная или информационная поддержка"},{"value":"projects","label":"Участие в рабочих группах и проектах"},{"value":"other","label":"Иные преимущества"}],"help":"Законные корпоративные права членов (участие в управлении и доступ к информации) сохраняются независимо от выбора.","when":{"form":["association"]},"source":["gk12311"]},{"id":"assoc_extra_duties","label":"Нужны ли членам дополнительные обязанности помимо установленных законом?","type":"radio","required":true,"options":[{"value":"statutory","label":"Нет, достаточно обязательных правил и взносов"},{"value":"additional","label":"Да, предусмотреть специальные обязанности"}],"when":{"form":["association"]},"explain":"Члены обладают корпоративными правами по ГК РФ; дополнительные обязанности должны быть законными, определёнными и соразмерными целям объединения.","source":["gk12311"]},{"id":"assoc_extra_duties_details","label":"Какие дополнительные обязанности предусматриваются для членов?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_extra_duties","in":["additional"]}]}},{"id":"assoc_exit","label":"Как оформлять добровольный выход?","type":"radio","required":true,"options":[{"value":"written","label":"Письменным заявлением с подтверждением получения"},{"value":"electronic","label":"Письменным заявлением, включая предусмотренный уставом электронный способ"}],"when":{"form":["association"]},"source":["gk12311"],"explain":"Член ассоциации вправе выйти в любое время по своему усмотрению. Устав может определить процедуру, но не лишить права выхода."},{"id":"assoc_exclusion","label":"По каким основан when":{"form":["fund"]}},{"id":"fund_change_charter","label":"Кто сможет принимать решение об изменении устава фонда?","type":"radio","required":true,"options":[{"value":"highest","label":"Высший коллегиальный орган (общее правило)"},{"value":"founder","label":"Учредитель, если право прямо закреплено в уставе и допустимо по закону"}],"when":{"form":["fund"]},"explain":"Статья 123.20 ГК РФ предусматривает изменение устава высшим коллегиальным органом фонда, если уставом не предусмотрена возможность его изменения по решению учредителя. Судебное изменение допускается в специальных обстоятельствах. Процедуру нельзя сформулировать как полностью произвольный выбор.","source":["gk12320"]},{"id":"fund_asset","label":"Какие основные виды имущества или поступлений предполагаются?","type":"multi","required":true,"options":[{"value":"donations","label":"Пожертвования"},{"value":"grants","label":"Гранты и субсидии"},{"value":"immovable","label":"Недвижимость или крупные имущественные вклады"},{"value":"revenue","label":"Доходная деятельность, связанная с целями фонда"},{"value":"other","label":"Иные поступления"}],"when":{"form":["fund"]}}],"when":{"form":["fund"]}},{"id":"public","title":"Общественное объединение","questions":[{"id":"public_territory","label":"На какой территории будет действовать объединение?","type":"radio","required":true,"options":[{"value":"local","label":"Местный уровень"},{"value":"regional","label":"Региональный уровень"},{"value":"interregional","label":"Межрегиональный уровень"},{"value":"allrussia","label":"Общероссийский уровень"}],"when":{"form":["public_org","public_mov"]},"source":["ob14","ob20"],"explain":"Общероссийское объединение действует более чем в половине субъектов РФ и имеет там структурные подразделения. Межрегиональное действует в нескольких субъектах, охватывая менее половины их числа, и тоже имеет подразделения. Региональное действует в пределах одного субъекта, местное — в пределах муниципального образования (ст. 14 закона № 82-ФЗ)."},{"id":"public_territory_details","label":"Какие территории или регионы предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_territory","in":["local","regional","interregional","allrussia"]}]},"placeholder":"Например: Калининградская область; г. Калининград; перечень субъектов РФ."},{"id":"public_structure","label":"Нужны ли территориальные отделения или структурные подразделения?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, планируются"}],"when":{"form":["public_org","public_mov"]},"source":["ob14","ob20"],"explain":"Для общероссийского и межрегионального объединения территориальные структурные подразделения обязательны. Укажите, какие отделения, организации, филиалы или представительства будут действовать и где."},{"id":"public_structure_details","label":"Какие отделения, кто ими управляет, кому принадлежит имущество?","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_structure","in":["yes"]}]},"placeholder":"Например: местные отделения; порядок создания, руководители, имущество и отчётность.","source":["ob20"]},{"id":"public_branch_assets","label":"Как отделения будут распоряжаться имуществом объединения?","type":"radio","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_structure","in":["yes"]}]},"options":[{"value":"central","label":"Распоряжение имуществом централизовано; отделения действуют в пределах предоставленных полномочий"},{"value":"delegated","label":"Определённые имущественные полномочия передаются подразделениям в порядке устава и закона"}],"source":["ob20"],"explain":"Статья 20 закона № 82-ФЗ требует отразить права общественного объединения и его подразделений по управлению имуществом. Статус подразделений влияет на то, кому принадлежит имущество и кто вправе им распоряжаться."},{"id":"public_org_admission","label":"Порядок вступления в общественную организацию","type":"radio","required":true,"options":[{"value":"request","label":"Заявление и решение компетентного органа"},{"value":"request_meeting","label":"Заявление и решение общего собрания"}],"when":{"form":["public_org"]},"source":["ob20"]},{"id":"public_org_exclusion","label":"Основания и порядок прекращения членства","type":"multi","required":true,"options":[{"value":"exit","label":"Добровольный выход"},{"value":"violations","label":"Исключение за существенные нарушения устава"},{"value":"inactive","label":"Иные законные и определённые основания"}],"when":{"form":["public_org"]},"source":["ob20"],"explain":"Добровольный выход нельзя запретить уставом. Дополнительные основания прекращения членства должны быть конкретными, а порядок исключения — защищать права члена. Даже если вы не отметили выход как отдельный пункт, юрист должен предусмотреть его в уставе."},{"id":"public_org_rights","label":"Какие дополнительные права и обязанности будут у членов?","type":"textarea","required":true,"when":{"form":["public_org"]},"placeholder":"Например: участие в выборах органов, право получать информацию; обязанность соблюдать устав и решения органов, при наличии — уплачивать взносы.","explain":"Устав общественного объединения должен содержать права и обязанности членов, условия и порядок приобретения и утраты членства. Обязательные права и обязанности предусмотрены законом, а специальные уточняются в уставе.","source":["ob20"]},{"id":"public_mov_participants","label":"Как будет организовано участие сторонников движения?","type":"multi","required":true,"options":[{"value":"events","label":"Участие в мероприятиях"},{"value":"initiatives","label":"Рабочие группы и инициативы"},{"value":"representatives","label":"Участие в выборе делегатов или уполномоченных лиц"}],"when":{"form":["public_mov"]},"source":["ob20"],"explain":"Общественное движение не имеет членства. Участие в деятельности не должно описываться как членство с обязательными членскими взносами."},{"id":"public_congress","label":"Как часто проводить съезд, конференцию или общее собрание?","type":"radio","required":true,"options":[{"value":"year","label":"Ежегодно"},{"value":"two","label":"Раз в два года"},{"value":"three","label":"Раз в три года"}],"when":{"form":["public_org","public_mov"]}},{"id":"public_organs","label":"Какие выборные и контрольно-ревизионные органы необходимы?","type":"textarea","required":true,"when":{"form":["public_org","public_mov"]},"placeholder":"Например: общее собрание, совет, председатель, ревизор — порядок формирования и срок каждого.","help":"Для общественного движения обязателен выборный коллегиальный постоянно действующий руководящий орган. Перечислите органы и для каждого укажите порядок формирования, срок полномочий, компетенцию и правила принятия решений.","source":["ob9","ob20"],"explain":"По ст. 9 закона № 82-ФЗ для общественного движения обязателен выборный постоянно действующий коллегиальный руководящий орган; устав должен определить его формирование, компетенцию и порядок решений. Для иных общественных объединений состав органов определяется их специальными нормами."},{"id":"public_organs_terms","label":"Какие сроки полномочий установить для выборных и контрольных органов?","type":"textarea","required":true,"when":{"form":["public_org","public_mov"]},"explain":"В уставе общественного объединения должны быть определены состав, формирование, компетенция, сроки полномочий и принятие решений органами и отделениями.","source":["ob20"],"placeholder":"Например: правление — 3 года, ревизор — 2 года, председатель — 3 года. Для каждого органа укажите срок."},{"id":"public_member_fees","label":"Как определить обязательные членские взносы общественной организации?","type":"radio","required":true,"options":[{"value":"by_meeting","label":"Размер, периодичность и способ уплаты по решению высшего органа"},{"value":"formula","label":"По закреплённой в уставе формуле и решению компетентного органа"}],"when":{"all":[{"form":["public_org"]},{"id":"npo_income","has":["fees"]}]},"explain":"Обычные участники общественного движения без членства не платят именно членские взносы. Для общественной организации порядок формирования имущества и обязанности членов должны быть определены уставом.","source":["ob20","nko14"]},{"id":"public_member_fees_details","label":"Опишите размер, периодичность или формулу членских взносов","type":"textarea","required":true,"when":{"all":[{"form":["public_org"]},{"id":"public_member_fees","in":["formula"]}]}},{"id":"public_symbol","label":"Будет ли собственная символика, описание которой нужно включить в устав?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, символика уже определена"}],"when":{"form":["public_org","public_mov"]},"source":["ob20"],"explain":"При использовании символики общественного объединения её описание включается в устав."},{"id":"public_symbol_details","label":"Опишите символику словами","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_symbol","in":["yes"]}]},"placeholder":"Например: цвет, композиция, надписи и отличительные элементы."}],"when":{"form":["public_org","public_mov"]}},{"id":"coop","title":"Потребительский кооператив","questions":[{"id":"coop_type","label":"Какой именно потребительский кооператив предполагается?","type":"radio","required":true,"options":[{"value":"general","label":"Обычный потребительский кооператив — потребуется уточнить применимость специального закона"},{"value":"housing","label":"Жилищный / жилищно-строительный / гаражный"},{"value":"credit","label":"Кредитный, сельскохозяйственный или иной специально регулируемый"}],"when":{"form":["coop"]},"source":["gk1232","co24"],"explain":"Общее название «потребительский кооператив» не определяет полный набор требований. Жилищные, кредитные, сельскохозяйственные кооперативы и потребительские общества регулируются различными специальными законами. До подготовки устава следует установить точную разновидность."},{"id":"coop_needs","label":"Какие материальные потребности будут удовлетворять члены кооператива?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: совместное приобретение оборудования и распределение расходов."},{"id":"coop_members","label":"Кто будет членами?","type":"radio","required":true,"options":[{"value":"people","label":"Граждане"},{"value":"mix","label":"Граждане и юридические лица"},{"value":"special","label":"Другой состав, требующий проверки специального закона"}],"when":{"form":["coop"]},"source":["gk1232"]},{"id":"coop_share","label":"Каков размер паевого взноса и срок его внесения?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: 20 000 рублей, оплата при вступлении или по графику.","source":["gk1232"],"explain":"Размер, состав, порядок внесения паевых взносов и ответственность за просрочку относятся к обязательным условиям устава."},{"id":"coop_share_violations","label":"Какие последствия установлены за просрочку внесения паевого взноса?","type":"textarea","required":true,"when":{"form":["coop"]},"explain":"Ответственность члена за нарушение обязанности по внесению паевых взносов — обязательное положение устава по ст. 123.2 ГК РФ. Формулировка должна учитывать специальный закон для конкретного вида кооператива.","source":["gk1232"],"placeholder":"Например: требование об уплате, предусмотренная законом неустойка и порядок рассмотрения вопроса о членстве."},{"id":"coop_losses","label":"Как члены будут покрывать убытки кооператива?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: дополнительными взносами в установленном законом порядке.","source":["gk1233"],"explain":"В соответствии со ст. 123.3 ГК РФ члены потребительского кооператива обязаны покрыть убытки дополнительными взносами в установленные сроки и несут ограниченную размером невнесённого дополнительного взноса субсидиарную ответственность. Специальные нормы для выбранног // The questionnaire is self-contained; no answers leave the browser.
const SECTIONS = CONFIG.sections;

const BY_ID = Object.fromEntries(SECTIONS.flatMap(s=>s.questions).map(q=>[q.id,q]));
const LABELS = Object.fromEntries(BY_ID.form_select.options.map(o=>[o.value,o.label]));
const COMMON_IDS = new Set(SECTIONS.find(s=>s.id==='project').questions.map(q=>q.id).concat('form_select'));
const COMMON = Object.create(null);
const FORM_VALUES = Object.create(null);
const OPEN_NOTES = new Set();

let ACTIVE_FORM = null;

const $ = id=>document.getElementById(id);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const choices=()=>Array.isArray(COMMON.form_select)?COMMON.form_select:[];
const defaultValue=id=>BY_ID[id]?.default;
const get=id=>id==='form'?ACTIVE_FORM:id==='founders_form'?(choices().length>1?FORM_VALUES[ACTIVE_FORM]?.charter_founders:COMMON.founders):COMMON_IDS.has(id)?COMMON[id]:(FORM_VALUES[ACTIVE_FORM]?.[id]??defaultValue(id));
const effectiveFounderTypes=()=>choices().length>1?FORM_VALUES[ACTIVE_FORM]?.charter_founder_types||[]:COMMON.founder_types||[];
const effectivePublicThree=()=>choices().length>1?FORM_VALUES[ACTIVE_FORM]?.charter_public_three:COMMON.public_three;
const NPO_FORMS=['association','ano','fund','public_org','public_mov'];
const FORM_IDS=Object.keys(LABELS);
function ineligibleReason(form){
 const founders=COMMON.founders,types=COMMON.founder_types||[],goal=COMMON.goal,profits=COMMON.profits;
 const source=COMMON.current,stage=COMMON.stage;
 if(stage==='amend'&&source&&source!=='other'){
   if(source==='ip')return 'ИП не имеет устава: для организации потребуется отдельная регистрация.';
   const same=source==='public'?['public_org','public_mov'].includes(form):source===form;
   if(!same)return 'При изменении устава действующего юридического лица сохраняется его ОПФ. Для смены формы требуется допустимая законом реорганизация.';
 }
 if(stage==='transform'&&source==='ip')return 'ИП не является юридическим лицом и не может преобразовываться в организацию в порядке реорганизации.';
 if(form==='ip'){
   if(['2','3to50','over50'].includes(founders))return 'ИП регистрируется одним физическим лицом, а не группой учредителей.';
   if(types.length&&!types.includes('individuals')&&!types.includes('foreign'))return 'ИП может быть только физическим лицом, не юридическим.';
   if(stage==='transform')return 'ИП не возникает в результате преобразования юридического лица.';
 }
 if(form==='ooo'&&founders==='over50')return 'В ООО не может быть более 50 участников (ст. 7 закона № 14-ФЗ).';
 if(form==='association'&&founders==='1')return 'Для ассоциации требуется не менее двух учредителей (ст. 123.9 ГК РФ).';
 if(['public_org','public_mov'].includes(form)){
   if(['1','2'].includes(founders))return 'Общественное объединение создаётся минимум тремя физическими лицами (ст. 18 закона № 82-ФЗ).';
   if(types.length&&!types.includes('individuals'))return 'В числе учредителей должны быть минимум три физических лица (ст. 18 закона № 82-ФЗ).';
   if(COMMON.public_three==='no')return 'Вы указали, что трёх учредителей — физических лиц нет (ст. 18 закона № 82-ФЗ).';
 }
 if(form==='coop'&&founders==='1')return 'Для кооператива требуется несколько участников; точный минимум зависит от вида и специального закона.';
 if(NPO_FORMS.includes(form)){
   if(goal==='business')return 'Основная цель обычной НКО не может состоять в коммерческой прибыли собственников (ст. 50 ГК РФ).';
   if(['distribute','mixed'].includes(profits)&&goal!=='mixed')return 'НКО не распределяет прибыль между учредителями или членами (ст. 50 ГК РФ). Для отдельной НКО и коммерческого бизнеса укажите смешанную модель.';
   if(COMMON.mission_paid==='no'&&goal!=='mixed')return 'Указанные платные услуги не соответствуют некоммерческой цели. НКО вправе вести приносящую доход деятельность только в соответствии с целями (ст. 50 ГК РФ).';
 }
 return '';
}
function synchronizeSelected(){
 const old=choices(),removed=old.filter(f=>!!ineligibleReason(f));
 if(!removed.length)return;
 COMMON.form_select=old.filter(f=>!removed.includes(f));
 eligibilityNotice=removed.map(f=>`${LABELS[f]}: ${ineligibleReason(f)}`).join(' ');
 if(!choices().includes(ACTIVE_FORM))ACTIVE_FORM=choices()[0]||null;
}
function setAnswer(id,value){
 if(id==='form_select'){
   COMMON.form_select=(Array.isArray(value)?value:[]).filter((v,i,a)=>LABELS[v]&&a.indexOf(v)===i&&!ineligibleReason(v));
   if(!choices().includes(ACTIVE_FORM))ACTIVE_FORM=choices()[0]||null;
   eligibilityNotice='';return;
 }
 const store=COMMON_IDS.has(id)?COMMON:(FORM_VALUES[ACTIVE_FORM]??=Object.create(null));

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Анкета для выбора формы организации и подготовки устава</title>
<style>
:root{--ink:#202c32;--dim:#57646b;--hint:#6d7980;--rule:#e3e8eb;--field:#b6c3ca;--accent:#175269;--pale:#f3f6f7;--alert:#6e4534;--error:#a73a33}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:white;color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1250px;margin:auto;padding:22px 30px 65px}
.columns{display:grid;grid-template-columns:minmax(210px,260px) minmax(0,790px);gap:58px;align-items:start}
.sidebar{position:sticky;top:18px;padding-top:6px;min-width:0}
.sidebar-title{font-size:13px;font-weight:700;margin:0 0 12px}
.nav{display:grid;gap:1px}
.nav button{display:block;border:0;background:transparent;width:100%;text-align:left;color:var(--dim);padding:11px 12px;min-height:46px;border-radius:4px;font-size:13px;line-height:1.4}
.nav button:hover{color:var(--ink);background:var(--pale)}
.nav button.current{background:var(--pale);color:var(--accent);font-weight:700}
.nav button .count{display:block;color:var(--hint);font-size:11px;font-weight:400;margin-top:3px}
.nav-toggle{display:none}
.progress-wrap{padding:19px 10px 0}
.bar{height:4px;background:#e6ecef;border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .15s ease}
.progress-label{margin:8px 0 0;color:var(--dim);font-size:12px}
.privacy{padding:0 10px;color:var(--hint);font-size:12px;line-height:1.55;margin-top:25px}
.content{min-width:0}
h1{font-size:25px;line-height:1.3;letter-spacing:-.02em;margin:0 0 15px;font-weight:720}
.section-desc{font-size:14px;color:var(--dim);margin:0 0 21px;max-width:720px}
.question{min-width:0;border:0;padding:20px 0 25px;margin:0}
.question+.question{border-top:0}
.question legend{font-size:16px;font-weight:680;line-height:1.45;float:left;width:100%;padding:0;margin:0 0 7px}
.question legend:after{content:'';display:block;clear:both}
.req{color:var(--hint);font-weight:500;font-size:12px;margin-left:9px;white-space:nowrap}
.desc{clear:both;color:var(--dim);font-size:13px;margin:0 0 13px;line-height:1.55}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;row-gap:4px;clear:both;margin-top:4px}
.option{display:flex;min-height:48px;align-items:flex-start;gap:11px;padding:12px 12px;border-radius:4px;cursor:pointer;min-width:0;transition:background .14s ease}
.option:hover{background:#eef3f4}
.option input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto;margin:3px 0 0}
.option-title{display:block;font-size:14px;line-height:1.47;overflow-wrap:anywhere}
.option-sub{display:block;color:var(--dim);font-size:12px;line-height:1.48;margin-top:3px}
.option.chosen{background:var(--pale)}.option.chosen .option-title{font-weight:650}.option-disabled{opacity:.48;cursor:not-allowed}
.input{display:block;width:100%;padding:12px 13px;border:1px solid var(--field);border-radius:4px;background:white;font-size:14px;min-height:46px;clear:both}
textarea.input{resize:vertical;min-height:105px}
.input::placeholder{color:#78858d;opacity:1}
.note{clear:both;margin-top:12px}
.note summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);width:max-content;max-width:100%;padding:5px 0}
.note summary:hover{text-decoration:underline;text-underline-offset:3px}
.note-content{font-size:13px;line-height:1.65;color:#3d515a;max-width:700px;padding:5px 0 2px}
.note-content p{margin:0 0 6px}
.note-content a{display:inline-block;margin:4px 14px 0 0;font-size:12px}
.step-actions{display:flex;justify-content:space-between;gap:12px;margin:24px 0 0;padding-top:15px}
.btn{padding:10px 15px;border:1px solid #aebfc6;background:white;color:var(--accent);border-radius:4px;font-size:13px;font-weight:650;line-height:1.4;min-height:42px}
.btn:hover{background:#f5f8f9}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn.primary:hover{background:#103e50}
.btn:disabled{opacity:.35;cursor:default}
.btn.warn{color:#873e36}
.action-set{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 20px}
.action-set .btn{flex:0 0 auto}
.summary{padding:8px 0 15px;margin:8px 0}
.summary h2{font-size:18px;line-height:1.45;margin:0 0 8px}
.summary h3{font-size:15px;margin:20px 0 8px}
.summary p,.summary li{font-size:14px;line-height:1.6}
.summary ul{padding-left:22px;margin:6px 0 16px}
.summary li{margin:6px 0}
.small{font-size:13px;color:var(--dim);line-height:1.62}
.status{font-size:13px;color:var(--dim);margin:8px 0 18px}
.issue{margin:10px 0 20px;padding:12px 0;background:transparent;border-radius:0}
.issue h3{color:var(--alert);font-size:15px;margin:0 0 8px}
.issue ul{margin:0;padding-left:18px}
.issue li{font-size:13px;margin:8px 0}
.unanswered button{border:0;background:transparent;cursor:pointer;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.complete{color:#245b49;font-size:13px}
.response-section{margin-top:28px}
.response-section h3{font-size:16px;margin:0 0 9px}
.response{padding:10px 0;border-top:0}
.response:last-child{border-bottom:0}
.response .q-label{font-size:13px;font-weight:650;display:block}
.response .q-value{font-size:13px;color:#415059;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;display:block}
.report-source{font-size:12px;color:var(--dim);margin-top:26px}
.report-source summary{cursor:pointer;color:var(--accent);font-weight:650}
.report-source ul{padding-left:20px}
.report-source li{margin:6px 0}
.inline-info{font-size:13px;color:var(--dim);padding:11px 0;margin:10px 0 20px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:960px){.wrap{padding:20px 23px 55px}.columns{grid-template-columns:205px minmax(0,1fr);gap:29px}.answers{column-gap:16px}}
@media(max-width:720px){.wrap{padding:12px 20px 45px}.columns{display:block}.sidebar{position:static;padding:0;margin:0 0 23px}.sidebar-title{display:none}.nav-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;background:white;color:var(--accent);border:0;padding:9px 2px;min-height:43px;font-size:14px;font-weight:650}.nav{display:none;padding-bottom:9px}.sidebar.expanded .nav{display:grid}.nav button{padding:9px 8px}.nav .count{display:none}.progress-wrap{padding:7px 0 0}.privacy{display:none}h1{font-size:23px}.question{padding:19px 0 16px}}
@media(max-width:500px){.wrap{padding:10px 15px 34px}.answers{grid-template-columns:1fr}.option{padding:8px 0;min-height:44px}.question legend{font-size:15px}.action-set .btn{flex:1 1 140px}.step-actions .btn{flex:1}}
@media(prefers-reduced-motion:reduce){.bar>span{transition:none}}
@media print{.wrap{padding:0;max-width:none}.columns{display:block}.sidebar,.step-actions,.action-set,.no-print{display:none!important}.content{max-width:none}h1{font-size:20px}.response-section{break-inside:auto}.response{break-inside:avoid}.issue{background:transparent;padding:0}.note:not([open]){display:none}a{color:var(--ink)}}

/* Review: lean form UI, meaningful accent only, no decorative framing. */
.recommendation{max-width:760px;margin:11px 0 16px;padding:12px 0;color:#3d515a;font-size:13px;line-height:1.7}
.recommendation strong{display:block;color:var(--ink);margin-bottom:5px}
.recommendation div+div{margin-top:5px}
.select-count{font-size:12px;color:var(--dim);margin:10px 0 0}
.option-hint{display:inline-block;vertical-align:baseline;font-size:11px;line-height:1.4;color:var(--accent);font-weight:600;margin-left:6px}
.form-progress-title{font-size:12px;font-weight:600;color:var(--dim);margin:12px 10px 5px}
.form-shortcut{border:0;border-radius:4px;background:transparent;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px;padding:10px 12px;min-height:46px;color:var(--dim);font-size:13px;line-height:1.3}
.form-shortcut:hover:not(:disabled){background:#eef3f4;color:var(--ink)}
.form-shortcut.active{background:var(--pale);color:var(--accent);font-weight:700}
.form-shortcut:disabled{opacity:.55;cursor:not-allowed}
.form-shortcut small{font-size:11px;color:var(--hint);font-weight:400}
.form-context{font-size:12px;color:var(--dim);margin:0 0 10px}
.form-report{padding-top:25px;break-before:auto}
.form-report>h2{font-size:20px;line-height:1.35;margin:0 0 8px}
.print-head{display:none}
.print-head h2{font-size:22px;margin:0 0 4px}
.report-next{padding:12px 0 20px}
.report-next p{font-size:14px}
.report-foot{font-size:11px;color:var(--dim);margin-top:30px}
.response-section{margin-top:18px}
.response-section h3{font-size:14px;margin:0 0 6px;color:var(--dim)}
.summary{padding:8px 0 12px}
.unanswered button{min-height:26px}
.btn:disabled{opacity:.5}
@media(max-width:500px){.option{padding:11px 10px;min-height:48px}.recommendation{padding:8px 0}}
@media(prefers-reduced-motion:reduce){.option{transition:none}}
@media print{
 @page{size:A4;margin:16mm 17mm}
 body{font:11pt/1.45 Arial,sans-serif;color:#161c21}
 .wrap{padding:0}
 .sidebar,.step-actions,.action-set,.no-print,.summary,.status,.small,#notice{display:none!important}
 #print-area{display:block!important}
 .print-head{display:block;margin:0 0 17px}
 .print-head p{font-size:10pt;margin:0;color:#343b40}
 h1{display:none}
 .form-report{break-before:page;padding-top:0}
 .response-section,.response{break-inside:avoid}
 .response{padding:5px 0}
 .q-label{font-size:9.5pt!important}
 .q-value{font-size:10pt!important}
 .form-report>h2{font-size:18pt;margin:0 0 12px}
 .report-foot{font-size:9pt}
 }
</style>
</head>
<body>
<div class="wrap"><div class="columns"><aside id="sidebar" class="sidebar" aria-label="Навигация по разделам">
<p class="sidebar-title">Разделы</p>
<button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav">Разделы анкеты <span aria-hidden="true">▾</span></button>
<div id="form-progress" aria-label="Выбранные формы"></div><nav id="nav" class="nav" aria-label="Разделы"></nav>
<div class="progress-wrap"><div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Заполнение обязательных вопросов"><span id="bar"></span></div><p id="progress-label" class="progress-label" aria-live="polite"></p></div>
<p class="privacy">Анкета работает без сервера. Ответы не отправляются в интернет; для продолжения сохраните JSON.</p>
</aside><main id="content" class="content"></main></div></div>
<script>
'use strict';
const CONFIG={"sections":[{"id":"project","title":"Проект и цели","questions":[{"id":"stage","label":"Что необходимо сделать?","type":"radio","required":true,"options":[{"value":"new","label":"Создать новую организацию"},{"value":"amend","label":"Изменить устав действующей организации"},{"value":"transform","label":"Изменить организационно-правовую форму"}]},{"id":"current","label":"Какая форма у организации сейчас?","type":"radio","required":true,"options":[{"value":"ooo","label":"ООО"},{"value":"association","label":"Ассоциация"},{"value":"ano","label":"АНО"},{"value":"fund","label":"Фонд"},{"value":"public","label":"Общественная организация или движение"},{"value":"ip","label":"ИП"},{"value":"other","label":"Другая"}],"help":"При изменении устава нужен действующий текст и сведения ЕГРЮЛ. Преобразование возможно только в предусмотренных законом случаях.","when":{"id":"stage","in":["amend","transform"]}},{"id":"activity","label":"Какие товары, работы, услуги или проекты вы планируете?","type":"textarea","required":true,"placeholder":"Например: платные консультации для компаний; совместное отраслевое представительство; образовательные семинары."},{"id":"goal","label":"Главная цель проекта","type":"radio","required":true,"options":[{"value":"business","label":"Вести бизнес и получать прибыль для собственников"},{"value":"services","label":"Оказывать услуги для достижения некоммерческой цели"},{"value":"members","label":"Представлять и защищать общие интересы членов объединения"},{"value":"charity","label":"Привлекать средства и финансировать общественно полезные программы"},{"value":"civic","label":"Объединить людей вокруг общественной инициативы"},{"value":"mutual","label":"Совместно удовлетворять материальные потребности участников за счёт паёв"},{"value":"mixed","label":"Совмещать коммерческий бизнес и самостоятельные некоммерческие проекты"}],"source":["gk50","nko24"],"explain":"Приносящая доход деятельность допускается и в НКО. Отличие от ООО — в целях организации, отношении к имуществу и запрете распределять прибыль НКО между участниками."},{"id":"customers","label":"Кому будет предназначена деятельность?","type":"multi","required":true,"options":[{"value":"public","label":"Широкому кругу клиентов или получателей услуг"},{"value":"members","label":"Прежде всего участникам объединения"},{"value":"beneficiaries","label":"Получателям помощи или поддержки"},{"value":"companies","label":"Юридическим лицам и предпринимателям"},{"value":"authorities","label":"Органам власти и публичным учреждениям"}]},{"id":"paid","label":"Планируется ли платная деятельность?","type":"radio","required":true,"options":[{"value":"main","label":"Да, основной источник финансирования"},{"value":"additional","label":"Да, дополнительное направление"},{"value":"no","label":"Нет, услуги или товары не продаём"},{"value":"unknown","label":"Пока неизвестно"}],"source":["gk50","nko24"],"explain":"У НКО нет общего ограничения доли выручки от платных услуг. Однако деятельность должна соответствовать некоммерческим целям и быть предусмотрена уставом. Платные услуги могут требовать лицензии по отраслевому закону."},{"id":"mission_paid","label":"Соответствуют ли платные услуги заявленной некоммерческой цели?","type":"radio","required":true,"options":[{"value":"yes","label":"Да, непосредственно служат этой цели"},{"value":"part","label":"Часть услуг связана с целью, часть — самостоятельный бизнес"},{"value":"no","label":"Нет, это отдельное коммерческое направление"},{"value":"unknown","label":"Пока не определили"}],"when":{"all":[{"id":"paid","in":["main","additional"]},{"id":"goal","in":["services","members","charity","civic","mixed"]}]},"source":["gk50","nko24"],"explain":"Для НКО важна не величина выручки, а связь доходной деятельности с уставными целями. Несвязанное направление нельзя легализовать только тем, что прибыль не выплачивается учредителям."},{"id":"profits","label":"Что предполагается делать с прибылью?","type":"radio","required":true,"options":[{"value":"distribute","label":"Распределять между владельцами"},{"value":"keep","label":"Направлять на деятельность и развитие организации"},{"value":"noincome","label":"Прибыль не предполагается"},{"value":"mixed","label":"Часть распределять владельцам, часть направлять на развитие"}],"source":["gk50"],"explain":"В ООО прибыль можно распределять в установленном законом порядке. В НКО распределение прибыли учредителям и членам как дохода от участия запрещено; законная оплата реального труда и услуг — другой вопрос."},{"id":"founders","label":"Сколько будет учредителей или владельцев?","type":"radio","required":true,"options":[{"value":"1","label":"Один"},{"value":"2","label":"Два"},{"value":"3to50","label":"От 3 до 50"},{"value":"over50","label":"Более 50"}],"source":["gk1239","ob18","gk12324"],"explain":"ООО может иметь одного участника, но не более 50. Для обычной ассоциации требуется минимум два учредителя, для общественного объединения — минимум три физических лица; для АНО допускается один."},{"id":"founder_types","label":"Кто будет создавать организацию?","type":"multi","required":true,"options":[{"value":"individuals","label":"Физические лица"},{"value":"companies","label":"Коммерческие юридические лица"},{"value":"npo","label":"Некоммерческие юридические лица"},{"value":"foreign","label":"Есть иностранные граждане или юридические лица"}],"help":"Нужны категории, а не фамилии и паспортные данные."},{"id":"public_three","label":"Есть ли среди учредителей минимум три физических лица?","type":"radio","required":true,"options":[{"value":"yes","label":"Да"},{"value":"no","label":"Нет"}],"when":{"all":[{"any":[{"id":"goal","in":["civic"]},{"form":["public_org","public_mov"]}]},{"id":"founders","in":["3to50","over50"]}]},"source":["ob18"],"explain":"Юридические лица — общественные объединения могут участвовать вместе с физическими лицами, но не заменяют минимальное число физических лиц — учредителей."},{"id":"legal_risks","label":"Есть ли специальные направления деятельности?","type":"multi","required":true,"options":[{"value":"education","label":"Образование или образовательные программы"},{"value":"health","label":"Медицинские услуги"},{"value":"finance","label":"Финансовые услуги, кредитование, страхование"},{"value":"sro","label":"Саморегулируемая организация (СРО)"},{"value":"employers","label":"Объединение работодателей со специальным статусом"},{"value":"sport","label":"Спортивная федерация"},{"value":"religion","label":"Религиозная организация"},{"value":"housing","label":"Товарищество собственников / ЖК / ЖСК"},{"value":"professional","label":"Лицензируемая или регулируемая профессия"},{"value":"international","label":"Иностранное финансирование или зарубежные проекты"},{"value":"none","label":"Ничего из перечисленного","exclusive":true}],"explain":"Выбор ОПФ и состав устава могут зависеть от специального закона. Само указание образовательной или медицинской деятельности в уставе не заменяет лицензии."}]},{"id":"choice","title":"Выбор правовой формы","questions":[{"id":"form_select","label":"Какие организационно-правовые формы необходимо рассмотреть?","type":"multi","required":true,"options":[{"value":"ooo","label":"ООО","note":"Коммерческая компания с уставным капиталом и долями участников."},{"value":"association","label":"Ассоциация (союз)","note":"НКО с членством для общих интересов участников."},{"value":"ano","label":"Автономная некоммерческая организация (АНО)","note":"НКО без членства, создаваемая в том числе для оказания услуг."},{"value":"fund","label":"Общественно полезный фонд","note":"НКО без членства для социально полезных целей и использования имущества."},{"value":"public_org","label":"Общественная организация","note":"Общественное объединение с членством."},{"value":"public_mov","label":"Общественное движение","note":"Общественное объединение без членства, с участниками."},{"value":"coop","label":"Потребительский кооператив","note":"Паевое объединение; требования зависят от разновидности кооператива."},{  `<div id="print-area"><div class="print-head"><h2>Ответы для подготовки уставов</h2><p>Дата: ${esc(new Date().toLocaleDateString('ru-RU'))} · Формы: ${selected.map(formMark).join('; ')}</p></div>`+
 responseHtml(data.shared)+data.forms.map(item=>`<section class="form-report"><h2>${formMark(item.form)}</h2>${responseHtml(item.sections)}<p class="status">${item.assessment.complete?'Все обязательные вопросы заполнены':'Есть незаполненные вопросы или противоречия'}</p></section>`).join('')+
 `<p class="report-foot">Ответы используются для подготовки проекта устава. Перед подачей на регистрацию требуются правовая проверка и регистрационный комплект документов.</p></div>`+
 `<div class="step-actions no-print"><button class="btn" id="back-form">К вопросам</button><button class="btn primary" id="print-bottom">Распечатать</button></div>`;
 $('print').onclick=$('print-bottom').onclick=()=>window.print();$('export-json').onclick=exportJson;
 $('export-txt').onclick=()=>save('Ответы_анкеты_ОПФ_и_устав.txt',exportText(),'text/plain;charset=utf-8');
 $('import-json').onclick=()=>$('upload').click();$('upload').onchange=importFile;
 $('clear').onclick=()=>{if(confirm('Удалить все ответы? Если понадобится продолжить, сначала сохраните JSON.')){for(const k of Object.keys(COMMON))delete COMMON[k];for(const k of Object.keys(FORM_VALUES))delete FORM_VALUES[k];STARTED.clear();ACTIVE_FORM=null;navigate('project')}};
 $('back-form').onclick=()=>navigate(liveSections().at(-1)?.id||'project');
 if($('start-second'))$('start-second').onclick=()=>{STARTED.add(second);ACTIVE_FORM=second;navigate(liveSections().find(s=>s.id==='identity')?.id||'choice')};
 document.querySelectorAll('button[data-jump]').forEach(b=>b.onclick=()=>{
  const form=b.dataset.jumpform;if(form!==choices()[0]&&!STARTED.has(form))return;
  ACTIVE_FORM=form;const sec=liveSections().find(s=>s.visible.some(q=>q.id===b.dataset.jump));if(sec)navigate(sec.id,b.dataset.jump);
 });
}
async function importFile(ev){const file=ev.target.files?.[0];if(!file)return;const notice=$('notice');
 try{if(file.size>1500000)throw Error('Файл слишком большой');const payload=JSON.parse(await file.text());const nextCommon=Object.create(null),nextForms=Object.create(null);
  const clean=(q,v)=>{
   if(!q)return undefined;
   if(q.type==='radio')return typeof v==='string'&&q.options.some(o=>o.value===v)?v:undefined;
   if(q.type==='multi')return Array.isArray(v)?v.filter((x,i)=>typeof x==='string'&&q.options.some(o=>o.value===x)&&v.indexOf(x)===i).slice(0,q.max||100):undefined;
   return typeof v==='string'&&v.length<=12000?v:undefined;
  };
  let sel=[];
  if(payload?.schemaVersion===9){sel=Array.isArray(payload.formOrder)?payload.formOrder.filter((f,i,a)=>LABELS[f]&&a.indexOf(f)===i).slice(0,2):[];
   for(const [id,v]of Object.entries(payload.common||{})){if(COMMON_IDS.has(id)&&id!=='form_select'){const x=clean(BY_ID[id],v);if(x!==undefined)nextCommon[id]=x}}
   for(const f of sel){nextForms[f]=Object.create(null);for(const [id,v]of Object.entries(payload.forms?.[f]?.answers||{})){if(!COMMON_IDS.has(id)&&BY_ID[id]){const x=clean(BY_ID[id],v);if(x!==undefined)nextForms[f][id]=x}}}
  }else if(payload?.schemaVersion===8&&payload.answers&&typeof payload.answers==='object'){
   const v=payload.answers.form;sel=LABELS[v]?[v]:[];
   for(const [id,v]of Object.entries(payload.answers)){if(id==='form')continue;const x=clean(BY_ID[id],v);if(x===undefined)continue;if(COMMON_IDS.has(id))nextCommon[id]=x;else if(sel.length)(nextForms[sel[0]]??=Object.create(null))[id]=x}
  }else throw Error('Неподдерживаемый формат JSON');
  if(!sel.length)throw Error('В файле нет выбранной организационно-правовой формы');
  for(const k of Object.keys(COMMON))delete COMMON[k];for(const k of Object.keys(FORM_VALUES))delete FORM_VALUES[k];
  Object.assign(COMMON,nextCommon);COMMON.form_select=sel;Object.assign(FORM_VALUES,nextForms);STARTED.clear();
  if(sel.length>1&&Object.keys(nextForms[sel[1]]||{}).length)STARTED.add(sel[1]);
  ACTIVE_FORM=sel[0];navigate('report');$('notice').textContent='Ответы загружены.';
 }catch(e){notice.textContent='Не удалось загрузить JSON: '+e.message}finally{ev.target.value=''}
}
$('nav-toggle').addEventListener('click',()=>{const on=$('sidebar').classList.toggle('expanded');$('nav-toggle').setAttribute('aria-expanded',String(on))});
render();

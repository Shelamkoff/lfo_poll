<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Анкета для выбора формы организации и подготовки устава</title>
<style>
:root{--ink:#202c32;--dim:#57646b;--hint:#6d7980;--rule:#e3e8eb;--field:#b6c3ca;--accent:#175269;--pale:#f3f6f7;--alert:#6e4534;--error:#a73a33}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:white;color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:none}
.input:focus-visible{border-color:var(--accent);outline:none;box-shadow:none}
.option:focus-within{background:var(--pale)}
.option input:focus-visible{outline:none}
.btn:focus-visible{border-color:var(--accent);background:#eaf2f4;color:var(--accent)}
.btn.primary:focus-visible{border-color:#092f40;background:#104255;color:white}
.nav button:focus-visible,.form-shortcut:focus-visible,.nav-toggle:focus-visible{background:var(--pale);color:var(--accent)}
.wrap{max-width:1250px;margin:auto;padding:22px 30px 65px}
.columns{display:grid;grid-template-columns:minmax(210px,260px) minmax(0,790px);gap:58px;align-items:start}
.sidebar{position:sticky;top:18px;padding-top:6px;min-width:0}
.sidebar-title{font-size:13px;font-weight:700;margin:0 0 12px}
.nav{display:grid;gap:1px}
.nav button{display:block;border:0;background:transparent;width:100%;text-align:left;color:var(--dim);padding:11px 12px;min-height:46px;border-radius:4px;font-size:13px;line-height:1.4}
.nav button:hover{color:var(--ink);background:var(--pale)}
.nav button.current{background:var(--pale);color:var(--accent);font-weight:700}
.nav button .count{display:block;color:var(--hint);font-size:11px;font-weight:400;margin-top:3px}
.nav-toggle{display:none}
.progress-wrap{padding:19px 10px 0}
.bar{height:4px;background:#e6ecef;border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .15s ease}
.progress-label{margin:8px 0 0;color:var(--dim);font-size:12px}
.privacy{padding:0 10px;color:var(--hint);font-size:12px;line-height:1.55;margin-top:25px}
.content{min-width:0}
h1{font-size:25px;line-height:1.3;letter-spacing:-.02em;margin:0 0 15px;font-weight:720}
.section-desc{font-size:14px;color:var(--dim);margin:0 0 21px;max-width:720px}
.question{min-width:0;border:0;padding:15px 0 21px;margin:0}
.question+.question{border-top:0}
.question legend{font-size:16px;font-weight:680;line-height:1.45;float:left;width:100%;padding:0;margin:0 0 7px}
.question legend:after{content:'';display:block;clear:both}
.req{color:var(--hint);font-weight:500;font-size:12px;margin-left:9px;white-space:nowrap}
.desc{clear:both;color:var(--dim);font-size:13px;margin:0 0 13px;line-height:1.55}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;row-gap:4px;clear:both;margin-top:4px}
.option{display:flex;min-height:48px;align-items:flex-start;gap:11px;padding:12px 12px;border-radius:4px;cursor:pointer;min-width:0;transition:background .14s ease}
.option:hover{background:#eef3f4}
.option input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto;margin:3px 0 0}
.option-title{display:block;font-size:14px;line-height:1.47;overflow-wrap:anywhere}
.option-sub{display:block;color:var(--dim);font-size:12px;line-height:1.48;margin-top:3px}
.option.chosen{background:var(--pale)}.option.chosen .option-title{font-weight:650}.option-disabled{opacity:.48;cursor:not-allowed}
.input{display:block;width:100%;padding:12px 13px;border:1px solid var(--field);border-radius:4px;background:white;font-size:14px;min-height:46px;clear:both}
textarea.input{resize:vertical;min-height:105px}
.input::placeholder{color:#78858d;opacity:1}
.note{clear:both;margin-top:12px}
.note summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);width:max-content;max-width:100%;padding:5px 0}
.note summary:hover{text-decoration:underline;text-underline-offset:3px}
.note-content{font-size:13px;line-height:1.65;color:#3d515a;max-width:700px;padding:5px 0 2px}
.note-content p{margin:0 0 6px}
.note-content a{display:inline-block;margin:4px 14px 0 0;font-size:12px}
.step-actions{display:flex;justify-content:space-between;gap:12px;margin:24px 0 0;padding-top:15px}
.btn{padding:10px 15px;border:1px solid #aebfc6;background:white;color:var(--accent);border-radius:4px;font-size:13px;font-weight:650;line-height:1.4;min-height:42px}
.btn:hover{background:#f5f8f9}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn.primary:hover{background:#103e50}
.btn:disabled{opacity:.35;cursor:default}
.btn.warn{color:#873e36}
.action-set{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 20px}
.action-set .btn{flex:0 0 auto}
.summary{padding:8px 0 15px;margin:8px 0}
.summary h2{font-size:18px;line-height:1.45;margin:0 0 8px}
.summary h3{font-size:15px;margin:20px 0 8px}
.summary p,.summary li{font-size:14px;line-height:1.6}
.summary ul{padding-left:22px;margin:6px 0 16px}
.summary li{margin:6px 0}
.small{font-size:13px;color:var(--dim);line-height:1.62}
.status{font-size:13px;color:var(--dim);margin:8px 0 18px}
.issue{margin:10px 0 20px;padding:12px 0;background:transparent;border-radius:0}
.issue h3{color:var(--alert);font-size:15px;margin:0 0 8px}
.issue ul{margin:0;padding-left:18px}
.issue li{font-size:13px;margin:8px 0}
.unanswered button{border:0;background:transparent;cursor:pointer;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.complete{color:#245b49;font-size:13px}
.response-section{margin-top:28px}
.response-section h3{font-size:16px;margin:0 0 9px}
.response{padding:10px 0;border-top:0}
.response:last-child{border-bottom:0}
.response .q-label{font-size:13px;font-weight:650;display:block}
.response .q-value{font-size:13px;color:#415059;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;display:block}
.report-source{font-size:12px;color:var(--dim);margin-top:26px}
.report-source summary{cursor:pointer;color:var(--accent);font-weight:650}
.report-source ul{padding-left:20px}
.report-source li{margin:6px 0}
.inline-info{font-size:13px;color:var(--dim);padding:11px 0;margin:10px 0 20px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:960px){.wrap{padding:20px 23px 55px}.columns{grid-template-columns:205px minmax(0,1fr);gap:29px}.answers{column-gap:16px}}
@media(max-width:720px){.wrap{padding:12px 20px 45px}.columns{display:block}.sidebar{position:static;padding:0;margin:0 0 23px}.sidebar-title{display:none}.nav-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;background:white;color:var(--accent);border:0;padding:9px 2px;min-height:43px;font-size:14px;font-weight:650}.nav{display:none;padding-bottom:9px}.sidebar.expanded .nav{display:grid}.nav button{padding:9px 8px}.nav .count{display:none}.progress-wrap{padding:7px 0 0}.privacy{display:none}h1{font-size:23px}.question{padding:19px 0 16px}}
@media(max-width:500px){.wrap{padding:10px 15px 34px}.answers{grid-template-columns:1fr}.option{padding:8px 0;min-height:44px}.question legend{font-size:15px}.action-set .btn{flex:1 1 140px}.step-actions .btn{flex:1}}
@media(prefers-reduced-motion:reduce){.bar>span{transition:none}}
@media print{.wrap{padding:0;max-width:none}.columns{display:block}.sidebar,.step-actions,.action-set,.no-print{display:none!important}.content{max-width:none}h1{font-size:20px}.response-section{break-inside:auto}.response{break-inside:avoid}.issue{background:transparent;padding:0}.note:not([open]){display:none}a{color:var(--ink)}}

/* Review: lean form UI, meaningful accent only, no decorative framing. */
.recommendation{max-width:760px;margin:11px 0 16px;padding:12px 0;color:#3d515a;font-size:13px;line-height:1.7}
.recommendation strong{display:block;color:var(--ink);margin-bottom:5px}
.recommendation div+div{margin-top:5px}
.select-count{font-size:12px;color:var(--dim);margin:10px 0 0}
.option-hint{display:inline-block;vertical-align:baseline;font-size:11px;line-height:1.4;color:var(--accent);font-weight:600;margin-left:6px}
.nav button.form-shortcut{display:flex;flex-direction:column;gap:3px;padding:10px 12px}
.form-shortcut{border:0;border-radius:4px;background:transparent;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px;padding:10px 12px;min-height:46px;color:var(--dim);font-size:13px;line-height:1.3}
.form-shortcut:hover:not(:disabled){background:#eef3f4;color:var(--ink)}
.form-shortcut.active{background:var(--pale);color:var(--accent);font-weight:700}
.form-shortcut:disabled{opacity:.55;cursor:not-allowed}
.form-shortcut small{font-size:11px;color:var(--hint);font-weight:400}
.form-context{font-size:12px;color:var(--dim);margin:0 0 10px}
.form-report{padding-top:25px;break-before:auto}
.form-report>h2{font-size:20px;line-height:1.35;margin:0 0 8px}
.print-head{display:none}
.print-head h2{font-size:22px;margin:0 0 4px}
.report-next{padding:12px 0 20px}
.report-next p{font-size:14px}
.report-foot{font-size:11px;color:var(--dim);margin-top:30px}
.response-section{margin-top:18px}
.response-section h3{font-size:14px;margin:0 0 6px;color:var(--dim)}
.summary{padding:8px 0 12px}
.unanswered button{min-height:26px}
.btn:disabled{opacity:.5}
@media(max-width:500px){.option{padding:11px 10px;min-height:48px}.recommendation{padding:8px 0}}
@media(prefers-reduced-motion:reduce){.option{transition:none}}
@media print{
 @page{size:A4;margin:16mm 17mm}
 body{font:11pt/1.45 Arial,sans-serif;color:#161c21}
 .wrap{padding:0}
 .sidebar,.step-actions,.action-set,.no-print,.summary,.status,.small,#notice{display:none!important}
 #print-area{display:block!important}
 .print-head{display:block;margin:0 0 17px}
 .print-head p{font-size:10pt;margin:0;color:#343b40}
 h1{display:none}
 .form-report{break-before:page;padding-top:0}
 .response-section,.response{break-inside:avoid}
 .response{padding:5px 0}
 .q-label{font-size:9.5pt!important}
 .q-value{font-size:10pt!important}
 .form-report>h2{font-size:18pt;margin:0 0 12px}
 .report-foot{font-size:9pt}
 }

.nav-form-label{font-size:12px;color:var(--dim);font-weight:700;padding:16px 12px 6px;line-height:1.4}
.nav .nav-sub{padding-left:20px}
.forms-list .option{align-items:center}
.forms-list .option.option-disabled{opacity:1;color:#657077;cursor:not-allowed}
.forms-list .option.option-disabled .option-sub{color:#785e52;font-size:12px}
.forms-list .option.recommended{background:#ebf3f4}
.recommend-label{font-size:11px;color:var(--accent);font-weight:750;margin-left:8px;white-space:nowrap}
.notice-line{font-size:13px;color:#785243;margin:12px 0}
.question.invalid .question legend{color:#913e36}
.field-error,.validation-summary{font-size:13px;color:#9a3d36;margin:9px 0}
.question.invalid .input{border-color:#a7443b}
@media(max-width:720px){.nav .nav-sub{padding-left:14px}}
@media print{.field-error,.validation-summary{display:none!important}}

a:focus-visible,.note summary:focus-visible{text-decoration-thickness:3px;color:#0e3b4c;background:var(--pale)}
</style>
</head>
<body>
<div class="wrap"><div class="columns"><aside id="sidebar" class="sidebar" aria-label="Навигация по разделам">
<p class="sidebar-title">Разделы</p>
<button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav">Разделы анкеты <span aria-hidden="true">▾</span></button>
<nav id="nav" class="nav" aria-label="Разделы анкеты и выбранные формы"></nav>
<div class="progress-wrap"><div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Заполнение обязательных вопросов"><span id="bar"></span></div><p id="progress-label" class="progress-label" aria-live="polite"></p></div>
<p class="privacy">Анкета работает без сервера. Ответы не отправляются в интернет и хранятся только во вкладке до её закрытия или обновления. Итоги можно распечатать или скачать в Markdown.</p>
</aside><main id="content" class="content"></main></div></div>
<script>
'use strict';
const CONFIG={"sections":[{"id":"project","title":"Проект и цели","questions":[{"id":"stage","label":"Какую задачу вы хотите решить?","type":"radio","required":true,"options":[{"value":"new","label":"Создать новую организацию"},{"value":"amend","label":"Изменить устав действующей организации"},{"value":"transform","label":"Изменить организационно-правовую форму"}]},{"id":"current","label":"Какая организационно-правовая форма у действующей организации?","type":"radio","required":true,"options":[{"value":"ooo","label":"ООО"},{"value":"association","label":"Ассоциация (союз)"},{"value":"ano","label":"АНО"},{"value":"fund","label":"Фонд"},{"value":"public_org","label":"Общественная организация"},{"value":"public_mov","label":"Общественное движение"},{"value":"coop","label":"Потребительский кооператив"},{"value":"ip","label":"ИП"},{"value":"other","label":"Другая форма"}],"help":"Если действующая форма отсутствует в списке, выберите «Другая форма». Для преобразования из неизвестной формы требуется предварительное заключение о допустимости реорганизации.","when":{"id":"stage","in":["amend","transform"]},"explain":"Для изменения действующего устава необходимо сохранить организационно-правовую форму. Преобразование в другую форму допустимо только в случаях, прямо предусмотренных законом; создание новой организации не является преобразованием.","source":["oo56","gk1238","gk12324","gk1234"]},{"id":"current_coop_type","label":"Какой вид потребительского кооператива зарегистрирован сейчас?","type":"radio","required":true,"when":{"all":[{"id":"stage","in":["transform"]},{"id":"current","in":["coop"]}]},"options":[{"value":"ordinary","label":"Обычный потребительский кооператив (не жилищный, гаражный, кредитный или страховой)"},{"value":"housing","label":"Жилищный, жилищно-строительный или гаражный"},{"value":"insurance","label":"Общество взаимного страхования"},{"value":"regulated","label":"Иной специально регулируемый кооператив"}],"explain":"Пункт 3 ст. 123.2 ГК РФ устанавливает разные допустимые направления преобразования. Жилищный, жилищно-строительный и гаражный кооперативы преобразуются только в ТСН, а общество взаимного страхования — в хозяйственное общество — страховую организацию. Для других специальных кооперативов необходима отдельная проверка.","source":["gk1232"]},{"id":"activity","label":"Какие товары, работы, услуги или проекты вы планируете?","type":"textarea","required":true,"placeholder":"Например: платные консультации для компаний; совместное отраслевое представительство; образовательные семинары."},{"id":"goal","label":"Какова основная цель вашего проекта?","type":"radio","required":true,"options":[{"value":"business","label":"Вести бизнес и получать прибыль для собственников"},{"value":"services","label":"Оказывать услуги для достижения некоммерческой цели"},{"value":"members","label":"Представлять и защищать общие интересы членов объединения"},{"value":"charity","label":"Привлекать средства и финансировать общественно полезные программы"},{"value":"civic","label":"Объединить людей вокруг общественной инициативы"},{"value":"mutual","label":"Удовлетворять материальные или иные потребности участников через паевые взносы"},{"value":"mixed","label":"Совмещать коммерческий бизнес и самостоятельные некоммерческие проекты"}],"source":["gk50","nko24"],"explain":"Приносящая доход деятельность допускается и в НКО. Отличие от ООО — в целях организации, отношении к имуществу и запрете распределять прибыль НКО между участниками."},{"id":"customers","label":"Кто будет получать товары, услуги или поддержку в рамках проекта?","type":"multi","required":true,"options":[{"value":"public","label":"Покупателям, клиентам или другим получателям услуг"},{"value":"members","label":"Членам или участникам будущего объединения"},{"value":"beneficiaries","label":"Получателям благотворительной или иной поддержки"},{"value":"companies","label":"Организациям и индивидуальным предпринимателям"},{"value":"authorities","label":"Государственным и муниципальным органам или учреждениям"}],"help":"Отметьте все категории лиц, которым будут предназначены товары, услуги или поддержка. Речь о получателях, а не об учредителях или владельцах."},{"id":"paid","label":"Будет ли проект продавать товары, выполнять работы или оказывать платные услуги?","type":"radio","required":true,"options":[{"value":"main","label":"Да, выручка будет основным источником средств"},{"value":"additional","label":"Да, выручка будет дополнительным источником средств"},{"value":"no","label":"Нет, продажа товаров, работ и услуг не планируется"},{"value":"unknown","label":"Пока неизвестно"}],"source":["gk50","nko24"],"explain":"В НКО платные услуги разрешены, если служат её уставным целям, соответствуют им и предусмотрены уставом. Сам по себе объём выручки не делает организацию коммерческой. Для отдельных услуг требуется лицензия."},{"id":"mission_paid","label":"Связана ли предполагаемая платная деятельность с целями некоммерческой организации?","type":"radio","required":true,"options":[{"value":"yes","label":"Да, непосредственно служат этой цели"},{"value":"part","label":"Часть услуг связана с целью, часть — самостоятельный бизнес"},{"value":"no","label":"Нет, это отдельное коммерческое направление"},{"value":"unknown","label":"Пока не определили"}],"when":{"all":[{"id":"paid","in":["main","additional"]},{"id":"goal","in":["services","members","charity","civic","mixed"]}]},"source":["gk50","nko24"],"explain":"Для НКО важна не величина выручки, а связь доходной деятельности с уставными целями. Несвязанное направление нельзя легализовать только тем, что прибыль не выплачивается учредителям.","help":"Речь о платной деятельности самой НКО. Если у проекта несколько самостоятельных организаций, распределение операций между ними уточняется в отдельных разделах."},{"id":"profits","label":"Как предполагается использовать прибыль от деятельности?","type":"radio","required":true,"options":[{"value":"distribute","label":"Распределять между владельцами"},{"value":"keep","label":"Направлять на деятельность и развитие организации"},{"value":"noincome","label":"Прибыль не предполагается"},{"value":"mixed","label":"Часть распределять владельцам, часть направлять на развитие"}],"source":["gk50","gk1232","co24"],"explain":"В ООО прибыль может распределяться между участниками. Обычные НКО не распределяют прибыль как доход от участия. Кооперативные выплаты допустимы только в установленных специальным законом случаях: например, ст. 24 закона № 3085-1 касается потребительских обществ, а не всех видов потребительских кооперативов.","help":"НКО может получать доход от платных услуг и направлять его на уставные цели, но не распределять прибыль между учредителями и членами. Если предполагаются и ООО, и НКО, выберите смешанную модель проекта."},{"id":"founders","label":"Сколько учредителей или участников предполагается на начальном этапе?","type":"radio","required":true,"options":[{"value":"1","label":"Один"},{"value":"2","label":"Два"},{"value":"3to50","label":"От 3 до 50"},{"value":"over50","label":"Более 50"}],"source":["gk1239","ob18","gk12324"],"explain":"Для ООО возможен один участник, максимум 50. Для обычной ассоциации нужны не менее двух учредителей; для АНО возможен один. Для общественного объединения необходимы по меньшей мере три учредителя — физических лица. Отдельные виды организаций подчиняются специальным правилам.","help":"Для общего подбора ОПФ укажите предварительное количество учредителей/участников. Если вы сравниваете несколько организаций с разным составом, точное количество отдельно уточняется в разделе каждой формы."},{"id":"founder_types","label":"Какие лица планируют участвовать в создании организации?","type":"multi","required":true,"options":[{"value":"individuals","label":"Физические лица"},{"value":"companies","label":"Коммерческие юридические лица"},{"value":"npo","label":"Некоммерческие юридические лица"},{"value":"foreign","label":"В числе указанных лиц есть иностранные граждане или юридические лица"}],"help":"Выберите фактические категории учредителей. Если среди граждан или юридических лиц есть иностранные лица, отметьте соответствующую основную категорию и дополнительно вариант об иностранных участниках. Для общественных объединений закон предусматривает специальные ограничения."},{"id":"public_three","label":"Есть ли среди предполагаемых учредителей не менее трёх физических лиц?","type":"radio","required":true,"options":[{"value":"yes","label":"Да"},{"value":"no","label":"Нет"}],"when":{"all":[{"id":"founders","in":["3to50","over50"]},{"id":"founder_types","has":["individuals"]}]},"source":["ob18","ob19"],"explain":"По ст. 18 закона № 82-ФЗ нужно не менее трёх учредителей — физических лиц. По общему правилу учредителями являются совершеннолетние граждане; предусмотрены особенности для детских и молодёжных объединений (ст. 19). Дополнительными учредителями-юрлицами могут быть только общественные объединения. Иностранные граждане и лица без гражданства, законно находящиеся в России, при соблюдении законных ограничений могут быть учредителями общественного объединения (ст. 19 закона № 82-ФЗ).","help":"Проверьте наличие как минимум трёх физических лиц среди будущих учредителей общественного объединения. Возраст и иные ограничения определены статьёй 19 закона № 82-ФЗ."},{"id":"public_legal","label":"Все учредители — юридические лица являются общественными объединениями?","type":"radio","required":false,"when":{"all":[{"id":"founders","in":["3to50","over50"]},{"id":"founder_types","has":["npo"]}]},"options":[{"value":"yes","label":"Да, среди юридических лиц только общественные объединения"},{"value":"no","label":"Нет, есть НКО, не являющиеся общественными объединениями"},{"value":"unknown","label":"Нужно проверить организационно-правовую форму юридических лиц"}],"explain":"По статьям 18–19 закона № 82-ФЗ учредителями общественного объединения могут быть физические лица и юридические лица — общественные объединения. Не всякая НКО отвечает этому требованию: например, обычные АНО и фонды не являются общественными объединениями.","source":["ob18","ob19"],"help":"Уточнение требуется только для общественной организации и общественного движения. Закон не разрешает включать в их учредители любые НКО или коммерческие компании."},{"id":"legal_risks","label":"Планируются ли виды деятельности со специальными правовыми требованиями?","type":"multi","required":true,"options":[{"value":"education","label":"Образование или образовательные программы"},{"value":"health","label":"Медицинские услуги"},{"value":"finance","label":"Финансовые услуги, кредитование, страхование"},{"value":"sro","label":"Саморегулируемая организация (СРО)"},{"value":"employers","label":"Объединение работодателей со специальным статусом"},{"value":"sport","label":"Спортивная федерация"},{"value":"religion","label":"Религиозная организация"},{"value":"housing","label":"Товарищество собственников / ЖК / ЖСК"},{"value":"professional","label":"Лицензируемая или регулируемая профессия"},{"value":"international","label":"Иностранное финансирование или зарубежные проекты"},{"value":"none","label":"Ничего из перечисленного","exclusive":true}],"explain":"Выбор ОПФ и состав устава могут зависеть от специального закона. Само указание образовательной или медицинской деятельности в уставе не заменяет лицензии.","help":"Отметьте специальные режимы, если проект предполагает соответствующую деятельность или статус. Само включение вида деятельности в устав не заменяет лицензию, допуск или специальную регистрацию."}]},{"id":"choice","title":"Выбор правовой формы","questions":[{"id":"form_select","label":"Какие организационно-правовые формы вы хотите рассмотреть?","type":"multi","required":true,"options":[{"value":"ooo","label":"ООО","note":"Коммерческая компания с уставным капиталом и долями участников."},{"value":"association","label":"Ассоциация (союз)","note":"НКО с членством для общих интересов участников."},{"value":"ano","label":"Автономная некоммерческая организация (АНО)","note":"НКО без членства, создаваемая в том числе для оказания услуг."},{"value":"fund","label":"Общественно полезный фонд","note":"НКО без членства для социально полезных целей и использования имущества."},{"value":"public_org","label":"Общественная организация","note":"Общественное объединение с членством."},{"value":"public_mov","label":"Общественное движение","note":"Общественное объединение без членства, с участниками."},{"value":"coop","label":"Потребительский кооператив","note":"Паевое объединение; требования зависят от разновидности кооператива."},{"value":"ip","label":"ИП","note":"Предприниматель без образования юридического лица, устава нет."}],"source":["gk1239","ob18"],"explain":"Минимальное число учредителей зависит от правовой формы. Ассоциации требуется не менее двух, общественному объединению — не менее трёх физических лиц; ООО может иметь одного учредителя, но не более пятидесяти участников. НКО не распределяет прибыль между учредителями и членами. При специальном статусе отдельные требования проверяются дополнительно.","max":null,"help":"Можно выбрать несколько подходящих форм. Ответы об уставе каждой формы сохраняются отдельно. Недопустимые варианты недоступны и сопровождаются причиной."}],"desc":"Этот выбор определяет следующие разделы. Если форму ещё не выбрали, результат покажет ориентиры и нерешённые вопросы."},{"id":"charter_team","title":"Учредители этой организации","desc":"При подготовке двух уставов у организаций могут быть разные учредители. Уточните состав отдельно для каждой формы — без имён и персональных данных.","when":{"twoForms":true},"questions":[{"id":"charter_founders","label":"Сколько учредителей или участников будет именно у этой организации?","type":"radio","required":true,"options":[{"value":"1","label":"Один"},{"value":"2","label":"Два"},{"value":"3to50","label":"От 3 до 50"},{"value":"over50","label":"Более 50"}],"source":["gk1239","gk12324","ob18","oo7"],"explain":"Для каждой выбранной организации проверьте собственный состав учредителей. Число учредителей одной организации не обязательно равно числу учредителей другой. Для ООО действует ограничение числа участников, для ассоциации — минимум два учредителя, для общественного объединения — не менее трёх физических лиц.","help":"Укажите число участников или учредителей именно выбранной организации. Оно может отличаться от числа лиц в общем разделе, но ограничения конкретной ОПФ должны соблюдаться."},{"id":"charter_founder_types","label":"Кто будет учредителями именно этой организации?","type":"multi","required":true,"options":[{"value":"individuals","label":"Граждане"},{"value":"companies","label":"Коммерческие юридические лица"},{"value":"npo","label":"Некоммерческие юридические лица"},{"value":"foreign","label":"Иностранные граждане или юридические лица"}],"explain":"Укажите категории; персональные сведения для регистрации будут собираться отдельно. Допустимый состав учредителей проверяется по законодательству о выбранной форме."},{"id":"charter_public_three","label":"Есть ли среди учредителей этой организации не менее трёх физических лиц?","type":"radio","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"founders_form","in":["3to50","over50"]}]},"options":[{"value":"yes","label":"Да"},{"value":"no","label":"Нет"}],"source":["ob18","ob19"],"explain":"По ст. 18 закона № 82-ФЗ нужно не менее трёх учредителей — физических лиц. По общему правилу учредителями являются совершеннолетние граждане; предусмотрены особенности для детских и молодёжных объединений (ст. 19). Дополнительными учредителями-юрлицами могут быть только общественные объединения. Иностранные граждане и лица без гражданства, законно находящиеся в России, при соблюдении законных ограничений могут быть учредителями общественного объединения (ст. 19 закона № 82-ФЗ)."},{"id":"charter_public_legal","label":"Все юридические лица — учредители этой организации являются общественными объединениями?","type":"radio","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"twoForms":true},{"id":"charter_founder_types","has":["npo"]}]},"options":[{"value":"yes","label":"Да, среди юридических лиц только общественные объединения"},{"value":"no","label":"Нет, есть НКО, не являющиеся общественными объединениями"},{"value":"unknown","label":"Нужно проверить организационно-правовую форму юридических лиц"}],"explain":"По статьям 18–19 закона № 82-ФЗ учредителями общественного объединения могут быть физические лица и юридические лица — общественные объединения. Не всякая НКО отвечает этому требованию: например, обычные АНО и фонды не являются общественными объединениями.","source":["ob18","ob19"],"help":"Если среди учредителей этой организации есть юрлица, подтвердите, что каждое из них — общественное объединение. Иначе общественную организацию или движение с таким составом создать нельзя."}]},{"id":"identity","title":"Наименование и деятельность","questions":[{"id":"full_name","label":"Предлагаемое полное наименование","type":"input","required":true,"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Полное наименование организации","source":["oo4","nko14","gk12324","gk12317","gk1232","ob28"],"explain":"Наименование юридического лица должно содержать организационно-правовую форму и отвечать специальным требованиям закона. В частности, в полном названии ООО используются слова «общество с ограниченной ответственностью», АНО — «автономная некоммерческая организация», фонда — «фонд». Устав фиксирует именно полное наименование. Для общественного объединения дополнительно укажите территориальную сферу и характер его деятельности в официальном наименовании (ст. 28 закона № 82-ФЗ).","help":"Введите полное официальное наименование с обязательным указанием ОПФ. Для общественных объединений необходимы указания на территориальный уровень и характер деятельности; для кооператива — на его основную цель."},{"id":"short_name_llc","label":"Сокращённое фирменное наименование ООО (при необходимости)","type":"input","required":false,"when":{"form":["ooo"]},"placeholder":"Например: ООО «Вектор»","source":["oo4","oo12"],"explain":"Статья 4 закона № 14-ФЗ допускает отсутствие сокращённого наименования. Если сокращённое наименование выбрано, оно отражается в уставе и регистрационных сведениях; ст. 12 закона № 14-ФЗ содержит требования к сведениям устава.","help":"Можно оставить пустым: для ООО сокращённое наименование не обязательно."},{"id":"short_name_npo","label":"Нужно ли сокращённое наименование этой организации?","type":"radio","required":false,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да"}],"when":{"form":["association","ano","fund","public_org","public_mov","coop"]}},{"id":"short_name_npo_txt","label":"Какое сокращённое наименование использовать?","type":"input","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"id":"short_name_npo","in":["yes"]}]},"placeholder":"Например: АНО «Центр образования»"},{"id":"location","label":"В каком населённом пункте или муниципальном образовании будет находиться организация?","type":"input","required":true,"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: город Калининград","source":["oo12","nko14"],"explain":"В уставе обычно указывается населённый пункт (муниципальное образование) как место нахождения. Для ЕГРЮЛ отдельно потребуется полный адрес в пределах места нахождения. Не нужно вносить персональный адрес физического лица в анкету."},{"id":"name_special","label":"Нужны ли в наименовании специальные слова, указания на статус или географию?","type":"textarea","required":false,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: региональная общественная организация; профессиональное отраслевое объединение.","explain":"Использование слов «Россия», «Российская Федерация», наименований органов власти, а также некоторых отраслевых обозначений может иметь специальный правовой режим."},{"id":"duration","label":"На какой срок создаётся организация?","type":"radio","required":false,"options":[{"value":"indef","label":"Без ограничения срока"},{"value":"fixed","label":"На определённый срок"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"duration_text","label":"Какой срок деятельности установить?","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"duration","in":["fixed"]}]},"placeholder":"Например: до 31.12.2030"},{"id":"npo_goals","label":"Для достижения каких некоммерческих целей создаётся организация?","type":"textarea","required":true,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: развитие и защита профессиональных интересов членов отрасли; предоставление доступного дополнительного образования.","source":["nko14","gk1239","gk12324"],"explain":"Для НКО цель должна быть некоммерческой и определимой. Общей фразы «иная не запрещённая деятельность» недостаточно для описания предмета и целей.","help":"Опишите самостоятельную некоммерческую цель именно этой организации. Для кооператива дополнительно уточните, какие материальные потребности участников он удовлетворяет."},{"id":"npo_activities","label":"Какими видами деятельности организация будет достигать своих целей?","type":"textarea","required":true,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: семинары; консультации; отраслевые исследования; образовательные программы; издание материалов.","source":["nko24"],"explain":"Отделяйте цели от способов их достижения. Если предполагаются платные услуги, они должны соответствовать целям, а для отдельных видов деятельности может потребоваться лицензия."},{"id":"npo_income","label":"За счёт каких источников будет финансироваться именно эта организация?","type":"multi","required":true,"options":[{"value":"fees","label":"Членские взносы","note":"Только для ассоциации и общественной организации, имеющих членов."},{"value":"donations","label":"Пожертвования"},{"value":"grants","label":"Гранты или субсидии"},{"value":"service","label":"Платные услуги, работы, продажа результатов деятельности"},{"value":"founders","label":"Имущественные взносы учредителей"},{"value":"property","label":"Доходы от имущества и разрешённой деятельности"},{"value":"other","label":"Иные законные источники"}],"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"explain":"В НКО могут поступать пожертвования, имущественные взносы, гранты, выручка от разрешённых услуг и другие законные средства (ст. 26 закона № 7-ФЗ). Членские взносы относятся к организациям с членством — например, ассоциации и общественной организации. У АНО, фонда и общественного движения нет членов; для них выбирайте имущественные взносы учредителей или добровольные поступления, но не членские взносы. Для потребительского кооператива обязательные паевые взносы регулируются отдельно; членские и паевые взносы — не одно и то же.","source":["nko26","gk12311","gk12324","gk1232"],"help":"Отмечайте источники финансирования именно выбранной организации. Если создаются ООО и НКО одновременно, деньги от продаж ООО сами по себе не являются доходом НКО."},{"id":"npo_asset_min","label":"Есть ли необходимое имущество для ведения приносящей доход деятельности?","type":"radio","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"id":"npo_income","has":["service","property"]}]},"options":[{"value":"provided","label":"Да, имеется имущество рыночной стоимостью не менее 10 000 ₽"},{"value":"will_provide","label":"Имущество будет обеспечено до ведения такой деятельности"},{"value":"no","label":"Нет, пока не планируется"},{"value":"unknown","label":"Не оценивали имущество и его стоимость"}],"explain":"По п. 5 ст. 50 ГК РФ НКО, устав которой предусматривает приносящую доход деятельность (кроме указанных в законе исключений), должна иметь достаточное имущество рыночной стоимостью не менее минимального уставного капитала ООО — обычно 10 000 ₽. Это не уставный капитал НКО и не обязательно денежный вклад. Если источник финансирования — только пожертвования и гранты, само по себе это не означает доходную деятельность. В специальных сферах возможны дополнительные требования.","source":["gk50","oo14"],"help":"Если устав предусматривает приносящую доход деятельность, НКО должна иметь необходимое имущество рыночной стоимостью не менее предусмотренного законом минимума. Это не уставный капитал НКО."},{"id":"paid_services","label":"Какие платные товары, работы или услуги будет предоставлять именно эта организация?","type":"textarea","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"id":"npo_income","has":["service"]}]},"placeholder":"Перечислите конкретные виды платной деятельности, связанные с уставными целями.","source":["nko24","gk12311"],"explain":"Платные услуги допустимы, если способствуют достижению некоммерческих уставных целей и прямо предусмотрены уставом. Для ассоциации дополнительно учитывайте ст. 123.11 ГК РФ: её члены по общему правилу вправе на равных началах безвозмездно пользоваться услугами ассоциации, если законом не предусмотрено иное. Поэтому плату за такие услуги членам нужно юридически оценивать отдельно.","help":"Укажите платные товары или услуги именно этой НКО. Если коммерческое направление ведёт отдельное ООО, не включайте его сюда и не выбирайте «Платные услуги» в источниках дохода НКО."}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"governance","title":"Руководитель и управление","questions":[{"id":"head_title","label":"Как будет называться должность единоличного исполнительного органа?","type":"radio","required":true,"options":[{"value":"director","label":"Директор"},{"value":"general","label":"Генеральный директор"},{"value":"chair","label":"Председатель"},{"value":"president","label":"Президент"},{"value":"other","label":"Другое"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Название должности определяет наименование единоличного исполнительного органа в уставе и ЕГРЮЛ. Порядок назначения зависит от формы: в АНО руководителя назначают учредители, в фонде — высший коллегиальный орган, если специальным законом не предусмотрено иное. Название не меняет законную компетенцию.","source":["gk12325","gk12319","oo40"]},{"id":"head_other","label":"Какое название должности выбрать?","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"head_title","in":["other"]}]},"placeholder":"Например: Исполнительный директор"},{"id":"head_term","label":"На какой срок назначать руководителя?","type":"radio","required":true,"options":[{"value":"1","label":"1 год"},{"value":"3","label":"3 года"},{"value":"5","label":"5 лет"},{"value":"other","label":"Другой определённый срок"}],"help":"Срок используется для подготовки устава; для разных форм возможны отдельные требования закона.","when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"head_term_other","label":"Укажите срок полномочий","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"head_term","in":["other"]}]},"placeholder":"Например: 2 года"},{"id":"head_absence","label":"Кто и на каком основании сможет временно исполнять обязанности руководителя?","type":"radio","required":false,"options":[{"value":"deputy","label":"Заместитель, если назначен"},{"value":"person","label":"Лицо, назначенное компетентным органом"},{"value":"byorder","label":"Лицо по доверенности или распоряжению в пределах закона"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Замещение нужно разграничивать с полномочиями единоличного исполнительного органа, сведения о котором содержатся в ЕГРЮЛ. Доверенность не заменяет назначения нового руководителя."},{"id":"board","label":"Нужен ли дополнительный совет или правление и какие полномочия он получит?","type":"radio","required":false,"options":[{"value":"no","label":"Нет, кроме обязательных органов по закону"},{"value":"advisory","label":"Совещательный совет без управленческих полномочий"},{"value":"board","label":"Коллегиальный орган с установленной компетенцией"}],"when":{"form":["association","ano","coop"]},"source":["gk653","gk12325","gk12310"],"explain":"Обязательные по закону органы сохраняются независимо от ответа. Дополнительный орган нужен, только если за ним планируется конкретная компетенция. Для АНО учредители осуществляют управление по уставу."},{"id":"board_size","label":"Укажите состав и срок полномочий дополнительного совета или правления","type":"textarea","required":true,"when":{"all":[{"form":["association","ano","coop"]},{"id":"board","in":["board"]}]},"placeholder":"Например: 5 членов, срок 3 года, избирает общее собрание."},{"id":"board_tasks","label":"Какие вопросы передать дополнительному совету или правлению?","type":"multi","required":true,"options":[{"value":"strategy","label":"Подготавливать стратегию и бюджет"},{"value":"members","label":"Принимать новых членов, если это допускается законом"},{"value":"projects","label":"Утверждать проекты и программы"},{"value":"transactions","label":"Согласовывать определённые сделки"},{"value":"director","label":"Участвовать в вопросах назначения руководителя в допустимых законом пределах"},{"value":"other","label":"Иные вопросы — уточнить"}],"when":{"all":[{"form":["association","ano","coop"]},{"id":"board","in":["board"]}]},"source":["gk653","gk12310","nko29"],"explain":"Передавать органу можно только допустимые законом полномочия: у высшего органа есть исключительная компетенция."},{"id":"meetings","label":"Как будут проходить заседания органов управления?","type":"radio","required":true,"options":[{"value":"inperson","label":"Очно"},{"value":"hybrid","label":"Очно и с дистанционным участием"},{"value":"remote","label":"С возможностью полностью дистанционного заседания"}],"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"any":[{"notForm":["ooo"]},{"id":"founders_form","in":["2","3to50","over50"]}]}]},"source":["oo371","nko29"],"explain":"Дистанционное участие в заседании и заочное голосование различаются. Для ООО действуют требования ст. 37.1 закона № 14-ФЗ (включая идентификацию, передачу изображения и звука и хранение записи); для НКО отдельные ключевые решения нельзя принимать заочно. Способ заседания должен допускать соблюдение соответствующего закона."},{"id":"notices","label":"Как участники заседаний будут получать уведомления?","type":"multi","required":true,"options":[{"value":"email","label":"Электронная почта по адресу, указанному участником"},{"value":"letter","label":"Бумажные письма"},{"value":"cabinet","label":"Защищённый личный кабинет / система электронного взаимодействия"},{"value":"other","label":"Другой подтверждаемый способ"}],"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"any":[{"notForm":["ooo"]},{"id":"founders_form","in":["2","3to50","over50"]}]}]},"explain":"Способ должен позволять доказать направление уведомления и соблюдение срока. Законные минимальные сроки и компетенция органов применяются независимо от выбора."},{"id":"notices_other","label":"Какой иной способ подтверждаемого уведомления вы предлагаете?","type":"textarea","required":true,"when":{"all":[{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"notices","has":["other"]}]},{"any":[{"notForm":["ooo"]},{"id":"founders_form","in":["2","3to50","over50"]}]}]},"placeholder":"Укажите канал доставки уведомлений и как подтверждается получение."},{"id":"meeting_notice","label":"

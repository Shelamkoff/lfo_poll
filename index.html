<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Анкета для выбора формы организации и подготовки устава</title>
<style>
:root{--ink:#202c32;--dim:#57646b;--hint:#6d7980;--rule:#e3e8eb;--field:#b6c3ca;--accent:#175269;--pale:#f3f6f7;--alert:#6e4534;--error:#a73a33}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:white;color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:none}
.input:focus-visible{border-color:var(--accent);outline:none;box-shadow:none}
.option:focus-within{background:var(--pale)}
.option input:focus-visible{outline:none}
.btn:focus-visible{border-color:var(--accent);background:#eaf2f4;color:var(--accent)}
.btn.primary:focus-visible{border-color:#092f40;background:#104255;color:white}
.nav button:focus-visible,.form-shortcut:focus-visible,.nav-toggle:focus-visible{background:var(--pale);color:var(--accent)}
.wrap{max-width:1250px;margin:auto;padding:22px 30px 65px}
.columns{display:grid;grid-template-columns:minmax(210px,260px) minmax(0,790px);gap:58px;align-items:start}
.sidebar{position:sticky;top:18px;padding-top:6px;min-width:0}
.sidebar-title{font-size:13px;font-weight:700;margin:0 0 12px}
.nav{display:grid;gap:1px}
.nav button{display:block;border:0;background:transparent;width:100%;text-align:left;color:var(--dim);padding:11px 12px;min-height:46px;border-radius:4px;font-size:13px;line-height:1.4}
.nav button:hover{color:var(--ink);background:var(--pale)}
.nav button.current{background:var(--pale);color:var(--accent);font-weight:700}
.nav button .count{display:block;color:var(--hint);font-size:11px;font-weight:400;margin-top:3px}
.nav-toggle{display:none}
.progress-wrap{padding:19px 10px 0}
.bar{height:4px;background:#e6ecef;border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .15s ease}
.progress-label{margin:8px 0 0;color:var(--dim);font-size:12px}
.privacy{padding:0 10px;color:var(--hint);font-size:12px;line-height:1.55;margin-top:25px}
.content{min-width:0}
h1{font-size:25px;line-height:1.3;letter-spacing:-.02em;margin:0 0 15px;font-weight:720}
.section-desc{font-size:14px;color:var(--dim);margin:0 0 21px;max-width:720px}
.question{min-width:0;border:0;padding:20px 0 25px;margin:0}
.question+.question{border-top:0}
.question legend{font-size:16px;font-weight:680;line-height:1.45;float:left;width:100%;padding:0;margin:0 0 7px}
.question legend:after{content:'';display:block;clear:both}
.req{color:var(--hint);font-weight:500;font-size:12px;margin-left:9px;white-space:nowrap}
.desc{clear:both;color:var(--dim);font-size:13px;margin:0 0 13px;line-height:1.55}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px;row-gap:4px;clear:both;margin-top:4px}
.option{display:flex;min-height:48px;align-items:flex-start;gap:11px;padding:12px 12px;border-radius:4px;cursor:pointer;min-width:0;transition:background .14s ease}
.option:hover{background:#eef3f4}
.option input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto;margin:3px 0 0}
.option-title{display:block;font-size:14px;line-height:1.47;overflow-wrap:anywhere}
.option-sub{display:block;color:var(--dim);font-size:12px;line-height:1.48;margin-top:3px}
.option.chosen{background:var(--pale)}.option.chosen .option-title{font-weight:650}.option-disabled{opacity:.48;cursor:not-allowed}
.input{display:block;width:100%;padding:12px 13px;border:1px solid var(--field);border-radius:4px;background:white;font-size:14px;min-height:46px;clear:both}
textarea.input{resize:vertical;min-height:105px}
.input::placeholder{color:#78858d;opacity:1}
.note{clear:both;margin-top:12px}
.note summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);width:max-content;max-width:100%;padding:5px 0}
.note summary:hover{text-decoration:underline;text-underline-offset:3px}
.note-content{font-size:13px;line-height:1.65;color:#3d515a;max-width:700px;padding:5px 0 2px}
.note-content p{margin:0 0 6px}
.note-content a{display:inline-block;margin:4px 14px 0 0;font-size:12px}
.step-actions{display:flex;justify-content:space-between;gap:12px;margin:24px 0 0;padding-top:15px}
.btn{padding:10px 15px;border:1px solid #aebfc6;background:white;color:var(--accent);border-radius:4px;font-size:13px;font-weight:650;line-height:1.4;min-height:42px}
.btn:hover{background:#f5f8f9}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
.btn.primary:hover{background:#103e50}
.btn:disabled{opacity:.35;cursor:default}
.btn.warn{color:#873e36}
.action-set{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 20px}
.action-set .btn{flex:0 0 auto}
.summary{padding:8px 0 15px;margin:8px 0}
.summary h2{font-size:18px;line-height:1.45;margin:0 0 8px}
.summary h3{font-size:15px;margin:20px 0 8px}
.summary p,.summary li{font-size:14px;line-height:1.6}
.summary ul{padding-left:22px;margin:6px 0 16px}
.summary li{margin:6px 0}
.small{font-size:13px;color:var(--dim);line-height:1.62}
.status{font-size:13px;color:var(--dim);margin:8px 0 18px}
.issue{margin:10px 0 20px;padding:12px 0;background:transparent;border-radius:0}
.issue h3{color:var(--alert);font-size:15px;margin:0 0 8px}
.issue ul{margin:0;padding-left:18px}
.issue li{font-size:13px;margin:8px 0}
.unanswered button{border:0;background:transparent;cursor:pointer;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.complete{color:#245b49;font-size:13px}
.response-section{margin-top:28px}
.response-section h3{font-size:16px;margin:0 0 9px}
.response{padding:10px 0;border-top:0}
.response:last-child{border-bottom:0}
.response .q-label{font-size:13px;font-weight:650;display:block}
.response .q-value{font-size:13px;color:#415059;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;display:block}
.report-source{font-size:12px;color:var(--dim);margin-top:26px}
.report-source summary{cursor:pointer;color:var(--accent);font-weight:650}
.report-source ul{padding-left:20px}
.report-source li{margin:6px 0}
.inline-info{font-size:13px;color:var(--dim);padding:11px 0;margin:10px 0 20px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:960px){.wrap{padding:20px 23px 55px}.columns{grid-template-columns:205px minmax(0,1fr);gap:29px}.answers{column-gap:16px}}
@media(max-width:720px){.wrap{padding:12px 20px 45px}.columns{display:block}.sidebar{position:static;padding:0;margin:0 0 23px}.sidebar-title{display:none}.nav-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;background:white;color:var(--accent);border:0;padding:9px 2px;min-height:43px;font-size:14px;font-weight:650}.nav{display:none;padding-bottom:9px}.sidebar.expanded .nav{display:grid}.nav button{padding:9px 8px}.nav .count{display:none}.progress-wrap{padding:7px 0 0}.privacy{display:none}h1{font-size:23px}.question{padding:19px 0 16px}}
@media(max-width:500px){.wrap{padding:10px 15px 34px}.answers{grid-template-columns:1fr}.option{padding:8px 0;min-height:44px}.question legend{font-size:15px}.action-set .btn{flex:1 1 140px}.step-actions .btn{flex:1}}
@media(prefers-reduced-motion:reduce){.bar>span{transition:none}}
@media print{.wrap{padding:0;max-width:none}.columns{display:block}.sidebar,.step-actions,.action-set,.no-print{display:none!important}.content{max-width:none}h1{font-size:20px}.response-section{break-inside:auto}.response{break-inside:avoid}.issue{background:transparent;padding:0}.note:not([open]){display:none}a{color:var(--ink)}}

/* Review: lean form UI, meaningful accent only, no decorative framing. */
.recommendation{max-width:760px;margin:11px 0 16px;padding:12px 0;color:#3d515a;font-size:13px;line-height:1.7}
.recommendation strong{display:block;color:var(--ink);margin-bottom:5px}
.recommendation div+div{margin-top:5px}
.select-count{font-size:12px;color:var(--dim);margin:10px 0 0}
.option-hint{display:inline-block;vertical-align:baseline;font-size:11px;line-height:1.4;color:var(--accent);font-weight:600;margin-left:6px}
.form-progress-title{font-size:12px;font-weight:600;color:var(--dim);margin:12px 10px 5px}
.form-shortcut{border:0;border-radius:4px;background:transparent;text-align:left;width:100%;display:flex;flex-direction:column;gap:3px;padding:10px 12px;min-height:46px;color:var(--dim);font-size:13px;line-height:1.3}
.form-shortcut:hover:not(:disabled){background:#eef3f4;color:var(--ink)}
.form-shortcut.active{background:var(--pale);color:var(--accent);font-weight:700}
.form-shortcut:disabled{opacity:.55;cursor:not-allowed}
.form-shortcut small{font-size:11px;color:var(--hint);font-weight:400}
.form-context{font-size:12px;color:var(--dim);margin:0 0 10px}
.form-report{padding-top:25px;break-before:auto}
.form-report>h2{font-size:20px;line-height:1.35;margin:0 0 8px}
.print-head{display:none}
.print-head h2{font-size:22px;margin:0 0 4px}
.report-next{padding:12px 0 20px}
.report-next p{font-size:14px}
.report-foot{font-size:11px;color:var(--dim);margin-top:30px}
.response-section{margin-top:18px}
.response-section h3{font-size:14px;margin:0 0 6px;color:var(--dim)}
.summary{padding:8px 0 12px}
.unanswered button{min-height:26px}
.btn:disabled{opacity:.5}
@media(max-width:500px){.option{padding:11px 10px;min-height:48px}.recommendation{padding:8px 0}}
@media(prefers-reduced-motion:reduce){.option{transition:none}}
@media print{
 @page{size:A4;margin:16mm 17mm}
 body{font:11pt/1.45 Arial,sans-serif;color:#161c21}
 .wrap{padding:0}
 .sidebar,.step-actions,.action-set,.no-print,.summary,.status,.small,#notice{display:none!important}
 #print-area{display:block!important}
 .print-head{display:block;margin:0 0 17px}
 .print-head p{font-size:10pt;margin:0;color:#343b40}
 h1{display:none}
 .form-report{break-before:page;padding-top:0}
 .response-section,.response{break-inside:avoid}
 .response{padding:5px 0}
 .q-label{font-size:9.5pt!important}
 .q-value{font-size:10pt!important}
 .form-report>h2{font-size:18pt;margin:0 0 12px}
 .report-foot{font-size:9pt}
 }

.nav-form-label{font-size:12px;color:var(--dim);font-weight:700;padding:16px 12px 6px;line-height:1.4}
.nav .nav-sub{padding-left:20px}
.forms-list .option{align-items:center}
.forms-list .option.option-disabled{opacity:1;color:#657077;cursor:not-allowed}
.forms-list .option.option-disabled .option-sub{color:#785e52;font-size:12px}
.forms-list .option.recommended{background:#ebf3f4}
.recommend-label{font-size:11px;color:var(--accent);font-weight:750;margin-left:8px;white-space:nowrap}
.notice-line{font-size:13px;color:#785243;margin:12px 0}
.question.invalid .question legend{color:#913e36}
.field-error,.validation-summary{font-size:13px;color:#9a3d36;margin:9px 0}
.question.invalid .input{border-color:#a7443b}
@media(max-width:720px){.nav .nav-sub{padding-left:14px}}
@media print{.field-error,.validation-summary{display:none!important}}

.quick-save{padding:13px 10px 0}
.quick-save button{border:0;border-radius:3px;background:none;color:var(--accent);font-weight:620;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:6px 0;cursor:pointer;text-align:left}
.quick-save button:hover,.quick-save button:focus-visible{background:var(--pale);color:#0e3c4b;text-decoration-thickness:2px}
a:focus-visible,.note summary:focus-visible{text-decoration-thickness:3px;color:#0e3b4c;background:var(--pale)}
@media print{.quick-save{display:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="columns"><aside id="sidebar" class="sidebar" aria-label="Навигация по разделам">
<p class="sidebar-title">Разделы</p>
<button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav">Разделы анкеты <span aria-hidden="true">▾</span></button>
<div id="form-progress" aria-label="Выбранные формы"></div><nav id="nav" class="nav" aria-label="Разделы"></nav>
<div class="progress-wrap"><div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Заполнение обязательных вопросов"><span id="bar"></span></div><p id="progress-label" class="progress-label" aria-live="polite"></p></div>
<div class="quick-save"><button type="button" id="quick-json">Сохранить ответы JSON</button></div><p class="privacy">Анкета работает без сервера. Ответы не отправляются в интернет; для продолжения сохраните JSON.</p>
</aside><main id="content" class="content"></main></div></div>
<script>
'use strict';
const CONFIG={"sections":[{"id":"project","title":"Проект и цели","questions":[{"id":"stage","label":"Что необходимо сделать?","type":"radio","required":true,"options":[{"value":"new","label":"Создать новую организацию"},{"value":"amend","label":"Изменить устав действующей организации"},{"value":"transform","label":"Изменить организационно-правовую форму"}]},{"id":"current","label":"Какая форма у организации сейчас?","type":"radio","required":true,"options":[{"value":"ooo","label":"ООО"},{"value":"association","label":"Ассоциация (союз)"},{"value":"ano","label":"АНО"},{"value":"fund","label":"Фонд"},{"value":"public_org","label":"Общественная организация"},{"value":"public_mov","label":"Общественное движение"},{"value":"coop","label":"Потребительский кооператив"},{"value":"ip","label":"ИП"},{"value":"other","label":"Другая форма"}],"help":"Если действующая форма отсутствует в списке, выберите «Другая форма». Для преобразования из неизвестной формы требуется предварительное заключение о допустимости реорганизации.","when":{"id":"stage","in":["amend","transform"]},"explain":"Для изменения действующего устава необходимо сохранить организационно-правовую форму. Преобразование в другую форму допустимо только в случаях, прямо предусмотренных законом; создание новой организации не является преобразованием.","source":["oo56","gk1238","gk12324","gk1234"]},{"id":"current_coop_type","label":"Какой именно потребительский кооператив действует сейчас?","type":"radio","required":true,"when":{"all":[{"id":"stage","in":["transform"]},{"id":"current","in":["coop"]}]},"options":[{"value":"ordinary","label":"Обычный потребительский кооператив (не жилищный, гаражный, кредитный или страховой)"},{"value":"housing","label":"Жилищный, жилищно-строительный или гаражный"},{"value":"insurance","label":"Общество взаимного страхования"},{"value":"regulated","label":"Иной специально регулируемый кооператив"}],"explain":"Пункт 3 ст. 123.2 ГК РФ устанавливает разные допустимые направления преобразования. Жилищный, жилищно-строительный и гаражный кооперативы преобразуются только в ТСН, а общество взаимного страхования — в хозяйственное общество — страховую организацию. Для других специальных кооперативов необходима отдельная проверка.","source":["gk1232"]},{"id":"activity","label":"Какие товары, работы, услуги или проекты вы планируете?","type":"textarea","required":true,"placeholder":"Например: платные консультации для компаний; совместное отраслевое представительство; образовательные семинары."},{"id":"goal","label":"Главная цель проекта","type":"radio","required":true,"options":[{"value":"business","label":"Вести бизнес и получать прибыль для собственников"},{"value":"services","label":"Оказывать услуги для достижения некоммерческой цели"},{"value":"members","label":"Представлять и защищать общие интересы членов объединения"},{"value":"charity","label":"Привлекать средства и финансировать общественно полезные программы"},{"value":"civic","label":"Объединить людей вокруг общественной инициативы"},{"value":"mutual","label":"Совместно удовлетворять материальные потребности участников за счёт паёв"},{"value":"mixed","label":"Совмещать коммерческий бизнес и самостоятельные некоммерческие проекты"}],"source":["gk50","nko24"],"explain":"Приносящая доход деятельность допускается и в НКО. Отличие от ООО — в целях организации, отношении к имуществу и запрете распределять прибыль НКО между участниками."},{"id":"customers","label":"Кому будет предназначена деятельность?","type":"multi","required":true,"options":[{"value":"public","label":"Широкому кругу клиентов или получателей услуг"},{"value":"members","label":"Прежде всего участникам объединения"},{"value":"beneficiaries","label":"Получателям помощи или поддержки"},{"value":"companies","label":"Юридическим лицам и предпринимателям"},{"value":"authorities","label":"Органам власти и публичным учреждениям"}]},{"id":"paid","label":"Планируется ли платная деятельность?","type":"radio","required":true,"options":[{"value":"main","label":"Да, основной источник финансирования"},{"value":"additional","label":"Да, дополнительное направление"},{"value":"no","label":"Нет, услуги или товары не продаём"},{"value":"unknown","label":"Пока неизвестно"}],"source":["gk50","nko24"],"explain":"В НКО платные услуги разрешены, если служат её уставным целям, соответствуют им и предусмотрены уставом. Сам по себе объём выручки не делает организацию коммерческой. Для отдельных услуг требуется лицензия."},{"id":"mission_paid","label":"Соответствуют ли платные услуги заявленной некоммерческой цели?","type":"radio","required":true,"options":[{"value":"yes","label":"Да, непосредственно служат этой цели"},{"value":"part","label":"Часть услуг связана с целью, часть — самостоятельный бизнес"},{"value":"no","label":"Нет, это отдельное коммерческое направление"},{"value":"unknown","label":"Пока не определили"}],"when":{"all":[{"id":"paid","in":["main","additional"]},{"id":"goal","in":["services","members","charity","civic","mixed"]}]},"source":["gk50","nko24"],"explain":"Для НКО важна не величина выручки, а связь доходной деятельности с уставными целями. Несвязанное направление нельзя легализовать только тем, что прибыль не выплачивается учредителям."},{"id":"profits","label":"Что предполагается делать с прибылью?","type":"radio","required":true,"options":[{"value":"distribute","label":"Распределять между владельцами"},{"value":"keep","label":"Направлять на деятельность и развитие организации"},{"value":"noincome","label":"Прибыль не предполагается"},{"value":"mixed","label":"Часть распределять владельцам, часть направлять на развитие"}],"source":["gk50","gk1232","co24"],"explain":"В ООО прибыль может распределяться между участниками. Обычные НКО не распределяют прибыль как доход от участия. Кооперативные выплаты допустимы только в установленных специальным законом случаях: например, ст. 24 закона № 3085-1 касается потребительских обществ, а не всех видов потребительских кооперативов.","help":"НКО может получать доход от платных услуг и направлять его на уставные цели, но не распределять прибыль между учредителями и членами. Если предполагаются и ООО, и НКО, выберите смешанную модель проекта."},{"id":"founders","label":"Каков предполагаемый состав учредителей на начальном этапе?","type":"radio","required":true,"options":[{"value":"1","label":"Один"},{"value":"2","label":"Два"},{"value":"3to50","label":"От 3 до 50"},{"value":"over50","label":"Более 50"}],"source":["gk1239","ob18","gk12324"],"explain":"Для ООО возможен один участник, максимум 50. Для обычной ассоциации нужны не менее двух учредителей; для АНО возможен один. Для общественного объединения необходимы по меньшей мере три учредителя — физических лица. Отдельные виды организаций подчиняются специальным правилам.","help":"Укажите количество лиц, которые реально готовы участвовать в создании организаций. Если для разных форм состав будет различаться, это уточняется отдельно после выбора форм."},{"id":"founder_types","label":"Кто будет создавать организацию?","type":"multi","required":true,"options":[{"value":"individuals","label":"Физические лица"},{"value":"companies","label":"Коммерческие юридические лица"},{"value":"npo","label":"Некоммерческие юридические лица"},{"value":"foreign","label":"В числе указанных лиц есть иностранные граждане или юридические лица"}],"help":"Выберите фактические категории учредителей. Если среди граждан или юридических лиц есть иностранные лица, отметьте соответствующую основную категорию и дополнительно вариант об иностранных участниках. Для общественных объединений закон предусматривает специальные ограничения."},{"id":"public_three","label":"Есть ли среди учредителей минимум три физических лица?","type":"radio","required":true,"options":[{"value":"yes","label":"Да"},{"value":"no","label":"Нет"}],"when":{"all":[{"id":"founders","in":["3to50","over50"]},{"id":"founder_types","has":["individuals"]}]},"source":["ob18","ob19"],"explain":"По ст. 18 закона № 82-ФЗ нужно не менее трёх учредителей — физических лиц. По общему правилу учредителями являются совершеннолетние граждане; предусмотрены особенности для детских и молодёжных объединений (ст. 19). Дополнительными учредителями-юрлицами могут быть только общественные объединения. Иностранные граждане и лица без гражданства, законно находящиеся в России, при соблюдении законных ограничений могут быть учредителями общественного объединения (ст. 19 закона № 82-ФЗ).","help":"Для общественного объединения среди учредителей должны быть именно три физических лица; присутствия одного гражданина и двух компаний недостаточно."},{"id":"public_legal","label":"Все дополнительные учредители — юридические лица являются общественными объединениями?","type":"radio","required":false,"when":{"all":[{"id":"founders","in":["3to50","over50"]},{"id":"founder_types","has":["npo"]}]},"options":[{"value":"yes","label":"Да, среди юридических лиц только общественные объединения"},{"value":"no","label":"Нет, есть НКО, не являющиеся общественными объединениями"},{"value":"unknown","label":"Нужно проверить организационно-правовую форму юридических лиц"}],"explain":"По статьям 18–19 закона № 82-ФЗ учредителями общественного объединения могут быть физические лица и юридические лица — общественные объединения. Не всякая НКО отвечает этому требованию: например, обычные АНО и фонды не являются общественными объединениями.","source":["ob18","ob19"],"help":"Уточнение требуется только для общественной организации и общественного движения. Закон не разрешает включать в их учредители любые НКО или коммерческие компании."},{"id":"legal_risks","label":"Есть ли специальные направления деятельности?","type":"multi","required":true,"options":[{"value":"education","label":"Образование или образовательные программы"},{"value":"health","label":"Медицинские услуги"},{"value":"finance","label":"Финансовые услуги, кредитование, страхование"},{"value":"sro","label":"Саморегулируемая организация (СРО)"},{"value":"employers","label":"Объединение работодателей со специальным статусом"},{"value":"sport","label":"Спортивная федерация"},{"value":"religion","label":"Религиозная организация"},{"value":"housing","label":"Товарищество собственников / ЖК / ЖСК"},{"value":"professional","label":"Лицензируемая или регулируемая профессия"},{"value":"international","label":"Иностранное финансирование или зарубежные проекты"},{"value":"none","label":"Ничего из перечисленного","exclusive":true}],"explain":"Выбор ОПФ и состав устава могут зависеть от специального закона. Само указание образовательной или медицинской деятельности в уставе не заменяет лицензии."}]},{"id":"choice","title":"Выбор правовой формы","questions":[{"id":"form_select","label":"Какие организационно-правовые формы рассматриваете?","type":"multi","required":true,"options":[{"value":"ooo","label":"ООО","note":"Коммерческая компания с уставным капиталом и долями участников."},{"value":"association","label":"Ассоциация (союз)","note":"НКО с членством для общих интересов участников."},{"value":"ano","label":"Автономная некоммерческая организация (АНО)","note":"НКО без членства, создаваемая в том числе для оказания услуг."},{"value":"fund","label":"Общественно полезный фонд","note":"НКО без членства для социально полезных целей и использования имущества."},{"value":"public_org","label":"Общественная организация","note":"Общественное объединение с членством."},{"value":"public_mov","label":"Общественное движение","note":"Общественное объединение без членства, с участниками."},{"value":"coop","label":"Потребительский кооператив","note":"Паевое объединение; требования зависят от разновидности кооператива."},{"value":"ip","label":"ИП","note":"Предприниматель без образования юридического лица, устава нет."}],"source":["gk1239","ob18"],"explain":"Минимальное число учредителей зависит от правовой формы. Ассоциации требуется не менее двух, общественному объединению — не менее трёх физических лиц; ООО может иметь одного учредителя, но не более пятидесяти участников. НКО не распределяет прибыль между учредителями и членами. При специальном статусе отдельные требования проверяются дополнительно.","max":null,"help":"Можно выбрать несколько подходящих форм. Ответы об уставе каждой формы сохраняются отдельно. Недопустимые варианты недоступны и сопровождаются причиной."}],"desc":"Этот выбор определяет следующие разделы. Если форму ещё не выбрали, результат покажет ориентиры и нерешённые вопросы."},{"id":"charter_team","title":"Учредители этой организации","desc":"При подготовке двух уставов у организаций могут быть разные учредители. Уточните состав отдельно для каждой формы — без имён и персональных данных.","when":{"twoForms":true},"questions":[{"id":"charter_founders","label":"Сколько учредителей будет именно у этой организации?","type":"radio","required":true,"options":[{"value":"1","label":"Один"},{"value":"2","label":"Два"},{"value":"3to50","label":"От 3 до 50"},{"value":"over50","label":"Более 50"}],"source":["gk1239","gk12324","ob18","oo7"],"explain":"Для каждой выбранной организации проверьте собственный состав учредителей. Число учредителей одной организации не обязательно равно числу учредителей другой. Для ООО действует ограничение числа участников, для ассоциации — минимум два учредителя, для общественного объединения — не менее трёх физических лиц.","help":"При сравнении нескольких форм число учредителей может различаться (например, ООО — один, ассоциация — два)."},{"id":"charter_founder_types","label":"Кто будет учредителем именно этой организации?","type":"multi","required":true,"options":[{"value":"individuals","label":"Граждане"},{"value":"companies","label":"Коммерческие юридические лица"},{"value":"npo","label":"Некоммерческие юридические лица"},{"value":"foreign","label":"Иностранные граждане или юридические лица"}],"explain":"Укажите категории; персональные сведения для регистрации будут собираться отдельно. Допустимый состав учредителей проверяется по законодательству о выбранной форме."},{"id":"charter_public_three","label":"Есть ли среди учредителей этой организации минимум три физических лица?","type":"radio","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"founders_form","in":["3to50","over50"]}]},"options":[{"value":"yes","label":"Да"},{"value":"no","label":"Нет"}],"source":["ob18","ob19"],"explain":"По ст. 18 закона № 82-ФЗ нужно не менее трёх учредителей — физических лиц. По общему правилу учредителями являются совершеннолетние граждане; предусмотрены особенности для детских и молодёжных объединений (ст. 19). Дополнительными учредителями-юрлицами могут быть только общественные объединения. Иностранные граждане и лица без гражданства, законно находящиеся в России, при соблюдении законных ограничений могут быть учредителями общественного объединения (ст. 19 закона № 82-ФЗ)."},{"id":"charter_public_legal","label":"Если среди учредителей будут юрлица, все ли они — общественные объединения?","type":"radio","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"twoForms":true},{"id":"charter_founder_types","has":["npo"]}]},"options":[{"value":"yes","label":"Да, среди юридических лиц только общественные объединения"},{"value":"no","label":"Нет, есть НКО, не являющиеся общественными объединениями"},{"value":"unknown","label":"Нужно проверить организационно-правовую форму юридических лиц"}],"explain":"По статьям 18–19 закона № 82-ФЗ учредителями общественного объединения могут быть физические лица и юридические лица — общественные объединения. Не всякая НКО отвечает этому требованию: например, обычные АНО и фонды не являются общественными объединениями.","source":["ob18","ob19"],"help":"Если среди учредителей этой организации есть юрлица, подтвердите, что каждое из них — общественное объединение. Иначе общественную организацию или движение с таким составом создать нельзя."}]},{"id":"identity","title":"Наименование и деятельность","questions":[{"id":"full_name","label":"Предлагаемое полное наименование","type":"input","required":true,"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: Общество с ограниченной ответственностью «Вектор»","source":["oo4","nko14","gk12324","gk12317","gk1232","ob28"],"explain":"Наименование юридического лица должно содержать организационно-правовую форму и отвечать специальным требованиям закона. В частности, в полном названии ООО используются слова «общество с ограниченной ответственностью», АНО — «автономная некоммерческая организация», фонда — «фонд». Устав фиксирует именно полное наименование. Для общественного объединения дополнительно укажите территориальную сферу и характер его деятельности в официальном наименовании (ст. 28 закона № 82-ФЗ).","help":"Укажите ПОЛНОЕ название с организационно-правовой формой, например «Общество с ограниченной ответственностью „Пример“», «Автономная некоммерческая организация „Знание“», «Ассоциация специалистов отрасли „Профиль“». Для кооператива наименование должно также указывать на основную цель его деятельности (ст. 123.2 ГК РФ). Для общественной организации и движения дополнительно укажите территориальный уровень и характер деятельности (например: «Региональная общественная организация …»)."},{"id":"short_name_llc","label":"Сокращённое фирменное наименование ООО (при необходимости)","type":"input","required":false,"when":{"form":["ooo"]},"placeholder":"Например: ООО «Вектор»","source":["oo4","oo12"],"explain":"Статья 4 закона № 14-ФЗ допускает отсутствие сокращённого наименования. Если сокращённое наименование выбрано, оно отражается в уставе и регистрационных сведениях; ст. 12 закона № 14-ФЗ содержит требования к сведениям устава.","help":"Можно оставить пустым: для ООО сокращённое наименование не обязательно."},{"id":"short_name_npo","label":"Нужно ли сокращённое наименование НКО?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да"}],"when":{"form":["association","ano","fund","public_org","public_mov","coop"]}},{"id":"short_name_npo_txt","label":"Какое сокращённое наименование использовать?","type":"input","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"id":"short_name_npo","in":["yes"]}]},"placeholder":"Например: АНО «Центр образования»"},{"id":"location","label":"Место нахождения юридического лица","type":"input","required":true,"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: Калининградская область, город Калининград","source":["oo12","nko14"],"explain":"В уставе обычно указывается населённый пункт (муниципальное образование) как место нахождения. Для ЕГРЮЛ отдельно потребуется полный адрес в пределах места нахождения. Не нужно вносить персональный адрес физического лица в анкету."},{"id":"name_special","label":"Требуются ли особые слова, статус или географическое указание в названии?","type":"textarea","required":false,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: региональная общественная организация; профессиональное отраслевое объединение.","explain":"Использование слов «Россия», «Российская Федерация», наименований органов власти, а также некоторых отраслевых обозначений может иметь специальный правовой режим."},{"id":"duration","label":"Срок деятельности","type":"radio","required":true,"options":[{"value":"indef","label":"Без ограничения срока"},{"value":"fixed","label":"На определённый срок"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"duration_text","label":"На какой срок?","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"duration","in":["fixed"]}]},"placeholder":"Например: до 31.12.2030"},{"id":"npo_goals","label":"Конкретные некоммерческие цели","type":"textarea","required":true,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: развитие и защита профессиональных интересов членов отрасли; предоставление доступного дополнительного образования.","source":["nko14","gk1239","gk12324"],"explain":"Для НКО цель должна быть некоммерческой и определимой. Общей фразы «иная не запрещённая деятельность» недостаточно для описания предмета и целей."},{"id":"npo_activities","label":"Какие конкретные виды деятельности необходимы для этих целей?","type":"textarea","required":true,"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"placeholder":"Например: семинары; консультации; отраслевые исследования; образовательные программы; издание материалов.","source":["nko24"],"explain":"Отделяйте цели от способов их достижения. Если предполагаются платные услуги, они должны соответствовать целям, а для отдельных видов деятельности может потребоваться лицензия."},{"id":"npo_income","label":"Как НКО будет финансироваться?","type":"multi","required":true,"options":[{"value":"fees","label":"Членские взносы","note":"Только для ассоциации и общественной организации, имеющих членов."},{"value":"donations","label":"Пожертвования"},{"value":"grants","label":"Гранты или субсидии"},{"value":"service","label":"Платные услуги, работы, продажа результатов деятельности"},{"value":"founders","label":"Имущественные взносы учредителей"},{"value":"property","label":"Доходы от имущества и разрешённой деятельности"},{"value":"other","label":"Иные законные источники"}],"when":{"form":["association","ano","fund","public_org","public_mov","coop"]},"explain":"В НКО могут поступать пожертвования, имущественные взносы, гранты, выручка от разрешённых услуг и другие законные средства (ст. 26 закона № 7-ФЗ). Членские взносы относятся к организациям с членством — например, ассоциации и общественной организации. У АНО, фонда и общественного движения нет членов; для них выбирайте имущественные взносы учредителей или добровольные поступления, но не членские взносы. Для потребительского кооператива обязательные паевые взносы регулируются отдельно; членские и паевые взносы — не одно и то же.","source":["nko26","gk12311","gk12324","gk1232"],"help":"Отмечайте источники финансирования именно выбранной организации. Если создаются ООО и НКО одновременно, деньги от продаж ООО сами по себе не являются доходом НКО."},{"id":"npo_asset_min","label":"Предусмотрено ли имущество для приносящей доход деятельности НКО?","type":"radio","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"any":[{"id":"npo_income","has":["service","property"]},{"all":[{"oneForm":true},{"id":"paid","in":["main","additional"]}]}]}]},"options":[{"value":"provided","label":"Да, имеется имущество рыночной стоимостью не менее 10 000 ₽"},{"value":"will_provide","label":"Имущество будет обеспечено до ведения такой деятельности"},{"value":"no","label":"Нет, пока не планируется"},{"value":"unknown","label":"Не оценивали имущество и его стоимость"}],"explain":"По п. 5 ст. 50 ГК РФ НКО, устав которой предусматривает приносящую доход деятельность (кроме указанных в законе исключений), должна иметь достаточное имущество рыночной стоимостью не менее минимального уставного капитала ООО — обычно 10 000 ₽. Это не уставный капитал НКО и не обязательно денежный вклад. Если источник финансирования — только пожертвования и гранты, само по себе это не означает доходную деятельность. В специальных сферах возможны дополнительные требования.","source":["gk50","oo14"],"help":"Если приносящую доход деятельность будет вести отдельное ООО, а эта НКО будет финансироваться только целевыми поступлениями, укажите это в источниках финансирования НКО. Требование относится к НКО, устав которой предусматривает доходную деятельность."},{"id":"paid_services","label":"Какие платные услуги или товары предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov","coop"]},{"any":[{"id":"npo_income","has":["service"]},{"all":[{"oneForm":true},{"id":"paid","in":["main","additional"]}]}]}]},"placeholder":"Перечислите конкретные виды платной деятельности, связанные с уставными целями.","source":["nko24","gk12311"],"explain":"Платные услуги допустимы, если способствуют достижению некоммерческих уставных целей и прямо предусмотрены уставом. Для ассоциации дополнительно учитывайте ст. 123.11 ГК РФ: её члены по общему правилу вправе на равных началах безвозмездно пользоваться услугами ассоциации, если законом не предусмотрено иное. Поэтому плату за такие услуги членам нужно юридически оценивать отдельно.","help":"Укажите платные товары или услуги именно этой НКО. Если коммерческое направление ведёт отдельное ООО, не включайте его сюда и не выбирайте «Платные услуги» в источниках дохода НКО."}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"governance","title":"Руководитель и управление","questions":[{"id":"head_title","label":"Название должности руководителя","type":"radio","required":true,"options":[{"value":"director","label":"Директор"},{"value":"general","label":"Генеральный директор"},{"value":"chair","label":"Председатель"},{"value":"president","label":"Президент"},{"value":"other","label":"Другое"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Название должности определяет наименование единоличного исполнительного органа в уставе и ЕГРЮЛ. Порядок назначения зависит от формы: в АНО руководителя назначают учредители, в фонде — высший коллегиальный орган, если специальным законом не предусмотрено иное. Название не меняет законную компетенцию.","source":["gk12325","gk12319","oo40"]},{"id":"head_other","label":"Какое название должности выбрать?","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"head_title","in":["other"]}]},"placeholder":"Например: Исполнительный директор"},{"id":"head_term","label":"Срок полномочий руководителя","type":"radio","required":true,"options":[{"value":"1","label":"1 год"},{"value":"3","label":"3 года"},{"value":"5","label":"5 лет"},{"value":"other","label":"Другой определённый срок"}],"help":"Срок используется для подготовки устава; для разных форм возможны отдельные требования закона.","when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"head_term_other","label":"Укажите срок полномочий","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"head_term","in":["other"]}]},"placeholder":"Например: 2 года"},{"id":"head_absence","label":"Кто временно замещает руководителя при его отсутствии?","type":"radio","required":true,"options":[{"value":"deputy","label":"Заместитель, если назначен"},{"value":"person","label":"Лицо, назначенное компетентным органом"},{"value":"byorder","label":"Лицо по доверенности или распоряжению в пределах закона"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Замещение нужно разграничивать с полномочиями единоличного исполнительного органа, сведения о котором содержатся в ЕГРЮЛ. Доверенность не заменяет назначения нового руководителя."},{"id":"board","label":"Нужен ли дополнительный совет или правление?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, кроме обязательных органов по закону"},{"value":"advisory","label":"Совещательный совет без управленческих полномочий"},{"value":"board","label":"Коллегиальный орган с установленной компетенцией"}],"when":{"form":["association","ano","public_org","public_mov","coop"]},"source":["gk653","gk12325","gk12310"],"explain":"Обязательные по закону органы сохраняются независимо от ответа. Дополнительный орган нужен, только если за ним планируется конкретная компетенция. Для АНО учредители осуществляют управление по уставу."},{"id":"board_size","label":"Предполагаемый состав и срок полномочий совета или правления","type":"textarea","required":true,"when":{"all":[{"form":["association","ano","public_org","public_mov","coop"]},{"id":"board","in":["board"]}]},"placeholder":"Например: 5 членов, срок 3 года, избирает общее собрание."},{"id":"board_tasks","label":"Какие конкретные решения должен принимать совет или правление?","type":"multi","required":true,"options":[{"value":"strategy","label":"Подготавливать стратегию и бюджет"},{"value":"members","label":"Принимать новых членов, если это допускается законом"},{"value":"projects","label":"Утверждать проекты и программы"},{"value":"transactions","label":"Согласовывать определённые сделки"},{"value":"director","label":"Участвовать в вопросах назначения руководителя в допустимых законом пределах"},{"value":"other","label":"Иные вопросы — уточнить"}],"when":{"all":[{"form":["association","ano","public_org","public_mov","coop"]},{"id":"board","in":["board"]}]},"source":["gk653","gk12310","nko29"],"explain":"Передавать органу можно только допустимые законом полномочия: у высшего органа есть исключительная компетенция."},{"id":"meetings","label":"Как участники органов будут проводить заседания?","type":"radio","required":true,"options":[{"value":"inperson","label":"Очно"},{"value":"hybrid","label":"Очно и с дистанционным участием"},{"value":"remote","label":"С возможностью полностью дистанционного заседания"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"source":["oo371","nko29"],"explain":"Дистанционное участие в заседании и заочное голосование различаются. Для ООО действуют требования ст. 37.1 закона № 14-ФЗ (включая идентификацию, передачу изображения и звука и хранение записи); для НКО отдельные ключевые решения нельзя принимать заочно. Способ заседания должен допускать соблюдение соответствующего закона."},{"id":"notices","label":"Как направлять уведомления о собраниях?","type":"multi","required":true,"options":[{"value":"email","label":"Электронная почта по адресу, указанному участником"},{"value":"letter","label":"Бумажные письма"},{"value":"cabinet","label":"Защищённый личный кабинет / система электронного взаимодействия"},{"value":"other","label":"Другой подтверждаемый способ"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Способ должен позволять доказать направление уведомления и соблюдение срока. Законные минимальные сроки и компетенция органов применяются независимо от выбора."},{"id":"notices_other","label":"Какой иной способ подтверждаемого уведомления вы предлагаете?","type":"textarea","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"notices","has":["other"]}]},"placeholder":"Укажите канал доставки уведомлений и как подтверждается получение."},{"id":"meeting_notice","label":"За какое время извещать о плановом собрании?","type":"radio","required":true,"options":[{"value":"statutory","label":"По срокам закона и устава без сокращения"},{"value":"custom","label":"Предусмотреть иной допустимый срок"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Для ООО общее правило ст. 36 закона № 14-ФЗ — уведомить участников не позднее 30 дней; устав вправе сократить указанный в статье срок. Для НКО порядок уведомления определяется с учётом требований закона и конкретной организационно-правовой формы.","source":["oo36","nko14"]},{"id":"meeting_notice_days","label":"За сколько календарных дней извещать участников?","type":"input","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"meeting_notice","in":["custom"]}]},"placeholder":"Например: 14","explain":"Укажите целое положительное число календарных дней, например 14. Для ООО по общему правилу применяется срок 30 дней, который устав может сократить, с учётом статьи 36 закона № 14-ФЗ.","source":["oo36"],"number":true,"min":1,"step":1},{"id":"absentee","label":"Нужно ли предусмотреть заочное голосование там, где оно разрешено законом?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, достаточно заседаний с участием"},{"value":"yes","label":"Да, предусмотреть для допустимых законом вопросов"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Заочное голосование проводится без заседания и подчиняется отдельным правилам. Для НКО важнейшие вопросы исключительной компетенции высшего органа нельзя решать заочно по ст. 29 закона № 7-ФЗ.","source":["nko29","oo371"]},{"id":"meeting_quorum","label":"Нужны ли дополнительные требования к присутствию на заседаниях?","type":"radio","required":true,"options":[{"value":"law","label":"Применять правила закона о правомочности заседаний и количестве голосов"},{"value":"higher","label":"Установить дополнительные требования к присутствию, если они допустимы"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"explain":"Для ООО закон устанавливает порядок и число голосов, необходимое для конкретных решений; универсальный отдельный кворум не следует предполагать. Для высших органов НКО закон предусматривает требования к правомочности. Повышение порога не может обходить императивные правила.","source":["oo37","nko29","gk653"]},{"id":"meeting_quorum_details","label":"Какой повышенный кворум вы предлагаете?","type":"textarea","required":true,"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"id":"meeting_quorum","in":["higher"]}]},"placeholder":"Например: не менее 2/3 состава высшего органа. Укажите орган и порог."},{"id":"voting_control","label":"Есть ли решения, для которых вы хотите более высокого порога голосов?","type":"multi","required":false,"options":[{"value":"strategy","label":"Утверждение бюджета и стратегии"},{"value":"leaders","label":"Назначение руководителя (если применимо)"},{"value":"transactions","label":"Особо крупные сделки"},{"value":"members","label":"Приём или исключение членов  в рублях. Укажите сумму, а не описание или процент активов. Если нужен порог от балансовой стоимости активов, изложите его в разделе дополнительных условий; обязательные правила о крупных сделках сохраняют силу независимо от выбранного внутреннего порога.","number":true,"min":0.01,"step":0.01},{"id":"controls","label":"Какой контроль нужен дополнительно к обязательному?","type":"radio","required":true,"options":[{"value":"standard","label":"Только предусмотренный законом"},{"value":"auditor","label":"Ревизор или ревизионная комиссия"},{"value":"external","label":"Внешняя независимая проверка / аудит"},{"value":"both","label":"Внутренний контроль и внешний аудит"}],"when":{"all":[{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},{"notForm":["fund"]}]},"explain":"Обязательные по закону контрольно-надзорные органы конкретных видов НКО не отменяются выбором минимального варианта."},{"id":"documents","label":"Как участникам или учредителям предоставлять документы?","type":"radio","required":true,"options":[{"value":"standard","label":"Предусмотреть порядок по закону без дополнительных способов"},{"value":"electronic","label":"Электронные копии по запросу и ознакомление по закону"},{"value":"portal","label":"Защищённая система доступа и ознакомление по закону"}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]},"source":["oo12","oo50"],"explain":"Устав ООО должен определять порядок хранения документов и предоставления информации. Нельзя лишить участника установленного законом права на доступ к документам."}],"when":{"form":["ooo","association","ano","fund","public_org","public_mov","coop"]}},{"id":"llc_capital","title":"ООО: капитал и доли","questions":[{"id":"llc_capital_amount","label":"Размер уставного капитала в рублях","type":"input","required":true,"when":{"form":["ooo"]},"placeholder":"Например: 10000","source":["oo14","gk662"],"explain":"Для обычного ООО минимальный размер уставного капитала 10 000 рублей (ст. 14 закона № 14-ФЗ). Минимальная сумма оплачивается деньгами (ст. 66.2 ГК РФ); для отдельных регулируемых видов деятельности закон может требовать большего капитала. Укажите сумму рублями (число без текста).","number":true,"min":10000,"step":1,"default":"10000","help":"Для обычного ООО — не менее 10 000 ₽; эта сумма оплачивается денежными средствами. Для отдельных лицензируемых и регулируемых видов деятельности закон может предусматривать больший минимальный капитал."},{"id":"llc_capital_payment","label":"Как планируется оплатить капитал?","type":"radio","required":true,"options":[{"value":"money","label":"Полностью денежными средствами"},{"value":"money_property","label":"Минимум по закону — деньгами, оставшуюся часть — деньгами и/или имуществом"}],"when":{"form":["ooo"]},"source":["gk662","oo16"],"explain":"Общий минимум уставного капитала ООО (10 000 рублей) обязательно оплачивается денежными средствами. Неденежные вклады возможны лишь сверх этого минимума и требуют независимой оценки. При капитале ровно 10 000 рублей выберите полную денежную оплату."},{"id":"llc_shares","label":"Как будут распределены доли между участниками?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"placeholder":"Например: участник А — 60 %, участник Б — 40 % (итого 100 %). Имена для устава не требуются.","source":["oo14"],"explain":"Точные доли нужны для пакета документов о создании ООО и проектирования управления, но в индивидуальном уставе обычно не перечисляют Ф. И. О. участников."},{"id":"llc_moreowners","label":"Планируются ли новые участники или инвесторы, получающие доли?","type":"radio","required":true,"options":[{"value":"yes","label":"Да, возможность входа новых участников важна"},{"value":"no","label":"Нет, состав планируется постоянным"},{"value":"maybe","label":"Возможно в будущем"}],"when":{"form":["ooo"]}},{"id":"llc_profit","label":"Как часто предполагается принимать решение о распределении прибыли?","type":"radio","required":true,"options":[{"value":"quarter","label":"Ежеквартально"},{"value":"half","label":"Раз в полгода"},{"value":"year","label":"Раз в год"},{"value":"asneeded","label":"Распределять только при необходимости, в сроки, разрешённые законом"}],"when":{"form":["ooo"]},"explain":"Статья 28 закона № 14-ФЗ предусматривает принятие решения о распределении чистой прибыли ежеквартально, раз в полгода либо раз в год. Возможность распределить прибыль также ограничена законом; это не автоматическая выплата денег с расчётного счёта.","source":["oo28"],"help":"Это не означает обязанности ежегодно распределять прибыль: решение принимают только при наличии оснований и желании участников, с соблюдением ограничений закона."},{"id":"llc_profit_order","label":"По каким долям распределять чистую прибыль участникам ООО?","type":"radio","required":true,"options":[{"value":"proportional","label":"Пропорционально долям в уставном капитале"},{"value":"special","label":"Нужен иной порядок распределения — описать отдельно"}],"when":{"form":["ooo"]},"explain":"По общему правилу распределяемая прибыль делится пропорционально долям. Иной порядок допускается при соблюдении специальных требований ст. 28 закона № 14-ФЗ, в частности единогласного решения при утверждении соответствующего положения устава.","source":["oo28"]},{"id":"llc_profit_order_details","label":"Какой особый порядок распределения прибыли нужен?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_profit_order","in":["special"]}]},"placeholder":"Например, фиксированная пропорция или иная согласованная формула с соблюдением закона."},{"id":"llc_exit","label":"Нужно ли право добровольного выхода участника из ООО по заявлению?","type":"radio","required":true,"options":[{"value":"no","label":"Не предусматривать"},{"value":"all","label":"Предусмотреть для участников"},{"value":"conditional","label":"Предусмотреть в отношении определённых лиц / при определённых условиях"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo26"],"explain":"Выход по заявлению существует только если он предусмотрен уставом. Он отличается от продажи доли; выход единственного участника, в результате которого не остаётся участников, не допускается."},{"id":"llc_exit_terms","label":"Кому и при каких обстоятельствах разрешить выход?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_exit","in":["conditional"]}]},"placeholder":"Например: при достижении определённого срока участия или для участников с определённой долей.","source":["oo26"]},{"id":"llc_transfer","label":"Как регулировать отчуждение долей третьим лицам?","type":"radio","required":true,"options":[{"value":"law","label":"По законным правилам без дополнительного запрета"},{"value":"consent","label":"С согласия участников / общества в допустимом порядке"},{"value":"ban","label":"Предусмотреть запрет отчуждения третьим лицам"}],"when":{"form":["ooo"]},"source":["oo21"],"explain":"Правила отчуждения долей важны и в ООО с одним участником: они определяют возможность вступления новых лиц и дальнейшего оборота долей. Закон позволяет дополнительно ограничить переход доли к третьим лицам, но требует соблюдения гарантий."},{"id":"llc_preempt","label":"Нужен ли особый порядок преимущественной покупки доли?","type":"radio","required":true,"options":[{"value":"law","label":"Оставить законный порядок"},{"value":"modified","label":"Установить разрешённые законом особенности цены или распределения"},{"value":"nonapply","label":"Проработать допустимое законом неприменение преимущественного права"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo21"],"explain":"С 2025 года закон допускает отдельные специальные условия о преимущественном праве. Они не вводятся произвольно и требуют проверки предусмотренных законом условий."},{"id":"llc_preempt_details","label":"Опишите желаемый особый порядок покупки долей","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_preempt","in":["modified","nonapply"]}]},"placeholder":"Например: иная цена предложения доли, особенности распределения права между участниками либо его неприменения в предусмотренных законом случаях.","explain":"Ограничение или изменение преимущественного права требует точной формулировки и соблюдения статьи 21 закона № 14-ФЗ. Окончательный механизм согласовывается юристом.","source":["oo21"]},{"id":"llc_inheritance","label":"Как переходят доли наследникам и правопреемникам?","type":"radio","required":true,"options":[{"value":"law","label":"По законному порядку"},{"value":"consent","label":"С согласия остальных участников в случаях, допустимых законом"}],"when":{"form":["ooo"]},"source":["oo21"],"explain":"Устав может предусматривать необходимость согласия остальных участников на переход доли к наследникам или правопреемникам в случаях, предусмотренных законом. Для ООО с одним участником правило тоже имеет значение, если состав участников изменится."},{"id":"llc_vote","label":"Как распределяются голоса на общем собрании?","type":"radio","required":true,"options":[{"value":"shares","label":"По долям участников (обычный порядок)"},{"value":"other","label":"Нужен иной порядок, который необходимо согласовать с законом"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo37"],"explain":"Обычное правило связано с размером доли. Изменение порядка требует соблюдения специальных правил закона и может не подходить для типового устава."},{"id":"llc_vote_details","label":"Как именно должны распределяться голоса?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_vote","in":["other"]}]},"placeholder":"Опишите специальный порядок распределения голосов; сумма и пределы должны соответствовать закону.","explain":"Доли и число голосов нельзя произвольно изменить без соблюдения требований статьи 32 закона № 14-ФЗ. Не путайте число голосов с повышенным большинством по отдельным решениям.","source":["oo32","oo37"]},{"id":"llc_council","label":"Нужен ли совет директоров / наблюдательный совет?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, нужен"}],"when":{"form":["ooo"]},"source":["oo32"]},{"id":"llc_council_details","label":"Состав, срок и реальные полномочия совета директоров","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_council","in":["yes"]}]},"placeholder":"Например: 3 члена; 3 года; контролирует бюджет, согласует сделки.","source":["oo32"],"explain":"Совет не может получить вопросы исключительной компетенции общего собрания, которые закон не позволяет передавать."},{"id":"llc_eo_appoint","label":"Какой орган избирает / назначает руководителя ООО?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание участников"},{"value":"council","label":"Совет директоров в пределах предусмотренных законом полномочий"}],"when":{"all":[{"form":["ooo"]},{"id":"llc_council","in":["yes"]}]},"explain":"По общему правилу руководителя избирает общее собрание участников. Если предусмотрен совет директоров, устав может передать ему это полномочие. Факт принятия решения о назначении руководителя подлежит нотариальному удостоверению в предусмотренных законом случаях.","source":["oo40"]},{"id":"llc_certify","label":"Как подтверждать решения общего собрания или единственного участника ООО?","type":"radio","required":true,"options":[{"value":"notary","label":"Нотариально, когда это требуется законом"},{"value":"alternative","label":"Предусмотреть допустимый законом альтернативный способ"}],"when":{"form":["ooo"]},"source":["gk671","oo40"],"explain":"По пп. 3 п. 3 ст. 67.1 ГК РФ общее правило — нотариальное удостоверение решений; устав или надлежащим образом принятое решение может установить допустимый альтернативный способ. Это относится и к решениям единственного участника с учётом особенностей их оформления. При этом ряд решений, включая назначение единоличного исполнительного органа, должен удостоверяться нотариально независимо от альтернативного способа (ст. 40 закона № 14-ФЗ и предусмотренные законом исключения)."},{"id":"llc_certify_method","label":"Какой альтернативный способ подтверждения решений предусмотреть?","type":"radio","required":true,"options":[{"value":"all_sign","label":"Подписание протокола всеми участниками или решения единственным участником"},{"value":"part_sign","label":"Подписание протокола определёнными участниками (если участников больше одного)"},{"value":"technical","label":"Технические средства, достоверно подтверждающие принятие решения"}],"when":{"all":[{"form":["ooo"]},{"id":"llc_certify","in":["alternative"]}]},"explain":"Альтернативный способ подтверждения следует конкретно закрепить в уставе или надлежащем единогласном решении участников. Для единственного участника оформляется решение, а не протокол общего собрания. Альтернативный способ не отменяет случаи обязательного нотариального удостоверения, включая предусмотренное ст. 40 закона № 14-ФЗ удостоверение факта назначения руководителя.","source":["gk671","oo40"]},{"id":"llc_meeting_conflict","label":"Нужен ли механизм разрешения тупика при равных голосах?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, обычных правил достаточно"},{"value":"negotiation","label":"Обязательное повторное обсуждение или переговоры"},{"value":"agreement","label":"Отдельное корпоративное соглашение / механизм выкупа при тупике"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"explain":"Нельзя просто отменить законные пороги голосования. Часть договорённостей об опционе, выкупе доли или конфликте лучше оформлять корпоративным договором, а не уставом."},{"id":"llc_special_rights","label":"Нужны ли дополнительные права или обязанности определённых участников?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, достаточно закона"},{"value":"yes","label":"Да, требуется отдельное описание"}],"when":{"all":[{"form":["ooo"]},{"id":"founders_form","in":["2","3to50"]}]},"source":["oo12"]},{"id":"llc_special_details","label":"Какие именно дополнительные права или обязанности нужны?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_special_rights","in":["yes"]}]},"placeholder":"Например: специальные права на информацию или обязанность участвовать в согласованных проектах."},{"id":"llc_obligations","label":"Нужны ли дополнительные обязанности участников сверх предусмотренных законом?","type":"radio","required":true,"options":[{"value":"statutory","label":"Нет, достаточно обязанностей по закону"},{"value":"additional","label":"Да, дополнительно предусмотреть обязанности в пределах закона"}],"when":{"form":["ooo"]},"explain":"Обязанности по закону будут включены в устав в любом случае. Дополнительные обязанности и права участников требуют точной формулировки и соблюдения порядка их введения.","source":["oo12"]},{"id":"llc_obligations_details","label":"Какие дополнительные обязанности предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_obligations","in":["additional"]}]},"placeholder":"Например: предоставление определённых сведений обществу, соблюдение внутренних процедур в пределах закона."},{"id":"llc_charter_mode","label":"Какой устав предполагается использовать?","type":"radio","required":true,"options":[{"value":"individual","label":"Индивидуальный устав по согласованным условиям"},{"value":"typical","label":"Проверить, подходит ли один из типовых уставов ФНС"}],"when":{"form":["ooo"]},"source":["oo12","fns"],"explain":"Типовой устав, утверждённый ФНС, применяется без редактирования. Нужно выбрать конкретный вариант и проверить его условия о выходе, продаже долей, управлении и подтверждении решений. Если индивидуальные правила не совпадают с выбранным типовым уставом, требуется индивидуальная редакция."},{"id":"llc_typical_number","label":"Какой номер типового устава ООО ФНС выбран?","type":"input","required":true,"when":{"all":[{"form":["ooo"]},{"id":"llc_charter_mode","in":["typical"]}]},"source":["fns","oo12"],"help":"Существуют 36 утверждённых типовых уставов ООО. Их текст нельзя произвольно менять. Для нестандартных условий потребуется индивидуальный устав.","explain":"На сайте ФНС необходимо выбрать конкретный утверждённый типовой устав и проверить его условия. Номер не заменяет проверку применимости к решениям участников. Изменять текст типового устава нельзя.","number":true,"min":1,"step":1,"max":36}],"when":{"form":["ooo"]}},{"id":"association_members","title":"Ассоциация: членство","questions":[{"id":"assoc_members","label":"Кого можно принимать в члены ассоциации?","type":"multi","required":true,"options":[{"value":"people","label":"Физических лиц"},{"value":"legal","label":"Юридических лиц"}],"when":{"form":["association"]},"source":["gk1238","gk1239"],"explain":"Ассоциация объединяет граждан и/или юридических лиц. Профессиональные или иные объективные критерии членства могут быть закреплены в уставе, но не должны нарушать императивные корпоративные права членов.","help":"Можно выбрать оба варианта. Наличие профессиональных требований к кандидатам определяется в следующем вопросе."},{"id":"assoc_criteria_mode","label":"Нужны ли специальные условия приёма в члены ассоциации?","type":"radio","required":true,"when":{"form":["association"]},"options":[{"value":"general","label":"Нет, достаточно общего соответствия целям и уставу"},{"value":"special","label":"Да, профессиональные или иные объективные критерии"}],"explain":"Требования к кандидатам должны быть определёнными и соответствовать целям объединения. Например, профиль деятельности, профессиональная квалификация либо осуществление деятельности в определённой сфере.","source":["gk1239","gk12311"]},{"id":"assoc_criteria","label":"Каковы объективные требования к новым членам?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_criteria_mode","in":["special"]}]},"placeholder":"Например: осуществление деятельности в определённой профессиональной сфере, соблюдение отраслевых требований.","help":"Например: осуществление деятельности в определённой отрасли, наличие профильной квалификации, принятие правил профессиональной этики."},{"id":"assoc_admission","label":"Какой орган принимает новых членов?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание членов"},{"value":"board","label":"Совет / правление"},{"value":"director","label":"Единоличный исполнительный орган"}],"when":{"form":["association"]},"explain":"Порядок приёма утверждает высший орган. Принятие конкретного кандидата может относиться к компетенции другого органа, если это допускается законом и однозначно закреплено в уставе.","source":["gk653","gk12311"]},{"id":"assoc_admission_procedure","label":"Какие действия входят в процедуру приёма?","type":"multi","required":true,"options":[{"value":"application","label":"Заявление кандидата"},{"value":"documents","label":"Подтверждение соответствия условиям членства"},{"value":"decision","label":"Решение компетентного органа"},{"value":"notification","label":"Уведомление кандидата о решении"},{"value":"register","label":"Внесение в реестр членов"}],"when":{"form":["association"]},"help":"Заявление, проверка условий, решение компетентного органа и фиксация членства должны быть последовательно описаны. Отметьте дополнительные шаги, которые хотите предусмотреть; необходимые этапы юрист включит независимо от выбора.","explain":"По ст. 123.9 ГК РФ устав должен установить порядок приёма, а по ст. 65.3 ГК РФ высший орган определяет правила приёма и исключения. Нельзя считать порядок завершённым без органа принятия решения, момента вступления в членство и способа фиксации решения.","source":["gk1239","gk653"]},{"id":"assoc_member_categories","label":"Нужны ли категории членов?","type":"radio","required":true,"options":[{"value":"single","label":"Нет, для всех одинаковый статус"},{"value":"different","label":"Разные категории действительных членов"},{"value":"partners","label":"Единое членство, а также партнёры без корпоративных прав"}],"when":{"form":["association"]},"source":["gk12311"],"explain":"Нельзя создать фиктивных «членов» с произвольным лишением обязательных корпоративных прав. Партнёры без членства могут участвовать в проектах по договору."},{"id":"assoc_category_details","label":"Чем должны отличаться категории членов или статус партнёров?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_member_categories","in":["different","partners"]}]},"placeholder":"Например: партнёры участвуют в мероприятиях, но не являются членами и не голосуют."},{"id":"assoc_vote","label":"Как должен определяться голос члена в высшем органе?","type":"radio","required":true,"options":[{"value":"equal","label":"Один член — один голос"},{"value":"special","label":"Хотим иной порядок — юридически проверить допустимость"}],"when":{"form":["association"]},"source":["gk12311","gk653"],"explain":"Нужно учитывать корпоративные права членов и характер выбранной ассоциации. Специальный порядок требует отдельной правовой проверки."},{"id":"assoc_member_rights","label":"Какие дополнительные возможности предоставлять членам?","type":"multi","required":false,"options":[{"value":"events","label":"Льготы на мероприятия или образовательные программы"},{"value":"experts","label":"Экспертная или информационная поддержка"},{"value":"projects","label":"Участие в рабочих группах и проектах"},{"value":"other","label":"Иные преимущества"}],"help":"Законные корпоративные права членов (участие в управлении и доступ к информации) сохраняются независимо от выбора.","when":{"form":["association"]},"source":["gk12311"]},{"id":"assoc_property_rights","label":"Какие имущественные права будут у членов ассоциации?","type":"radio","required":true,"when":{"form":["association"]},"options":[{"value":"standard","label":"Применять законную модель: имущество принадлежит ассоциации, прибыль между членами не распределяется, законные права членов сохраняются"},{"value":"additional","label":"Предусмотреть дополнительные допустимые имущественные права и компенсации — описать отдельно"}],"source":["gk1239","gk12311","nko20"],"explain":"Устав ассоциации обязательно определяет имущественные права и обязанности членов (п. 2 ст. 123.9 ГК РФ). Члены не приобретают долю в имуществе ассоциации, а полученная прибыль не распределяется между ними. На равных началах они могут безвозмездно пользоваться услугами ассоциации, если законом не предусмотрено иное (ст. 123.11 ГК РФ). Возмещение обоснованных расходов или дополнительные услуги можно предусматривать в пределах закона."},{"id":"assoc_property_rights_details","label":"Какие дополнительные имущественные права или компенсации нужны?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_property_rights","in":["additional"]}]},"placeholder":"Например: компенсация подтверждённых расходов при выполнении поручений ассоциации, возмещение расходов на участие в мероприятиях.","explain":"Опишите конкретные условия и получателей компенсаций. Нельзя превращать их в скрытое распределение прибыли или долей имущества при ликвидации.","source":["gk1239","gk12311","nko20"]},{"id":"assoc_extra_duties","label":"Нужны ли членам дополнительные обязанности помимо установленных законом?","type":"radio","required":true,"options":[{"value":"statutory","label":"Нет, достаточно обязательных правил и взносов"},{"value":"additional","label":"Да, предусмотреть специальные обязанности"}],"when":{"form":["association"]},"explain":"Члены обладают корпоративными правами по ГК РФ; дополнительные обязанности должны быть законными, определёнными и соразмерными целям объединения.","source":["gk12311"]},{"id":"assoc_extra_duties_details","label":"Какие дополнительные обязанности предусматриваются для членов?","type":"textarea","required":true,"when":{"all":[{"form":["association"]},{"id":"assoc_extra_duties","in":["additional"]}]}},{"id":"assoc_exit","label":"Как оформлять добровольный выход?","type":"radio","required":true,"options":[{"value":"written","label":"Письменным заявлением с подтверждением получения"},{"value":"electronic","label":"Письменным заявлением, включая предусмотренный уставом электронный способ"}],"when":{"form":["association"]},"source":["gk12311"],"explain":"Член ассоциации вправе выйти в любое время по своему усмотрению. Устав может определить процедуру, но не лишить права выхода."},{"id":"assoc_exclusion","label":"По каким основаниям возможно исключение?","type":"multi","required":true,"options":[{"value":"dues","label":"Систематическая неуплата обязательных взносов"},{"value":"breach","label":"Существенное или повторное нарушение устава"},{"value":"harm","label":"Действия, противоречащие целям ассоциации или причиняющие ей существенный вред"},{"value":"other","label":"Иные объективно определённые основания"}],"when":{"form":["association"]},"explain":"Формулировки должны быть определёнными, а процедура — предусматривать уведомление и возможность дать объяснения; решение может быть оспорено."},{"id":"assoc_exclusion_body","label":"Какой орган решает вопрос об исключении?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание"},{"value":"board","label":"Совет / правление"}],"when":{"form":["association"]}},{"id":"assoc_exit_consequences","label":"Возвращаются ли обычные членские взносы при выходе?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, уплаченные членские взносы не возвращаются"},{"value":"special","label":"Нужен специальный порядок имущественных последствий — проверить отдельно"}],"when":{"form":["association"]},"explain":"Членские взносы переходят в имущество ассоциации. Возврат обычных уплаченных взносов не следует приравнивать к распределению имущества между членами; специальные имущественные последствия прекращения членства требуют самостоятельн k12324","gk12325"]},{"id":"ano_founder_vote_details","label":"Для каких вопросов учредителей нужно повышенное большинство?","type":"textarea","required":true,"when":{"all":[{"form":["ano"]},{"id":"ano_founder_vote","in":["additional"]}]}},{"id":"ano_founder_new","label":"Нужно ли в будущем принимать новых учредителей?","type":"radio","required":true,"options":[{"value":"no","label":"Не планируется"},{"value":"yes","label":"Да, такую возможность нужно учитывать"}],"when":{"form":["ano"]},"source":["gk12324"],"explain":"Приём новых учредителей АНО осуществляется по единогласному решению учредителей. Учредитель вправе выйти из состава учредителей по своему усмотрению."},{"id":"ano_top_body","label":"Нужно ли создать дополнительно коллегиальный орган управления?","type":"radio","required":true,"options":[{"value":"no","label":"Нет, достаточна модель управления учредителями и исполнительным органом"},{"value":"yes","label":"Да, нужен постоянно действующий коллегиальный орган"}],"when":{"form":["ano"]},"source":["gk12325","nko29"],"explain":"Управление АНО осуществляют её учредители (ст. 123.25 ГК РФ). По их решению возможен постоянно действующий коллегиальный орган; его функции не должны подменять полномочия учредителей. Если он является коллегиальным высшим органом управления, работники АНО не могут составлять более одной трети его членов (ст. 29 закона № 7-ФЗ)."},{"id":"ano_board_details","label":"Каков состав, срок и круг вопросов этого органа?","type":"textarea","required":true,"when":{"all":[{"form":["ano"]},{"id":"ano_top_body","in":["yes"]}]},"placeholder":"Например: 3 человека, 3 года, согласование планов и крупных расходов."},{"id":"ano_service","label":"Кому предназначены услуги АНО?","type":"radio","required":true,"options":[{"value":"public","label":"Неопределённому кругу лиц"},{"value":"target","label":"Определённым категориям получателей"},{"value":"businesses","label":"Организациям и профессиональным сообществам"}],"when":{"form":["ano"]},"source":["gk1232

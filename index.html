ло членов, порядок назначения и прекращения полномочий, срок, порядок созыва заседаний, кворум и принятие решений. Для обычного фонда совет работает на общественных началах."},{"id":"fund_oversight","label":"Какие надзорные действия возложить на попечительский совет?","type":"radio","required":true,"options":[{"value":"standard","label":"Контроль деятельности и использования средств в пределах закона"},{"value":"extended","label":"Дополнительные регулярные отчёты и проверка проектов — описать отдельно"}],"when":{"form":["fund"]},"source":["gk12317","gk12319"]},{"id":"fund_oversight_details","label":"Какие дополнительные проверки и отчёты нужны совету?","type":"textarea","required":true,"when":{"all":[{"form":["fund"]},{"id":"fund_oversight","in":["extended"]}]}},{"id":"fund_support","label":"Как будут приниматься решения о предоставлении помощи?","type":"radio","required":true,"options":[{"value":"program","label":"По программам и утверждённым критериям"},{"value":"application","label":"По заявкам получателей с проверкой условий"},{"value":"both","label":"Оба механизма"}],"when":{"form":["fund"]}},{"id":"fund_change_charter","label":"Кто сможет принимать решение об изменении устава фонда?","type":"radio","required":true,"options":[{"value":"highest","label":"Высший коллегиальный орган (общее правило)"},{"value":"founder","label":"Учредитель, если право прямо закреплено в уставе и допустимо по закону"}],"when":{"form":["fund"]},"explain":"По ст. 123.20 ГК РФ устав фонда изменяется высшим коллегиальным органом, если устав не предусматривает изменение решением учредителя. Для нескольких учредителей порядок принятия такого решения необходимо согласовать отдельно.","source":["gk12320"]},{"id":"fund_asset","label":"Какие основные виды имущества или поступлений предполагаются?","type":"multi","required":true,"options":[{"value":"donations","label":"Пожертвования"},{"value":"grants","label":"Гранты и субсидии"},{"value":"immovable","label":"Недвижимость или крупные имущественные вклады"},{"value":"revenue","label":"Доходная деятельность, связанная с целями фонда"},{"value":"other","label":"Иные поступления"}],"when":{"form":["fund"]}}],"when":{"form":["fund"]}},{"id":"public","title":"Общественное объединение","questions":[{"id":"public_territory","label":"На какой территории будет действовать объединение?","type":"radio","required":true,"options":[{"value":"local","label":"Местный уровень"},{"value":"regional","label":"Региональный уровень"},{"value":"interregional","label":"Межрегиональный уровень"},{"value":"allrussia","label":"Общероссийский уровень"}],"when":{"form":["public_org","public_mov"]},"source":["ob14","ob20"],"explain":"Общероссийское общественное объединение должно иметь структурные подразделения более чем в половине субъектов Российской Федерации. Межрегиональное действует на территории менее половины субъектов и имеет там свои структурные подразделения. Заявленный уровень должен соответствовать фактической структуре (ст. 14 закона № 82-ФЗ)."},{"id":"public_territory_details","label":"Какие территории или регионы предполагаются?","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_territory","in":["local","regional","interregional","allrussia"]}]},"placeholder":"Например: Калининградская область; г. Калининград; перечень субъектов РФ."},{"id":"public_structure","label":"Нужны ли территориальные отделения или структурные подразделения?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, планируются"}],"when":{"form":["public_org","public_mov"]},"source":["ob14","ob20"],"explain":"Для общероссийского и межрегионального объединения территориальные структурные подразделения обязательны. Укажите, какие отделения, организации, филиалы или представительства будут действовать и где."},{"id":"public_structure_details","label":"Какие отделения, кто ими управляет, кому принадлежит имущество?","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_structure","in":["yes"]}]},"placeholder":"Например: местные отделения; порядок создания, руководители, имущество и отчётность.","source":["ob20"]},{"id":"public_branch_assets","label":"Как отделения будут распоряжаться имуществом объединения?","type":"radio","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_structure","in":["yes"]}]},"options":[{"value":"central","label":"Распоряжение имуществом централизовано; отделения действуют в пределах предоставленных полномочий"},{"value":"delegated","label":"Определённые имущественные полномочия передаются подразделениям в порядке устава и закона"}],"source":["ob20"],"explain":"Статья 20 закона № 82-ФЗ требует отразить права общественного объединения и его подразделений по управлению имуществом. Статус подразделений влияет на то, кому принадлежит имущество и кто вправе им распоряжаться."},{"id":"public_org_admission","label":"Порядок вступления в общественную организацию","type":"radio","required":true,"options":[{"value":"request","label":"Заявление и решение компетентного органа"},{"value":"request_meeting","label":"Заявление и решение общего собрания"}],"when":{"form":["public_org"]},"source":["ob20","gk1236"],"explain":"Приём в общественную организацию отличается от членства в ассоциации. Порядок вступления, права и обязанности участников необходимо закрепить в уставе. Добровольный выход не требует разрешения организации."},{"id":"public_org_exit","label":"Как фиксировать добровольный выход из общественной организации?","type":"radio","required":true,"when":{"form":["public_org"]},"options":[{"value":"received","label":"Членство прекращается при получении организацией заявления; запись в реестре носит учётный характер"},{"value":"specified","label":"С даты, указанной членом в заявлении, без обязательного согласования его выхода"}],"explain":"Член общественной организации вправе выйти из неё по своему усмотрению в любое время (п. 2 ст. 123.6 ГК РФ). Порядок подачи заявления и учёта выхода можно определить в уставе, но нельзя требовать разрешения руководителя или собрания на выход. Если участник указывает желаемую дату, правила её применения следует сформулировать так, чтобы не ограничивать право выхода.","source":["gk1236","ob20"]},{"id":"public_org_exclusion","label":"По каким дополнительным основаниям возможно исключение из общественной организации?","type":"multi","required":false,"options":[{"value":"violations","label":"Исключение за существенные нарушения устава"},{"value":"inactive","label":"Иные законные и определённые основания"}],"when":{"form":["public_org"]},"source":["gk1234","ob20"],"explain":"Право члена добровольно выйти не зависит от выбора этой опции. Здесь определяются ДОПОЛНИТЕЛЬНЫЕ основания исключения и прекращения членства. Основания должны быть определёнными; члену следует предоставить возможность дать объяснения и обжаловать решение.","help":"Добровольный выход — обязательное право участника; этот вопрос только об основаниях исключения."},{"id":"public_org_rights","label":"Какие дополнительные права и обязанности будут у членов?","type":"textarea","required":true,"when":{"form":["public_org"]},"placeholder":"Например: участие в выборах органов, право получать информацию; обязанность соблюдать устав и решения органов, при наличии — уплачивать взносы.","explain":"Устав общественного объединения должен содержать права и обязанности членов, условия и порядок приобретения и утраты членства. Обязательные права и обязанности предусмотрены законом, а специальные уточняются в уставе.","source":["gk1236","ob20"],"help":"Укажите дополнительные права и обязанности, если они нужны. Законные корпоративные права, включая право выйти по своему усмотрению в любое время, сохраняются независимо от формулировок устава."},{"id":"public_mov_participants","label":"Как будет организовано участие сторонников движения?","type":"multi","required":true,"options":[{"value":"events","label":"Участие в мероприятиях"},{"value":"initiatives","label":"Рабочие группы и инициативы"},{"value":"representatives","label":"Участие в выборе делегатов или уполномоченных лиц"}],"when":{"form":["public_mov"]},"source":["ob20"],"explain":"Общественное движение не имеет членства. Участие в деятельности не должно описываться как членство с обязательными членскими взносами."},{"id":"public_congress","label":"Как часто проводить съезд, конференцию или общее собрание?","type":"radio","required":true,"options":[{"value":"year","label":"Ежегодно"},{"value":"two","label":"Раз в два года"},{"value":"three","label":"Раз в три года"}],"when":{"form":["public_org","public_mov"]}},{"id":"public_organs","label":"Какие выборные и контрольно-ревизионные органы необходимы?","type":"textarea","required":true,"when":{"form":["public_org","public_mov"]},"placeholder":"Например: общее собрание, совет, председатель, ревизор — порядок формирования и срок каждого.","help":"Для общественного движения обязателен выборный коллегиальный постоянно действующий руководящий орган. Перечислите органы и для каждого укажите порядок формирования, срок полномочий, компетенцию и правила принятия решений.","source":["ob9","ob18","ob20"],"explain":"У общественного движения по ст. 9 закона № 82-ФЗ обязателен выборный постоянно действующий коллегиальный руководящий орган. При создании общественного объединения решением учредительного собрания формируются руководящий и контрольно-ревизионный органы (ст. 18). Устав должен определять формирование, компетенцию, сроки полномочий и порядок принятия решений (ст. 20)."},{"id":"public_organs_terms","label":"Какие сроки полномочий установить для выборных и контрольных органов?","type":"textarea","required":true,"when":{"form":["public_org","public_mov"]},"explain":"В уставе общественного объединения должны быть определены состав, формирование, компетенция, сроки полномочий и принятие решений органами и отделениями.","source":["ob20"],"placeholder":"Например: правление — 3 года, ревизор — 2 года, председатель — 3 года. Для каждого органа укажите срок."},{"id":"public_member_fees","label":"Как определить обязательные членские взносы общественной организации?","type":"radio","required":true,"options":[{"value":"by_meeting","label":"Размер, периодичность и способ уплаты по решению высшего органа"},{"value":"formula","label":"По закреплённой в уставе формуле и решению компетентного органа"}],"when":{"all":[{"form":["public_org"]},{"id":"npo_income","has":["fees"]}]},"explain":"Обычные участники общественного движения без членства не платят именно членские взносы. Для общественной организации порядок формирования имущества и обязанности членов должны быть определены уставом.","source":["ob20","nko14"]},{"id":"public_member_fees_details","label":"Опишите размер, периодичность или формулу членских взносов","type":"textarea","required":true,"when":{"all":[{"form":["public_org"]},{"id":"public_member_fees","in":["formula"]}]}},{"id":"public_symbol","label":"Будет ли собственная символика, описание которой нужно включить в устав?","type":"radio","required":true,"options":[{"value":"no","label":"Нет"},{"value":"yes","label":"Да, символика уже определена"}],"when":{"form":["public_org","public_mov"]},"source":["ob20"],"explain":"При использовании символики общественного объединения её описание включается в устав."},{"id":"public_symbol_details","label":"Опишите символику словами","type":"textarea","required":true,"when":{"all":[{"form":["public_org","public_mov"]},{"id":"public_symbol","in":["yes"]}]},"placeholder":"Например: цвет, композиция, надписи и отличительные элементы."}],"when":{"form":["public_org","public_mov"]}},{"id":"coop","title":"Потребительский кооператив","questions":[{"id":"coop_type","label":"Какой именно потребительский кооператив предполагается?","type":"radio","required":true,"options":[{"value":"general","label":"Обычный потребительский кооператив — потребуется уточнить применимость специального закона"},{"value":"housing","label":"Жилищный / жилищно-строительный / гаражный"},{"value":"credit","label":"Кредитный, сельскохозяйственный или иной специально регулируемый"}],"when":{"form":["coop"]},"source":["gk1232","co24"],"explain":"Конкретный вид кооператива определяет применимые нормы о составе членов, органах, имуществе, паях и дополнительных взносах. Анкета не может автоматически подтвердить готовность устава кооператива до проверки специального закона (например, для жилищных, кредитных или сельскохозяйственных кооперативов).","help":"Проверьте специализацию кооператива до разработки устава: для жилищных, гаражных, кредитных и сельскохозяйственных кооперативов действуют дополнительные законы."},{"id":"coop_needs","label":"Какие материальные потребности будут удовлетворять члены кооператива?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: совместное приобретение оборудования и распределение расходов."},{"id":"coop_members","label":"Кто будет членами?","type":"radio","required":true,"options":[{"value":"people","label":"Граждане"},{"value":"mix","label":"Граждане и юридические лица"},{"value":"special","label":"Другой состав, требующий проверки специального закона"}],"when":{"form":["coop"]},"source":["gk1232"]},{"id":"coop_share","label":"Каков размер паевого взноса и срок его внесения?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: 20 000 рублей, оплата при вступлении или по графику.","source":["gk1232"],"explain":"Размер, состав, порядок внесения паевых взносов и ответственность за просрочку относятся к обязательным условиям устава."},{"id":"coop_share_violations","label":"Какие последствия установлены за просрочку внесения паевого взноса?","type":"textarea","required":true,"when":{"form":["coop"]},"explain":"Ответственность члена за нарушение обязанности по внесению паевых взносов — обязательное положение устава по ст. 123.2 ГК РФ. Формулировка должна учитывать специальный закон для конкретного вида кооператива.","source":["gk1232"],"placeholder":"Например: требование об уплате, предусмотренная законом неустойка и порядок рассмотрения вопроса о членстве."},{"id":"coop_losses","label":"Как члены будут покрывать убытки кооператива?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: дополнительными взносами в установленном законом порядке.","source":["gk1233"],"explain":"В соответствии со ст. 123.3 ГК РФ члены потребительского кооператива обязаны покрыть убытки дополнительными взносами в установленные сроки и несут ограниченную размером невнесённого дополнительного взноса субсидиарную ответственность. Специальные нормы для выбранного вида могут дополнять эти правила."},{"id":"coop_losses_details","label":"Как рассчитывать и уплачивать дополнительные взносы на покрытие убытков?","type":"textarea","required":true,"when":{"form":["coop"]},"source":["gk1232","gk1233"],"placeholder":"Например: в предусмотренный законом срок после утверждения годового баланса, пропорционально паю либо по обязательной отраслевой методике.","explain":"Для потребительского кооператива ст. 123.3 ГК РФ устанавливает срок покрытия убытков и ответственность членов. Специальное отраслевое законодательство может предусматривать дополнительные требования к взносам."},{"id":"coop_admission","label":"Кто принимает новых членов?","type":"radio","required":true,"options":[{"value":"meeting","label":"Общее собрание"},{"value":"board","label":"Правление с последующим контролем по уставу"}],"when":{"form":["coop"]}},{"id":"coop_exit","label":"Как оформлять выход из кооператива?","type":"radio","required":true,"options":[{"value":"application","label":"Заявление и расчёты по паям в порядке закона и устава"},{"value":"detail","label":"Нужен особый законный порядок — описать в уставе"}],"when":{"form":["coop"]}},{"id":"coop_govern","label":"Какие органы планируются и как они формируются?","type":"textarea","required":true,"when":{"form":["coop"]},"placeholder":"Например: общее собрание, правление, председатель, ревизор; сроки и компетенция.","source":["gk1232"]}],"when":{"form":["coop"]}},{"id":"operations","title":"Практические условия и регистрация","questions":[{"id":"asset_destination","label":"На какие цели направить имущество, оставшееся после ликвидации НКО?","type":"radio","required":true,"options":[{"value":"statutory","label":"На цели, ради которых создана организация, и/или благотворительные цели по закону"},{"value":"specified","label":"Уточнить конкретные направления, не противоречащие закону"}],"when":{"form":["association","ano","fund","public_org","public_mov"]},"source":["nko20","gk12320","nko14"],"explain":"По общему правилу ст. 20 закона № 7-ФЗ имущество ликвидируемой НКО после расчётов с кредиторами направляется на предусмотренные уставом цели и/или благотворительность, если закон не требует иного. Для фонда ст. 123.20 ГК РФ требует направления остатка на ЦЕЛИ, УКАЗАННЫЕ В ЕГО УСТАВЕ (кроме случаев установленного законом возврата имущества учредителям)."},{"id":"asset_destination_specific","label":"Укажите конкретные допустимые цели использования остатка имущества","type":"textarea","required":true,"when":{"all":[{"form":["association","ano","fund","public_org","public_mov"]},{"any":[{"id":"asset_destination","in":["specified"]},{"form":["fund"]}]}]},"placeholder":"Например: финансирование программ профобразования и общественно полезных проектов.","help":"Для фонда обязательно укажите конкретные цели использования имущества при ликвидации, согласованные с предметом и целями деятельности фонда. Например, «финансирование программ поддержки детей с инвалидностью».","source":["gk12320","nko20"],"explain":"Для фонда конкретное назначение остатка имущества необходимо определить в уставе. Нельзя ограничиться неопределённой ссылкой на «любые законные цели». Для остальных НКО учитывается общее правило ст. 20 закона № 7-ФЗ."},{"id":"interest","label":"Предполагаются ли сделки с учредителями, членами органов и связанными компаниями?",   if(get('llc_capital_payment')==='money_property'&&amount===10000)add(blocking,'При капитале ровно 10 000 рублей оплата возможна только денежными средствами; неденежный вклад требует капитала сверх минимума.');
  if(founders==='1'&&get('llc_exit')&&get('llc_exit')!=='no')add(cautions,'Выход единственного участника из ООО запрещён.');
  if(get('llc_charter_mode')==='typical'&&['yes'].includes(get('llc_special_rights')))add(cautions,'Специальные права участников требуют индивидуального устава либо иной допустимой правовой конструкции.');
 }
 if(npo.includes(form)){
  if(goal==='business')add(blocking,'Извлечение прибыли для собственников не может быть основной целью НКО, даже если одновременно выбрано ООО. Для НКО нужна самостоятельная некоммерческая цель.');
  const mixedBusiness=choices().includes('ooo')&&choices().includes(form);
  if(['distribute','mixed'].includes(profits)){
   if(mixedBusiness)add(cautions,'Прибыль ООО можно распределять его участникам; прибыль НКО распределять между учредителями или членами нельзя. Эти потоки следует разделить.');
   else add(blocking,'НКО не распределяет прибыль между учредителями и членами как доход от участия.');
  }
  if(['no','part'].includes(mission)){
   if(mixedBusiness)add(cautions,'Платные услуги, не относящиеся к некоммерческой цели, целесообразно отделить в ООО; в НКО оставлять только деятельность, соответствующую её целям.');
   else add(blocking,'Платная деятельность НКО должна соответствовать уставным целям; часть планируемых услуг им не соответствует.');
  }
  if((get('npo_income')||[]).includes('fees')&&!['association','public_org','coop'].includes(form))add(blocking,'Членские взносы указаны в форме без членства.');
 }
 if(form==='coop'){
  if(['distribute','mixed'].includes(profits))add(cautions,'Кооперативные выплаты могут допускаться специальным законом для выбранного вида кооператива; нельзя применять к ним общие правила дивидендов ООО.');
  if((get('npo_income')||[]).includes('fees'))add(cautions,'Уточнить, соответствуют ли названные членскими взносы целевым или паевым платежам данного вида кооператива.');
 }
 if(form==='fund'&&get('fund_change_charter')==='founder')add(cautions,'Право учредителя фонда изменять устав нужно точно оформить по ст. 123.20 ГК РФ и проверить состав учредителей.');
 if(form==='association'&&get('assoc_top')==='delegates')add(cautions,'Съезд или конференция допускаются при фактическом числе членов более ста (ст. 65.3 ГК РФ). Подтвердите численность, порядок выборов делегатов и норму представительства.');
 const limit=get('limit_amount');if(limit&&(!Number.isFinite(numericRubles(limit))||numericRubles(limit)<=0))add(blocking,'Порог согласования сделок должен быть положительной суммой в рублях; укажите число без символа процента и описания.');
 const noticeDays=String(get('meeting_notice_days')||'').trim();if(get('meeting_notice')==='custom'&&(!/^\d+$/.test(noticeDays)||!Number.isSafeInteger(Number(noticeDays))||Number(noticeDays)<1))add(blocking,'Укажите положительное целое число календарных дней для уведомления о собраниях.');
 if(form==='association'&&['main','additional'].includes(get('paid'))&&(get('customers')||[]).includes('members'))add(cautions,'Статья 123.11 ГК РФ даёт членам ассоциации право пользоваться её услугами на равных началах безвозмездно, если законом не установлено иное; платность для членов следует отдельно согласовать.');
 if(npo.includes(form)&&isLive('npo_asset_min')){
  if(get('npo_asset_min')==='no')add(blocking,'Для приносящей доход деятельности НКО необходима имущественная обеспеченность по п. 5 ст. 50 ГК РФ; подтверждения достаточного имущества нет.');
  if(get('npo_asset_min')==='will_provide')add(cautions,'До осуществления приносящей доход деятельности НКО необходимо обеспечить и подтвердить наличие достаточного имущества по п. 5 ст. 50 ГК РФ.');
 }
 if(form==='public_org'&&['main','additional'].includes(get('paid'))&&(get('customers')||[]).includes('members'))add(cautions,'По ст. 123.6 ГК РФ члены общественной организации вправе на равных началах безвозмездно пользоваться оказываемыми ею услугами. Платные услуги членам требуют дополнительной правовой оценки.');
 if(form==='association'&&founders==='2')add(cautions,'Если в ассоциации будет два члена, заранее продумайте механизмы разрешения управленческих разногласий.');
 if(['public_org','public_mov'].includes(form)&&['allrussia','interregional'].includes(get('public_territory'))&&get('public_structure')==='no')add(blocking,'Для общероссийского и межрегионального общественного объединения требуются территориальные структурные подразделения (ст. 14 закона № 82-ФЗ).');
 if(['public_org','public_mov'].includes(form)&&['allrussia','interregional'].includes(get('public_territory'))&&get('public_structure')==='yes')add(cautions,'Проверить достаточность фактически созданных территориальных подразделений и соответствие заявленной территориальной сфере ст. 14 закона № 82-ФЗ.');
 if(form==='association'&&(get('npo_income')||[]).includes('fees')&&(get('assoc_fees')||[]).includes('none'))add(blocking,'В источниках финансирования указаны членские взносы, но для ассоциации выбран вариант без взносов; согласуйте модель.');
 if(form==='coop')add(blocking,'Для устава потребительского кооператива необходимо сначала установить точный вид и специальный закон; общая анкета не подтверждает готовность к регистрации.');
 if(types.includes('foreign'))add(cautions,'Проверить документы иностранных учредителей и возможные ограничения.');
 if((get('legal_risks')||[]).some(x=>x!=='none')){
  add(cautions,'Для выбранной сферы проверить специальные законы, лицензирование и возможные дополнительные требования.');
  if((get('legal_risks')||[]).some(x=>['finance','sro','employers','sport','religion','housing'].includes(x)))add(blocking,'Для выбранной специальной сферы общая анкета не подтверждает достаточность устава для регистрации без отраслевого юридического анализа.');
 }
 if(get('stage')==='transform')add(cautions,'Для преобразования необходимы решение о реорганизации, проверка допустимости перехода и применимых специальных норм. Заполненный устав сам по себе не заменяет регистрацию преобразования.');
 if(get('current')==='ip'&&get('stage')==='transform')add(blocking,'ИП не является юридическим лицом, его нельзя преобразовать в ООО или НКО посредством реорганизации.');
 if(get('operating_address')==='missing')add(cautions,'Перед подачей документов необходимо определить достоверный адрес для ЕГРЮЛ.');
 if(get('head_candidate')==='no')add(cautions,'Для регистрации потребуется назначить исполнительный орган.');
 const s=stats();return {form,blocking,cautions,tips,missing:s.missing,complete:!s.missing.length&&!blocking.length};
}
function snapshot(){
 const original=ACTIVE_FORM;const ss=choices();
 const commons={};const forms={};
 for(const sec of SECTIONS.filter(s=>s.id==='project'||s.id==='choice')){
   for(const q of sec.questions){if(!COMMON_IDS.has(q.id)||q.id==='form_select')continue;
    if(commons[q.id]!==undefined)continue;
    const v=COMMON[q.id];if(v===undefined)continue;
    if(sec.id==='project'&&testRule(q.when))commons[q.id]=v;
   }
 }
 for(const form of ss){const data={};const state=forForm(form,()=>({sections:liveSections(),assessment:evaluate()}));
  for(const sec of state.sections){for(const q of sec.visible){if(COMMON_IDS.has(q.id))continue;
   const val=FORM_VALUES[form]?.[q.id];if(val!==undefined)data[q.id]=val;
  }}
  forms[form]={answers:data,complete:state.assessment.complete};
 }
 ACTIVE_FORM=original;
 return {schemaVersion:12,exportedAt:new Date().toISOString(),formOrder:ss,common:commons,forms};
}
function save(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000)}
function reportSections(form,includeShared){return forForm(form,()=>liveSections().filter(sec=>includeShared||!['project','choice'].includes(sec.id)).map(sec=>({title:sec.title,questions:sec.visible.filter(answered).map(q=>({label:q.label,value:pretty(q)}))})).filter(sec=>sec.questions.length))}

function reportData(){
 const selected=choices(),forms=selected.map(form=>forForm(form,()=>({form,assessment:evaluate(),sections:reportSections(form,false)})));
 return {forms,shared:reportSections(selected[0]||null,true).filter(s=>['Проект и цели','Выбор правовой формы'].includes(s.title))};
}
function markdownEscape(value){return String(value??'').replace(/[\\`*_{}\[\]<>|]/g,'\\$&');}
function exportMarkdown(){
 const data=reportData(),lines=['# Анкета для подготовки уставов','',`Дата: ${new Date().toLocaleDateString('ru-RU')}`,'',`Выбранные формы: ${choices().map(f=>LABELS[f]).join(', ')||'не выбраны'}`];
 const addSections=(sections,level=2)=>{for(const sec of sections){lines.push('',`${'#'.repeat(level)} ${markdownEscape(sec.title)}`,'');for(const question of sec.questions)lines.push(`**${markdownEscape(question.label)}**`,'',markdownEscape(question.value),'');}};
 addSections(data.shared);
 for(const item of data.forms){lines.push('',`## ${markdownEscape(LABELS[item.form])}`);addSections(item.sections,3);
  lines.push('','### Проверка','',item.assessment.complete?'Обязательные исходные данные собраны.':'Есть незаполненные или несовместимые решения.');
  if(item.assessment.missing.length){lines.push('','Не заполнено:');item.assessment.missing.forEach(q=>lines.push(`- ${markdownEscape(q.label)}`));}
  if(item.assessment.blocking.length){lines.push('','Требуют исправления:');item.assessment.blocking.forEach(x=>lines.push(`- ${markdownEscape(x)}`));}
  if(item.assessment.cautions.length){lines.push('','Для проверки юристом:');item.assessment.cautions.forEach(x=>lines.push(`- ${markdownEscape(x)}`));}
 }
 lines.push('','---','', 'Результат является заданием для подготовки проекта устава. Требуется юридическая проверка с учётом применимого специального закона и регистрационных документов.');
 return lines.join('\n');
}
function exportJson(){save('Ответы_анкеты_ОПФ_и_устав.json',JSON.stringify(snapshot(),null,2),'application/json;charset=utf-8')}

function report(){
 const data=reportData(),selected=choices(),allDone=selected.length>0&&data.forms.every(f=>f.assessment.complete);
 const missing=data.forms.flatMap(({form,assessment})=>assessment.missing.map(q=>({form,q})));
 const blockers=data.forms.flatMap(({form,assessment})=>assessment.blocking.map(text=>({form,text})));
 const caution=data.forms.flatMap(({form,assessment})=>assessment.cautions.map(text=>({form,text})));
 const responseHtml=sections=>sections.map(s=>`<section class="response-section"><h3>${esc(s.title)}</h3>${s.questions.map(q=>`<div class="response"><span class="q-label">${esc(q.label)}</span><span class="q-value">${esc(q.value)}</span></div>`).join('')}</section>`).join('');
 $('content').innerHTML=`<h1>Итоги и документы</h1><p class="status">Выбрано форм: ${selected.length}. ${allDone?'Обязательные ответы заполнены.':'Есть незаполненные вопросы или юридические противоречия.'}</p>`+
 (missing.length?`<section class="summary"><h2>Недостающие ответы: ${missing.length}</h2><ul class="unanswered">${missing.map(x=>`<li><button type="button" data-jump="${esc(x.q.id)}" data-jumpform="${esc(x.form)}">${formMark(x.form)}: ${esc(x.q.label)}</button></li>`).join('')}</ul></section>`:'')+
 (blockers.length?`<section class="summary"><h2>Требуют исправления</h2><ul>${blockers.map(x=>`<li>${formMark(x.form)}: ${esc(x.text)}</li>`).join('')}</ul></section>`:'')+
 (caution.length?`<section class="summary"><h2>Для проверки юристом</h2><ul>${caution.map(x=>`<li>${formMark(x.form)}: ${esc(x.text)}</li>`).join('')}</ul></section>`:'')+
 `<div class="action-set no-print"><button class="btn primary" id="print">Распечатать анкету</button><button class="btn" id="export-json">Скачать JSON</button><button class="btn" id="import-json">Загрузить JSON</button><button class="btn" id="export-md">Скачать Markdown</button><button class="btn warn" id="clear">Удалить ответы</button></div>`+
 `<p class="small">JSON позволяет позднее продолжить заполнение. Markdown и печатная версия содержат общие ответы и данные каждой выбранной организации.</p>`+
 `<div id="notice" role="status" aria-live="polite" class="status"></div><input id="upload" class="sr-only" type="file" accept=".json,application/json">`+
 `<div id="print-area"><div class="print-head"><h2>Ответы для подготовки уставов</h2><p>Дата: ${esc(new Date().toLocaleDateString('ru-RU'))} · Формы: ${selected.map(formMark).join('; ')}</p></div>`+
 responseHtml(data.shared)+data.forms.map(item=>`<section class="form-report"><h2>${formMark(item.form)}</h2>${responseHtml(item.sections)}<p class="status">${item.assessment.complete?'Исходные данные собраны; требуется юридическая проверка':'Требуются дополнительные ответы или исправления'}</p></section>`).join('')+
 `<p class="report-foot">Ответы используются для разработки уставов. Для регистрации потребуются юридическая проверка и комплект необходимых документов.</p></div>`+
 `<div class="step-actions no-print"><button class="btn" id="back-form">Вернуться к вопросам</button><button class="btn primary" id="print-bottom">Распечатать</button></div>`;
 $('print').onclick=$('print-bottom').onclick=()=>window.print();
 $('export-json').onclick=exportJson;
 $('export-md').onclick=()=>save('Ответы_анкеты_ОПФ_и_устав.md',exportMarkdown(),'text/markdown;charset=utf-8');
 $('import-json').onclick=()=>$('upload').click();$('upload').onchange=importFile;
 $('clear').onclick=()=>{if(confirm('Удалить все ответы? Чтобы продолжить позднее, сначала сохраните JSON.')){
  for(const k of Object.keys(COMMON))delete COMMON[k];for(const k of Object.keys(FORM_VALUES))delete FORM_VALUES[k];ACTIVE_FORM=null;eligibilityNotice='';navigate('project');
 }};
 $('back-form').onclick=()=>switchForm(ACTIVE_FORM||choices()[0]);
 document.querySelectorAll('button[data-jump]').forEach(btn=>btn.onclick=()=>{
  const form=btn.dataset.jumpform;if(!choices().includes(form))return;ACTIVE_FORM=form;
  const sec=formSections(form).find(s=>s.visible.some(q=>q.id===btn.dataset.jump));if(sec)navigate(sec.id,btn.dataset.jump);
 });
}

async function importFile(ev){
 const file=ev.target.files?.[0];if(!file)return;const notice=$('notice');
 try{
  if(file.size>3000000)throw Error('Файл слишком большой');
  const payload=JSON.parse(await file.text()),common=Object.create(null),forms=Object.create(null);
  const clean=(q,v)=>{
   if(!q)return undefined;
   if(q.type==='radio')return typeof v==='string'&&q.options.some(o=>o.value===v)?v:undefined;
   if(q.type==='multi')return Array.isArray(v)?v.filter((x,i)=>typeof x==='string'&&q.options.some(o=>o.value===x)&&v.indexOf(x)===i).slice(0,q.max||100):undefined;
   return (typeof v==='string'||typeof v==='number')&&String(v).length<=12000?String(v):undefined;
  };
  let selected=[];
  if([9,10,11,12].includes(payload?.schemaVersion)){
   selected=Array.isArray(payload.formOrder)?payload.formOrder.filter((f,i,a)=>LABELS[f]&&a.indexOf(f)===i):[];
   for(const [id,v]of Object.entries(payload.common||{})){if(!COMMON_IDS.has(id)||id==='form_select')continue;const x=clean(BY_ID[id],v);if(x!==undefined)common[id]=x;}
   for(const f of selected){forms[f]=Object.create(null);for(const [id,v]of Object.entries(payload.forms?.[f]?.answers||{})){
    if(COMMON_IDS.has(id)||!BY_ID[id])continue;const x=clean(BY_ID[id],v);if(x!==undefined)forms[f][id]=x;
   }}
  }else if(payload?.schemaVersion===8&&payload.answers&&typeof payload.answers==='object'){
   const f=payload.answers.form;selected=LABELS[f]?[f]:[];
   for(const [id,v]of Object.entries(payload.answers)){if(id==='form')continue;
    const x=clean(BY_ID[id],v);if(x===undefined)continue;
    if(COMMON_IDS.has(id))common[id]=x;else if(selected.length)(forms[selected[0]]??=Object.create(null))[id]=x;
   }
  }else throw Error('Неизвестная версия JSON');
  if(!selected.length&&!Object.keys(common).length)throw Error('В файле нет ответов');
  for(const k of Object.keys(COMMON))delete COMMON[k];for(const k of Object.keys(FORM_VALUES))delete FORM_VALUES[k];
  Object.assign(COMMON,common);COMMON.form_select=selected;Object.assign(FORM_VALUES,forms);
  if(COMMON.current==='public')delete COMMON.current; // Deprecated ambiguous category must be selected afresh.
  for(const f of Object.keys(FORM_VALUES)){
   if(['ano','fund','public_mov'].includes(f)&&Array.isArray(FORM_VALUES[f].npo_income))FORM_VALUES[f].npo_income=FORM_VALUES[f].npo_income.filter(x=>x!=='fees');
  }
  const before=choices().length;synchronizeSelected();
  ACTIVE_FORM=choices()[0]||null;navigate(choices().length?'report':'project');
  if($('notice'))$('notice').textContent=`Ответы загружены.${before!==choices().length?' Некоторые формы исключены из выбора, поскольку не соответствуют общим условиям.':''}`;
 }catch(e){notice.textContent='Не удалось загрузить JSON: '+e.message;}finally{ev.target.value='';}
}
$('nav-toggle').addEventListener('click',()=>{const on=$('sidebar').classList.toggle('expanded');$('nav-toggle').setAttribute('aria-expanded',String(on))});
$('quick-json').onclick=exportJson;
render();
